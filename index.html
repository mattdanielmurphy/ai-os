<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI OS</title>
  </head>
  <body class="bg-gray-900 text-white font-sans h-screen flex m-0 overflow-hidden">
    <!-- Left Sidebar for Projects -->
    <div id="projects-sidebar" class="w-64 bg-gray-950 border-r border-gray-800 flex flex-col select-none shrink-0">
      <div class="p-3 border-b border-gray-800 flex items-center justify-between">
        <span class="text-xs font-semibold uppercase tracking-wider text-gray-500">Projects</span>
        <button id="add-project-btn" class="text-gray-400 hover:text-white text-xs font-bold px-1.5 py-0.5 rounded hover:bg-gray-800 transition-colors">+</button>
      </div>
      <div id="projects-list" class="flex-grow overflow-y-auto p-2 space-y-1">
        <!-- Dynanically populated tabs -->
      </div>
    </div>

    <!-- Main Workspace Container -->
    <div class="flex-grow flex flex-col min-w-0">
      <!-- Top Header Bar -->
      <div class="flex items-center justify-between p-1.5 px-3 text-xs font-medium bg-gray-850 border-b border-gray-800 select-none">
          <div class="flex items-center gap-4">
              <span class="text-gray-400 font-semibold tracking-wider">ENGINE:</span>
              <label class="flex items-center gap-1.5 cursor-pointer hover:text-white transition-colors">
                  <input type="radio" name="engine" value="agy" checked class="accent-green-500">
                  <span class="text-green-400">Gemini (agy)</span>
              </label>
              <label class="flex items-center gap-1.5 cursor-pointer hover:text-white transition-colors">
                  <input type="radio" name="engine" value="claude" class="accent-blue-500">
                  <span class="text-blue-400">Deepseek V4 Flash (Claude Code)</span>
              </label>
          </div>
          <!-- Mode status indicator & Pause Button -->
          <div class="flex items-center gap-2">
              <button id="pause-btn" class="px-2.5 py-0.5 rounded text-[10px] uppercase font-bold tracking-wider bg-red-600/20 hover:bg-red-600/40 text-red-400 border border-red-500/30 transition-all select-none cursor-pointer">
                  Pause
              </button>
          </div>
      </div>

      <!-- Terminal Panes Container -->
      <div id="panes-container" class="flex-grow flex flex-col min-h-0 relative">
          <!-- Engine/TUI Terminal Area -->
          <div id="terminal-container" class="flex-grow bg-black overflow-hidden min-h-0 relative">
              <span class="absolute top-2 right-4 text-[10px] text-gray-500 font-mono z-10 select-none uppercase tracking-wider">Engine TUI</span>
          </div>
          
          <!-- Splitter Resize Handle -->
          <div id="pane-splitter" class="h-1 bg-gray-950 hover:bg-blue-600 active:bg-blue-700 cursor-row-resize transition-all select-none border-t border-b border-gray-800"></div>
          
          <!-- Mini Terminal Area -->
          <div id="mini-terminal-container" class="h-44 bg-black overflow-hidden relative border-t border-gray-950">
              <span class="absolute top-2 right-4 text-[10px] text-gray-500 font-mono z-10 select-none uppercase tracking-wider">Mini Terminal</span>
          </div>
      </div>

      <!-- Bottom Input Area -->
      <div id="bottom-input-area" class="flex flex-col bg-gray-800 relative">
          <!-- Quick directory display / breadcrumbs -->
          <div class="px-3 py-1 bg-gray-850/80 border-b border-gray-800 text-[11px] font-mono text-gray-400 flex items-center justify-between">
              <span id="current-dir-path" class="truncate">/Users/matthewmurphy/projects/ai-os</span>
          </div>
          <!-- The Text Input -->
          <textarea 
              id="prompt-input" 
              class="w-full min-h-[3rem] max-h-40 overflow-y-auto p-3 bg-gray-800 text-white outline-none resize-none text-sm font-sans"
              rows="2"
              placeholder="Type a prompt... (Enter to send, Shift+Enter for newline)"
          ></textarea>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
