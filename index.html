<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>AI OS</title>
    </head>
    <body class="app-root" data-ui="app-root">
        <!-- Left Sidebar for Projects -->
        <div id="projects-sidebar" class="projects-sidebar" data-ui="projects-sidebar">
            <div class="projects-sidebar-header" data-ui="projects-sidebar-header">
                <span class="projects-sidebar-title">Projects</span>
                <button id="add-project-btn" class="add-project-btn" data-ui="add-project-btn">
                    +
                </button>
            </div>
            <div id="projects-list" class="projects-list" data-ui="projects-list">
                <!-- Dynamically populated tabs -->
            </div>
        </div>

        <!-- Sidebar Resize Handle -->
        <div id="sidebar-splitter" class="sidebar-splitter" data-ui="sidebar-splitter">
            <div class="sidebar-splitter-inner"></div>
        </div>

        <!-- Main Workspace Container -->
        <div class="main-workspace" data-ui="main-workspace">
            <!-- Top Header Bar -->
            <div class="top-header-bar" data-ui="top-header-bar">
                <div class="engine-selector">
                    <span class="engine-label">ENGINE:</span>
                    <label class="engine-radio-label" style="color: #4ade80;">
                        <input type="radio" name="engine" value="agy" checked style="accent-color: #22c55e;" />
                        <span>Gemini (agy)</span>
                    </label>
                    <label class="engine-radio-label" style="color: #60a5fa;">
                        <input type="radio" name="engine" value="claude" style="accent-color: #3b82f6;" />
                        <span>Deepseek V4 Flash (Claude Code)</span>
                    </label>
                </div>
                <!-- Mode status indicator & Pause Button -->
                <div class="header-actions">
                    <div id="quota-display-container" class="quota-container" data-ui="quota-container">
                        <div id="quota-display" class="quota-display hidden">
                            <!-- Quota will be rendered here -->
                        </div>
                        <div id="quota-tooltip" class="quota-tooltip hidden">
                        </div>
                    </div>
                    <button id="pause-btn" class="pause-btn" data-ui="pause-btn">
                        Pause
                    </button>
                </div>
            </div>

            <!-- Terminal Panes Container -->
            <div id="panes-container" class="panes-container" data-ui="panes-container">
                <!-- Top: Custom HTML/Markdown TUI log view -->
                <div id="preview-wrapper" class="preview-wrapper" data-ui="preview-wrapper">
                    <div class="preview-header">
                        <h3 class="preview-title">
                            <span class="preview-status-dot"></span>
                            Active Session Logs & Responses
                        </h3>
                    </div>
                    <div id="markdown-preview-pane" class="markdown-preview-pane" data-ui="markdown-preview-pane">
                        <div class="waiting-text">
                            Waiting for output...
                        </div>
                    </div>
                </div>

                <!-- TUI Toggle Bar / Divider -->
                <div id="tui-toggle-bar" class="tui-toggle-bar" data-ui="tui-toggle-bar">
                    <span class="tui-toggle-label">Engine TUI Session</span>
                    <button id="toggle-tui-btn" class="toggle-tui-btn" data-ui="toggle-tui-btn">
                        <span>Expand Terminal</span>
                        <svg class="toggle-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                </div>

                <!-- Bottom: Original agy TUI (Terminal) -->
                <div id="terminal-container" class="terminal-container" data-ui="terminal-container">
                    <!-- xterm container -->
                </div>

                <!-- Hidden legacy containers to prevent JS reference errors -->
                <div style="display: none;">
                    <div id="terminals-wrapper"></div>
                    <div id="pane-splitter"></div>
                    <div id="mini-terminal-container"></div>
                    <div id="main-splitter"></div>
                </div>
            </div>

            <!-- Bottom Input Area -->
            <div id="bottom-input-area" class="bottom-input-area" data-ui="bottom-input-area">
                <!-- Quick directory display / breadcrumbs -->
                <div class="input-breadcrumbs" data-ui="input-breadcrumbs">
                    <div class="input-toggles">
                        <label id="clear-context-container" class="toggle-label">
                            <input type="checkbox" id="clear-context-checkbox" checked class="toggle-checkbox" style="accent-color: #10b981;" />
                            <span id="clear-context-label-text">Auto-Clear Context</span>
                        </label>
                        <label id="pre-triage-container" class="toggle-label">
                            <input type="checkbox" id="pre-triage-checkbox" class="toggle-checkbox" style="accent-color: #a855f7;" />
                            <span id="pre-triage-label-text">Pre-triage Mode</span>
                        </label>
                    </div>
                    <span id="current-dir-path" class="current-dir-path">/Users/matthewmurphy/projects/ai-os</span>
                </div>
                <!-- The Text Input -->
                <textarea id="prompt-input" class="prompt-input" data-ui="prompt-input" rows="2" placeholder="Type a prompt... (Enter to send, Shift+Enter for newline)"></textarea>
            </div>
        </div>

        <!-- Add Project Modal -->
        <div id="add-project-modal" class="add-project-modal hidden" data-ui="add-project-modal">
            <div class="modal-content">
                <!-- Modal Header -->
                <div class="modal-header">
                    <h3 class="modal-title">Add Project</h3>
                    <button id="close-modal-btn" class="close-modal-btn">&times;</button>
                </div>

                <!-- Modal Body -->
                <div class="modal-body">
                    <!-- Choice Actions -->
                    <div class="modal-choices">
                        <button id="btn-choice-existing" class="choice-btn">
                            <span class="choice-icon">📂</span>
                            <span class="choice-title">Open Existing</span>
                            <span class="choice-desc">Select folder on system</span>
                        </button>
                        <button id="btn-choice-new" class="choice-btn choice-btn-new">
                            <span class="choice-icon">✨</span>
                            <span class="choice-title">Start New Project</span>
                            <span class="choice-desc">Initialize git & GitHub</span>
                        </button>
                    </div>

                    <!-- New Project Form -->
                    <div id="new-project-form" class="new-project-form hidden">
                        <div class="form-group">
                            <label for="new-proj-name" class="form-label">Project Name</label>
                            <input type="text" id="new-proj-name" placeholder="e.g. My Awesome App" class="form-input" />
                        </div>
                        <div class="form-group">
                            <label for="new-proj-git" class="form-label">GitHub Repo Name</label>
                            <input type="text" id="new-proj-git" placeholder="e.g. my-awesome-app" class="form-input" />
                        </div>
                        <button id="btn-submit-new-project" class="submit-new-project-btn">
                            Create & Initialize Project
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
