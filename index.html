<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI OS</title>
  </head>
  <body class="flex flex-col h-screen overflow-hidden bg-[#0d0e15] text-[#f1f1f4]">
    <!-- Main terminal pane -->
    <div id="terminal-container" class="flex-grow p-4 bg-black overflow-hidden"></div>

    <!-- Bottom input pane -->
    <div class="h-32 bg-[#12131c] border-t border-[#222436] p-3 flex flex-col justify-between">
      <textarea
        id="prompt-input"
        class="w-full h-full bg-transparent border-0 text-[#f1f1f4] focus:ring-0 resize-none outline-none font-mono text-sm leading-relaxed placeholder-gray-500"
        placeholder="Type a command and press Enter (Shift+Enter for newline)..."
        spellcheck="false"
      ></textarea>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
