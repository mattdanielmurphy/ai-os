<!doctype html>
<html lang="en" class="bg-transparent">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Floating Context</title>
    </head>
    <body
        class="bg-transparent m-0 overflow-hidden font-sans flex items-center justify-center h-screen w-screen"
    >
        <div data-tauri-drag-region class="w-full max-w-2xl bg-gray-900/80 backdrop-blur-2xl border border-gray-600/30 rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,0.5)] flex flex-col overflow-hidden text-gray-200 mx-4">
            <div class="relative flex items-center px-4 py-3">
                <input
                    type="text"
                    id="prompt-input"
                    class="w-full bg-transparent text-xl text-white outline-none placeholder-gray-400 font-light"
                    placeholder="Ask AI-OS..."
                    autofocus
                />
                
                <div id="context-badge" class="hidden absolute right-16 px-2 py-0.5 bg-blue-600/30 border border-blue-500/50 text-blue-300 rounded text-[10px] uppercase font-bold tracking-wider items-center gap-1 shadow-sm transition-opacity">
                    Attached
                </div>

                <button
                    id="attach-btn"
                    class="ml-3 p-2 rounded-lg bg-white/10 hover:bg-white/20 text-gray-300 hover:text-white transition-colors cursor-pointer border border-white/10 flex items-center justify-center"
                    title="Attach Chrome Canary Tab"
                >
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path>
                    </svg>
                </button>
            </div>
        </div>

        <script type="module" src="/src/floating.ts"></script>
    </body>
</html>
