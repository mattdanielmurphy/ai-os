[package]
name = "aios-core"
version = "0.1.0"
edition = "2021"
description = "Core headless session, PTY, and thread tracking library for AI-OS"

[dependencies]
portable-pty = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
