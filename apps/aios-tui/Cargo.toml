[package]
name = "aios-tui"
version = "0.1.0"
edition = "2021"
description = "Headless Terminal UI harness for AI-OS"

[dependencies]
aios-core = { path = "../../crates/aios-core" }
tokio = { version = "1", features = ["full"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
