<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI OS</title>
    <script type="module" crossorigin src="/assets/index-C3LSntkU.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CbpYg0sd.css">
  </head>
  <body class="bg-gray-900 text-white font-sans h-screen flex flex-col m-0 overflow-hidden">
    <!-- Top Header Bar -->
    <div class="flex items-center gap-4 p-1.5 px-3 text-xs font-medium bg-gray-800 border-b border-gray-700 select-none">
        <span class="text-gray-400 font-semibold tracking-wider">ENGINE:</span>
        <label class="flex items-center gap-1.5 cursor-pointer hover:text-white transition-colors">
            <input type="radio" name="engine" value="claude" checked class="accent-blue-500">
            <span class="text-blue-400">DeepSeek V4 Flash (Claude Code)</span>
        </label>
        <label class="flex items-center gap-1.5 cursor-pointer hover:text-white transition-colors">
            <input type="radio" name="engine" value="agy" class="accent-green-500">
            <span class="text-green-400">Agy (Orchestrated)</span>
        </label>
    </div>

    <!-- Top Terminal Area -->
    <div id="terminal-container" class="flex-grow bg-black overflow-hidden min-h-0 relative pb-6"></div>

    <!-- Bottom Input Area -->
    <div class="flex flex-col bg-gray-800">
        <!-- The Text Input -->
        <textarea 
            id="prompt-input" 
            class="w-full min-h-[3rem] max-h-40 overflow-y-auto p-3 bg-gray-800 text-white outline-none resize-none text-sm"
            rows="2"
            placeholder="Type a command or prompt... (Enter to send, Shift+Enter for newline, Cmd/Alt+Enter to bypass clear)"
        ></textarea>
    </div>

  </body>
</html>
