<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI OS</title>
    <script type="module" crossorigin src="/assets/index-ChKoMznh.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BgAbOBKh.css">
  </head>
  <body class="bg-gray-900 text-white font-sans h-screen flex m-0 overflow-hidden">
    <!-- Left Sidebar for Projects -->
    <div id="projects-sidebar" class="w-64 bg-gray-950 border-r border-gray-800 flex flex-col select-none shrink-0">
      <div class="p-3 border-b border-gray-800 flex items-center justify-between">
        <span class="text-xs font-semibold uppercase tracking-wider text-gray-500">Projects</span>
        <button id="add-project-btn" class="text-gray-400 hover:text-white text-xs font-bold px-1.5 py-0.5 rounded hover:bg-gray-800 transition-colors">+</button>
      </div>
      <div id="projects-list" class="flex-grow overflow-y-auto p-2 space-y-1">
        <!-- Dynanically populated tabs -->
      </div>
    </div>

    <!-- Main Workspace Container -->
    <div class="flex-grow flex flex-col min-w-0">
      <!-- Top Header Bar -->
      <div class="flex items-center justify-between p-1.5 px-3 text-xs font-medium bg-gray-850 border-b border-gray-800 select-none">
          <div class="flex items-center gap-4">
              <span class="text-gray-400 font-semibold tracking-wider">ENGINE:</span>
              <label class="flex items-center gap-1.5 cursor-pointer hover:text-white transition-colors">
                  <input type="radio" name="engine" value="agy" checked class="accent-green-500">
                  <span class="text-green-400">Gemini (agy)</span>
              </label>
              <label class="flex items-center gap-1.5 cursor-pointer hover:text-white transition-colors">
                  <input type="radio" name="engine" value="claude" class="accent-blue-500">
                  <span class="text-blue-400">Deepseek V4 Flash (Claude Code)</span>
              </label>
          </div>
          <!-- Mode status indicator & Pause Button -->
          <div class="flex items-center gap-2">
              <button id="pause-btn" class="px-2.5 py-0.5 rounded text-[10px] uppercase font-bold tracking-wider bg-red-600/20 hover:bg-red-600/40 text-red-400 border border-red-500/30 transition-all select-none cursor-pointer">
                  Pause
              </button>
          </div>
      </div>

      <!-- Terminal Panes Container -->
      <div id="panes-container" class="flex-grow flex flex-col min-h-0 relative">
          <!-- Engine/TUI Terminal Area -->
          <div id="terminal-container" class="flex-grow bg-black overflow-hidden min-h-0 relative">
              <span class="absolute top-2 right-4 text-[10px] text-gray-500 font-mono z-10 select-none uppercase tracking-wider">Engine TUI</span>
          </div>
          
          <!-- Splitter Resize Handle -->
          <div id="pane-splitter" class="h-1 bg-gray-950 hover:bg-blue-600 active:bg-blue-700 cursor-row-resize transition-all select-none border-t border-b border-gray-800"></div>
          
          <!-- Mini Terminal Area -->
          <div id="mini-terminal-container" class="h-44 bg-black overflow-hidden relative border-t border-gray-950">
              <span class="absolute top-2 right-4 text-[10px] text-gray-500 font-mono z-10 select-none uppercase tracking-wider">Mini Terminal</span>
          </div>
      </div>

      <!-- Bottom Input Area -->
      <div id="bottom-input-area" class="flex flex-col bg-gray-800 relative">
          <!-- Quick directory display / breadcrumbs -->
          <div class="px-3 py-1 bg-gray-850/80 border-b border-gray-800 text-[11px] font-mono text-gray-400 flex items-center justify-between">
              <span id="current-dir-path" class="truncate">/Users/matthewmurphy/projects/ai-os</span>
              <label class="flex items-center cursor-pointer select-none text-gray-400 hover:text-white transition-colors">
                  <input type="checkbox" id="clear-context-checkbox" checked class="accent-blue-500 rounded bg-gray-900 border-gray-700 w-3 h-3 cursor-pointer">
                  <span class="text-[10px] ml-1.5 font-sans">Auto-Clear (/clear)</span>
              </label>
          </div>
          <!-- The Text Input -->
          <textarea 
              id="prompt-input" 
              class="w-full min-h-[3rem] max-h-40 overflow-y-auto p-3 bg-gray-800 text-white outline-none resize-none text-sm font-sans"
              rows="2"
              placeholder="Type a prompt... (Enter to send, Shift+Enter for newline)"
          ></textarea>
      </div>
    </div>

    <!-- Add Project Modal -->
    <div id="add-project-modal" class="fixed inset-0 bg-black/65 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
      <div class="bg-gray-900 border border-gray-800 rounded-xl shadow-2xl w-[450px] max-w-full overflow-hidden transform scale-95 transition-transform duration-300 p-1">
        <!-- Modal Header -->
        <div class="p-4 border-b border-gray-850 flex items-center justify-between bg-gray-950/40">
          <h3 class="text-xs font-semibold uppercase tracking-wider text-gray-300">Add Project</h3>
          <button id="close-modal-btn" class="text-gray-400 hover:text-white transition-colors text-lg font-bold leading-none">&times;</button>
        </div>
        
        <!-- Modal Body -->
        <div class="p-6 space-y-6 bg-gray-900">
          <!-- Choice Actions -->
          <div class="grid grid-cols-2 gap-4">
            <button id="btn-choice-existing" class="flex flex-col items-center justify-center p-5 rounded-lg bg-gray-850/50 border border-gray-800 hover:border-blue-500 hover:bg-gray-850 transition-all text-center group cursor-pointer">
              <span class="text-3xl mb-3 text-blue-400 group-hover:scale-110 transition-transform">📂</span>
              <span class="text-xs font-bold text-gray-200">Open Existing</span>
              <span class="text-[10px] text-gray-400 mt-1.5">Select folder on system</span>
            </button>
            <button id="btn-choice-new" class="flex flex-col items-center justify-center p-5 rounded-lg bg-gray-850/50 border border-gray-800 hover:border-green-500 hover:bg-gray-850 transition-all text-center group cursor-pointer">
              <span class="text-3xl mb-3 text-green-400 group-hover:scale-110 transition-transform">✨</span>
              <span class="text-xs font-bold text-gray-200">Start New Project</span>
              <span class="text-[10px] text-gray-400 mt-1.5">Initialize git & GitHub</span>
            </button>
          </div>

          <!-- New Project Form (Hidden by default) -->
          <div id="new-project-form" class="space-y-4 hidden border-t border-gray-800/80 pt-5">
            <div class="space-y-1.5">
              <label for="new-proj-name" class="text-[10px] font-bold uppercase tracking-wider text-gray-400">Project Name</label>
              <input type="text" id="new-proj-name" placeholder="e.g. My Awesome App" class="w-full bg-gray-950 border border-gray-800 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500 transition-colors placeholder:text-gray-600">
            </div>
            <div class="space-y-1.5">
              <label for="new-proj-git" class="text-[10px] font-bold uppercase tracking-wider text-gray-400">GitHub Repo Name</label>
              <input type="text" id="new-proj-git" placeholder="e.g. my-awesome-app" class="w-full bg-gray-950 border border-gray-800 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500 transition-colors placeholder:text-gray-600">
            </div>
            <button id="btn-submit-new-project" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs py-2.5 rounded transition-all mt-2 flex items-center justify-center gap-2 cursor-pointer shadow-md shadow-blue-900/20">
              Create & Initialize Project
            </button>
          </div>
        </div>
      </div>
    </div>


  </body>
</html>
