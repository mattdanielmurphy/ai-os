<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>AI OS</title>
      <script type="module" crossorigin src="/assets/index-Dp5BRVPp.js"></script>
      <link rel="stylesheet" crossorigin href="/assets/index-CS4ej1Aq.css">
    </head>
    <body
        class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white font-sans h-screen flex m-0 overflow-hidden"
    >
        <!-- Left Sidebar for Projects -->
        <div
            id="projects-sidebar"
            class="bg-white dark:bg-gray-950 flex flex-col select-none shrink-0"
            style="width: 256px;"
        >
            <div
                class="p-3 border-b border-gray-200 dark:border-gray-800 flex items-center justify-between"
            >
                <span
                    class="text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-500"
                    >Projects</span
                >
                <button
                    id="add-project-btn"
                    class="text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white text-xs font-bold px-1.5 py-0.5 rounded hover:bg-gray-200 dark:hover:bg-gray-800 transition-colors"
                >
                    +
                </button>
            </div>
            <div
                id="projects-list"
                class="flex-grow overflow-y-auto p-2 space-y-1"
            >
                <!-- Dynanically populated tabs -->
            </div>
        </div>

        <!-- Sidebar Resize Handle -->
        <div
            id="sidebar-splitter"
            class="group w-3 cursor-col-resize select-none shrink-0 relative flex items-center justify-center bg-transparent z-10"
        >
            <div class="w-[2px] group-hover:w-[4px] group-active:w-[4px] h-full bg-gray-200 dark:bg-gray-800 group-hover:bg-blue-600 group-active:bg-blue-700 transition-all"></div>
        </div>

        <!-- Main Workspace Container -->
        <div class="flex-grow flex flex-col min-w-0">
            <!-- Top Header Bar -->
            <div
                class="flex items-center justify-between p-1.5 px-3 text-xs font-medium bg-gray-100 dark:bg-gray-850 border-b border-gray-200 dark:border-gray-800 select-none"
            >
                <div class="flex items-center gap-4">
                    <span
                        class="text-gray-600 dark:text-gray-400 font-semibold tracking-wider"
                        >ENGINE:</span
                    >
                    <label
                        class="flex items-center gap-1.5 cursor-pointer hover:text-gray-900 dark:hover:text-white transition-colors"
                    >
                        <input
                            type="radio"
                            name="engine"
                            value="agy"
                            checked
                            class="accent-green-500"
                        />
                        <span class="text-green-400">Gemini (agy)</span>
                    </label>
                    <label
                        class="flex items-center gap-1.5 cursor-pointer hover:text-gray-900 dark:hover:text-white transition-colors"
                    >
                        <input
                            type="radio"
                            name="engine"
                            value="claude"
                            class="accent-blue-500"
                        />
                        <span class="text-blue-400"
                            >Deepseek V4 Flash (Claude Code)</span
                        >
                    </label>
                </div>
                <!-- Mode status indicator & Pause Button -->
                <div class="flex items-center gap-2">
                    <button
                        id="pause-btn"
                        class="px-2.5 py-0.5 rounded text-[10px] uppercase font-bold tracking-wider bg-red-600/20 hover:bg-red-600/40 text-red-400 border border-red-500/30 transition-all select-none cursor-pointer"
                    >
                        Pause
                    </button>
                </div>
            </div>

            <!-- Terminal Panes Container -->
            <div id="panes-container" class="flex-grow flex flex-col min-h-0 relative">
                <!-- Top: Custom HTML/Markdown TUI log view -->
                <div
                    id="preview-wrapper"
                    class="flex-grow flex flex-col bg-gray-50 dark:bg-gray-900 min-w-0 min-h-0 relative"
                >
                    <div
                        class="flex items-center justify-between p-2 border-b border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 select-none shrink-0"
                    >
                        <h3
                            class="text-gray-800 dark:text-gray-200 font-medium text-xs flex items-center gap-2"
                        >
                            <span
                                class="w-2 h-2 rounded-full bg-blue-500 shadow-[0_0_8px_rgba(59,130,246,0.8)]"
                            ></span>
                            Active Session Logs & Responses
                        </h3>
                    </div>
                    <div
                        id="markdown-preview-pane"
                        class="flex-grow overflow-y-auto p-6 font-sans text-gray-700 dark:text-gray-300"
                    >
                        <div
                            class="text-gray-400 dark:text-gray-600 italic text-center mt-10"
                        >
                            Waiting for output...
                        </div>
                    </div>
                </div>

                <!-- TUI Toggle Bar / Divider -->
                <div
                    id="tui-toggle-bar"
                    class="h-7 shrink-0 border-t border-b border-gray-200 dark:border-gray-800 bg-gray-100 dark:bg-gray-950 flex items-center justify-between px-3 select-none"
                >
                    <span class="text-[10px] text-gray-500 dark:text-gray-400 font-mono uppercase tracking-wider">Engine TUI Session</span>
                    <button
                        id="toggle-tui-btn"
                        class="px-2 py-0.5 text-[9px] font-bold bg-blue-600 hover:bg-blue-700 text-white rounded transition-colors flex items-center gap-1 cursor-pointer select-none border-none outline-none"
                    >
                        <span>Expand Terminal</span>
                        <svg class="w-2.5 h-2.5 transform transition-transform duration-300 rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                </div>

                <!-- Bottom: Original agy TUI (Terminal) -->
                <div
                    id="terminal-container"
                    class="h-16 bg-white dark:bg-black overflow-hidden relative shrink-0 border-t border-gray-250 dark:border-gray-950 transition-all duration-300"
                >
                    <!-- xterm container -->
                </div>

                <!-- Hidden legacy containers to prevent JS reference errors -->
                <div style="display: none;">
                    <div id="terminals-wrapper"></div>
                    <div id="pane-splitter"></div>
                    <div id="mini-terminal-container"></div>
                    <div id="main-splitter"></div>
                </div>
            </div>

            <!-- Bottom Input Area -->
            <div
                id="bottom-input-area"
                class="flex flex-col bg-gray-200 dark:bg-gray-800 relative"
            >
                <!-- Quick directory display / breadcrumbs -->
                <div
                    class="px-3 py-1 bg-gray-100/80 dark:bg-gray-850/80 border-b border-gray-200 dark:border-gray-800 text-[11px] font-mono text-gray-600 dark:text-gray-400 flex items-center justify-between"
                >
                    <label
                        id="clear-context-container"
                        class="flex items-center cursor-pointer select-none text-xs font-semibold px-2 py-0.5 rounded border transition-all"
                    >
                        <input
                            type="checkbox"
                            id="clear-context-checkbox"
                            checked
                            class="w-3.5 h-3.5 cursor-pointer mr-1.5 accent-emerald-500"
                        />
                        <span id="clear-context-label-text"
                            >Auto-Clear Context</span
                        >
                    </label>
                    <span id="current-dir-path" class="truncate ml-4"
                        >/Users/matthewmurphy/projects/ai-os</span
                    >
                </div>
                <!-- The Text Input -->
                <textarea
                    id="prompt-input"
                    class="w-full max-w-[65ch] min-h-[3rem] max-h-40 overflow-y-auto p-3 bg-gray-200 dark:bg-gray-800 text-gray-900 line-height-lg dark:text-white outline-none resize-none text-sm font-sans"
                    rows="2"
                    placeholder="Type a prompt... (Enter to send, Shift+Enter for newline)"
                ></textarea>
            </div>
        </div>

        <!-- Add Project Modal -->
        <div
            id="add-project-modal"
            class="fixed inset-0 bg-white/65 dark:bg-black/65 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300"
        >
            <div
                class="bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl shadow-2xl w-[450px] max-w-full overflow-hidden transform scale-95 transition-transform duration-300 p-1"
            >
                <!-- Modal Header -->
                <div
                    class="p-4 border-b border-gray-200 dark:border-gray-850 flex items-center justify-between bg-white/40 dark:bg-gray-950/40"
                >
                    <h3
                        class="text-xs font-semibold uppercase tracking-wider text-gray-700 dark:text-gray-300"
                    >
                        Add Project
                    </h3>
                    <button
                        id="close-modal-btn"
                        class="text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition-colors text-lg font-bold leading-none"
                    >
                        &times;
                    </button>
                </div>

                <!-- Modal Body -->
                <div class="p-6 space-y-6 bg-gray-50 dark:bg-gray-900">
                    <!-- Choice Actions -->
                    <div class="grid grid-cols-2 gap-4">
                        <button
                            id="btn-choice-existing"
                            class="flex flex-col items-center justify-center p-5 rounded-lg bg-gray-100/50 dark:bg-gray-850/50 border border-gray-200 dark:border-gray-800 hover:border-blue-500 hover:bg-gray-100 dark:hover:bg-gray-850 transition-all text-center group cursor-pointer"
                        >
                            <span
                                class="text-3xl mb-3 text-blue-400 group-hover:scale-110 transition-transform"
                                >📂</span
                            >
                            <span
                                class="text-xs font-bold text-gray-800 dark:text-gray-200"
                                >Open Existing</span
                            >
                            <span
                                class="text-[10px] text-gray-600 dark:text-gray-400 mt-1.5"
                                >Select folder on system</span
                            >
                        </button>
                        <button
                            id="btn-choice-new"
                            class="flex flex-col items-center justify-center p-5 rounded-lg bg-gray-100/50 dark:bg-gray-850/50 border border-gray-200 dark:border-gray-800 hover:border-green-500 hover:bg-gray-100 dark:hover:bg-gray-850 transition-all text-center group cursor-pointer"
                        >
                            <span
                                class="text-3xl mb-3 text-green-400 group-hover:scale-110 transition-transform"
                                >✨</span
                            >
                            <span
                                class="text-xs font-bold text-gray-800 dark:text-gray-200"
                                >Start New Project</span
                            >
                            <span
                                class="text-[10px] text-gray-600 dark:text-gray-400 mt-1.5"
                                >Initialize git & GitHub</span
                            >
                        </button>
                    </div>

                    <!-- New Project Form (Hidden by default) -->
                    <div
                        id="new-project-form"
                        class="space-y-4 hidden border-t border-gray-800/80 pt-5"
                    >
                        <div class="space-y-1.5">
                            <label
                                for="new-proj-name"
                                class="text-[10px] font-bold uppercase tracking-wider text-gray-600 dark:text-gray-400"
                                >Project Name</label
                            >
                            <input
                                type="text"
                                id="new-proj-name"
                                placeholder="e.g. My Awesome App"
                                class="w-full bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800 rounded px-3 py-2 text-sm text-gray-900 dark:text-white focus:outline-none focus:border-blue-500 transition-colors placeholder:text-gray-600"
                            />
                        </div>
                        <div class="space-y-1.5">
                            <label
                                for="new-proj-git"
                                class="text-[10px] font-bold uppercase tracking-wider text-gray-600 dark:text-gray-400"
                                >GitHub Repo Name</label
                            >
                            <input
                                type="text"
                                id="new-proj-git"
                                placeholder="e.g. my-awesome-app"
                                class="w-full bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800 rounded px-3 py-2 text-sm text-gray-900 dark:text-white focus:outline-none focus:border-blue-500 transition-colors placeholder:text-gray-600"
                            />
                        </div>
                        <button
                            id="btn-submit-new-project"
                            class="w-full bg-blue-600 hover:bg-blue-500 text-gray-900 dark:text-white font-semibold text-xs py-2.5 rounded transition-all mt-2 flex items-center justify-center gap-2 cursor-pointer shadow-md shadow-blue-900/20"
                        >
                            Create & Initialize Project
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </body>
</html>
