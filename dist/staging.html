<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>AI-OS: Stage Execution</title>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
        <style>
            :root {
                --bg-glass: rgba(18, 18, 24, 0.9);
                --bg-glass-hover: rgba(26, 26, 36, 0.95);
                --border-color: rgba(255, 255, 255, 0.08);
                --accent-primary: #10b981; /* green */
                --accent-primary-glow: rgba(16, 185, 129, 0.25);
                --accent-secondary: #3b82f6; /* blue */
                --accent-secondary-glow: rgba(59, 130, 246, 0.25);
                --text-main: #f3f4f6;
                --text-muted: #9ca3af;
                --card-bg: rgba(255, 255, 255, 0.03);
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: 'Inter', sans-serif;
                background: transparent;
                color: var(--text-main);
                overflow: hidden;
                width: 100vw;
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                user-select: none;
            }

            /* Glassmorphism staging container */
            .staging-container {
                width: 660px;
                height: 400px;
                background: var(--bg-glass);
                backdrop-filter: blur(24px) saturate(160%);
                -webkit-backdrop-filter: blur(24px) saturate(160%);
                border: 1px solid var(--border-color);
                border-radius: 16px;
                padding: 24px;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 
                            inset 0 1px 0 rgba(255, 255, 255, 0.1);
                animation: slide-in 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            }

            @keyframes slide-in {
                from {
                    transform: translateY(20px) scale(0.96);
                    opacity: 0;
                }
                to {
                    transform: translateY(0) scale(1);
                    opacity: 1;
                }
            }

            header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 16px;
            }

            h2 {
                font-family: 'Outfit', sans-serif;
                font-size: 1.25rem;
                font-weight: 600;
                letter-spacing: -0.02em;
                background: linear-gradient(135deg, #f3f4f6 0%, #9ca3af 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .badge {
                font-size: 0.7rem;
                text-transform: uppercase;
                background: rgba(16, 185, 129, 0.1);
                border: 1px solid rgba(16, 185, 129, 0.2);
                color: var(--accent-primary);
                padding: 2px 8px;
                border-radius: 99px;
                font-weight: 700;
                letter-spacing: 0.05em;
            }

            /* Main Layout Grid */
            .main-grid {
                display: grid;
                grid-template-columns: 1.3fr 1fr;
                gap: 16px;
                flex: 1;
                min-height: 0; /* allows grid items to shrink */
                margin-bottom: 16px;
            }

            .left-panel, .right-panel {
                display: flex;
                flex-direction: column;
                gap: 12px;
                min-height: 0;
            }

            label {
                font-size: 0.75rem;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: var(--text-muted);
            }

            /* Workspace Select card */
            .select-group {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }

            .workspace-card {
                background: var(--card-bg);
                border: 1px solid var(--border-color);
                border-radius: 8px;
                padding: 10px;
                max-height: 180px;
                overflow-y: auto;
                display: flex;
                flex-direction: column;
                gap: 6px;
            }

            /* Custom scrollbar */
            .workspace-card::-webkit-scrollbar {
                width: 6px;
            }
            .workspace-card::-webkit-scrollbar-thumb {
                background: rgba(255, 255, 255, 0.1);
                border-radius: 3px;
            }

            .workspace-item {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 8px 10px;
                border-radius: 6px;
                cursor: pointer;
                transition: all 0.2s ease;
                background: rgba(255, 255, 255, 0.01);
                border: 1px solid transparent;
            }

            .workspace-item:hover {
                background: rgba(255, 255, 255, 0.04);
                border-color: rgba(255, 255, 255, 0.05);
            }

            .workspace-item.selected {
                background: rgba(59, 130, 246, 0.1);
                border-color: rgba(59, 130, 246, 0.4);
                color: #fff;
            }

            .workspace-name {
                font-size: 0.85rem;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                max-width: 260px;
                font-weight: 500;
            }

            .workspace-path {
                font-size: 0.7rem;
                color: var(--text-muted);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                max-width: 260px;
            }

            .btn-browse {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                background: rgba(255, 255, 255, 0.05);
                border: 1px solid var(--border-color);
                color: var(--text-main);
                padding: 8px;
                border-radius: 6px;
                cursor: pointer;
                font-size: 0.8rem;
                font-weight: 500;
                transition: all 0.2s ease;
            }

            .btn-browse:hover {
                background: rgba(255, 255, 255, 0.1);
                border-color: rgba(255, 255, 255, 0.15);
            }

            /* Modes card */
            .mode-switch {
                display: flex;
                gap: 8px;
                background: var(--card-bg);
                border: 1px solid var(--border-color);
                border-radius: 8px;
                padding: 4px;
            }

            .mode-btn {
                flex: 1;
                background: transparent;
                border: none;
                color: var(--text-muted);
                padding: 8px;
                border-radius: 6px;
                cursor: pointer;
                font-size: 0.8rem;
                font-weight: 600;
                transition: all 0.2s ease;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 2px;
            }

            .mode-btn.selected {
                color: #fff;
            }

            .mode-btn.selected.mode-worker {
                background: rgba(16, 185, 129, 0.15);
                border: 1px solid rgba(16, 185, 129, 0.3);
            }

            .mode-btn.selected.mode-triage {
                background: rgba(59, 130, 246, 0.15);
                border: 1px solid rgba(59, 130, 246, 0.3);
            }

            .mode-desc {
                font-size: 0.65rem;
                font-weight: 400;
                color: var(--text-muted);
            }

            /* Engine Selection */
            .engine-switch {
                display: flex;
                gap: 8px;
                background: var(--card-bg);
                border: 1px solid var(--border-color);
                border-radius: 8px;
                padding: 4px;
            }
            .engine-btn {
                flex: 1;
                background: transparent;
                border: none;
                color: var(--text-muted);
                padding: 6px;
                border-radius: 6px;
                cursor: pointer;
                font-size: 0.8rem;
                font-weight: 600;
                transition: all 0.2s ease;
            }
            .engine-btn.selected {
                background: rgba(255, 255, 255, 0.08);
                color: #fff;
                border: 1px solid rgba(255, 255, 255, 0.1);
            }

            /* Preview panel */
            .preview-card {
                background: var(--card-bg);
                border: 1px solid var(--border-color);
                border-radius: 8px;
                padding: 12px;
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 6px;
                min-height: 0;
            }

            .preview-content {
                font-family: 'Fira Code', monospace;
                font-size: 0.7rem;
                color: #34d399;
                background: rgba(0, 0, 0, 0.25);
                border-radius: 6px;
                padding: 10px;
                flex: 1;
                overflow-y: auto;
                white-space: pre-wrap;
                word-break: break-all;
                border: 1px solid rgba(255, 255, 255, 0.03);
            }

            /* Custom scrollbar for preview */
            .preview-content::-webkit-scrollbar {
                width: 6px;
            }
            .preview-content::-webkit-scrollbar-thumb {
                background: rgba(255, 255, 255, 0.1);
                border-radius: 3px;
            }

            /* Footer actions */
            footer {
                display: flex;
                align-items: center;
                justify-content: flex-end;
                gap: 12px;
                border-top: 1px solid var(--border-color);
                padding-top: 16px;
            }

            .btn-action {
                padding: 10px 20px;
                border-radius: 8px;
                font-size: 0.85rem;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.2s ease;
                display: flex;
                align-items: center;
                gap: 6px;
            }

            .btn-cancel {
                background: transparent;
                border: 1px solid var(--border-color);
                color: var(--text-muted);
            }

            .btn-cancel:hover {
                background: rgba(255, 255, 255, 0.05);
                color: #fff;
            }

            .btn-execute {
                background: var(--accent-primary);
                border: none;
                color: #121218;
                box-shadow: 0 4px 12px var(--accent-primary-glow);
            }

            .btn-execute:hover {
                background: #059669;
                transform: translateY(-1px);
                box-shadow: 0 6px 16px var(--accent-primary-glow);
            }

            .btn-execute:active {
                transform: translateY(0);
            }
        </style>
      <script type="module" crossorigin src="/assets/staging-B2vsQDxm.js"></script>
      <link rel="modulepreload" crossorigin href="/assets/tauriWrapper-BSw3ICP7.js">
    </head>
    <body>
        <div class="staging-container">
            <header>
                <h2>🚀 AI-OS Staging Overlay <span id="thread-title-badge" class="badge">Payload</span></h2>
            </header>

            <main class="main-grid">
                <!-- Left: Workspace Router -->
                <section class="left-panel">
                    <div class="select-group">
                        <label>Target Workspace</label>
                        <div id="workspace-list" class="workspace-card">
                            <!-- Populated dynamically -->
                            <div class="workspace-item selected" data-path="scratchpad">
                                <div>
                                    <div class="workspace-name">Scratchpad</div>
                                    <div class="workspace-path">Temporary sandbox execution</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <button id="btn-browse-dir" class="btn-browse">
                        📂 Choose Another Directory...
                    </button>
                </section>

                <!-- Right: Mode & Engine configuration & preview -->
                <section class="right-panel">
                    <div class="select-group">
                        <label>Execution Mode</label>
                        <div class="mode-switch">
                            <button id="btn-mode-worker" class="mode-btn selected mode-worker">
                                <span>Worker Bee</span>
                                <span class="mode-desc">Direct implementations</span>
                            </button>
                            <button id="btn-mode-triage" class="mode-btn mode-triage">
                                <span>Triage Mode</span>
                                <span class="mode-desc">Supervise & delegate</span>
                            </button>
                        </div>
                    </div>

                    <div class="select-group">
                        <label>Execution Engine</label>
                        <div class="engine-switch">
                            <button id="btn-engine-agy" class="engine-btn selected" data-engine="agy">Gemini (agy)</button>
                            <button id="btn-engine-claude" class="engine-btn" data-engine="claude">Claude Code</button>
                        </div>
                    </div>

                    <div class="preview-card">
                        <label>Task Instructions Preview</label>
                        <div id="preview-text" class="preview-content">Loading staged task payload...</div>
                    </div>
                </section>
            </main>

            <footer>
                <button id="btn-cancel-execution" class="btn-action btn-cancel">Dismiss</button>
                <button id="btn-confirm-execution" class="btn-action btn-execute">Execute Task</button>
            </footer>
        </div>

    </body>
</html>
