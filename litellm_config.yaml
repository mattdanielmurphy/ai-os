# ==============================================================================
# LEAN CODING STACK - CHEAPEST TO SMARTEST (By SWE-Bench Pro Score & Cost)
# [https://gemini.google.com/app/e7630e354aed0ca0]
# ==============================================================================
#
# --- TIER 1: ULTRA-BUDGET & BACKGROUND LOOPS ---
# 1-3. deepseek-v4-flash     ($0.04/task | 52.6% | ~100 t/s) - Background scripts, linters, log parsing
# 4. ------QUOTA OUT----- 4. gemini-3.5-flash-lite ($0.15/task | 54.2% | 350 t/s)  - Google credit speed demon for instant loops
#
# --- TIER 2: DAILY DRIVERS & PARETO WINNERS ---
# 6. muse-spark-1.1        ($0.26/task | 61.5% | ~120 t/s) - Primary daily driver (*Vercel Proxy Active)
# 7. grok-4.5              ($0.31/task | 64.7% | ~110 t/s) - Cheap step-up when Muse Spark hits a wall
# 8. ------QUOTA OUT----- 8. gemini-3.1-pro ($0.36/task | 54.2% | ~80 t/s)  - 1M+ context window for huge monorepo dumps
#
# --- TIER 3: DELEGATION & HEAVY REASONING ---
# 9. claude-sonnet-5       ($0.75/task | 63.2% | ~90 t/s)  - Multi-agent manager & task delegation
# 10. ------QUOTA OUT----- 10. gemini-3.6-flash ($0.80/task | 58.7% | 143 t/s)  - Primary high-speed Google agent driver
# 11. claude-opus-5        ($1.35/task | 71.5% | ~70 t/s)  - Heavy refactoring (50% the price of Fable)
# 12. claude-fable-5       ($2.50/task | 80.3% | ~60 t/s)  - Nuclear option for systemic architecture bugs
# ==============================================================================

common_params: &common_params
  max_tokens: 16000
  extra_headers:
        HTTP-Referer: "https://ai-os.local"
        X-Title: "AI-OS"

deepseek_params: &deepseek_v4_flash_params
  model: openrouter/deepseek/deepseek-v4-flash
  provider:
    order:
      - DeepSeek

model_list:
  # 1. DeepSeek V4 Flash - Reasoning: Low (Default)
  - model_name: deepseek-v4-flash-low
    litellm_params:
      <<: [*common_params, *deepseek_v4_flash_params]
      reasoning:
        effort: low # supported levels: low, high, max
  # 2. DeepSeek V4 Flash - Reasoning: High (Default)
  - model_name: deepseek-v4-flash-high
    litellm_params:
      <<: [*common_params, *deepseek_v4_flash_params]
      reasoning:
        effort: high # supported levels: low, high, max
  # 3. DeepSeek V4 Flash - Reasoning: Max (Default)
  - model_name: deepseek-v4-flash-max
    litellm_params:
      <<: [*common_params, *deepseek_v4_flash_params]
      reasoning:
        effort: max # supported levels: low, high, max



  # 4. DeepSeek V4 Pro - Reasoning: Max
  - model_name: deepseek-v4-flash-max
    litellm_params:
      model: openrouter/~deepseek/deepseek-v4-flash-latest
      <<: *common_params
      provider:
        order:
          - DeepSeek
      extra_headers:
        HTTP-Referer: "https://ai-os.local"
        X-Title: "AI-OS"



  # 5. Gemini 3.5 Flash-Lite (Native + Fallback)
  - model_name: gemini-3.5-flash-lite
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      <<: *common_params
  # - model_name: gemini-3.5-flash-lite-or
  #   litellm_params:
  #     model: openrouter/google/gemini-3.5-flash-lite
  #     <<: *common_params

  # 6. Muse Spark 1.1 (Custom Vercel Proxy Preserved)
  - model_name: muse-spark-1.1
    litellm_params:
      model: openrouter/meta/muse-spark-1.1
      api_base: "https://vercel-openrouter-proxy-chi.vercel.app/api/proxy/v1"
      <<: *common_params
      reasoning_effort: high

  # 7. Grok 4.5
  - model_name: grok-4.5
    litellm_params:
      model: openrouter/xai/grok-4.5
      <<: *common_params

  # 8. Gemini 3.1 Pro (Native + Fallback)
  - model_name: gemini-3.1-pro
    litellm_params:
      model: gemini/gemini-3.1-pro-preview
      <<: *common_params
  # - model_name: gemini-3.1-pro-or
  #   litellm_params:
  #     model: openrouter/google/gemini-3.1-pro-preivew
  #     <<: *common_params

  # 9. Claude Sonnet 5
  - model_name: claude-sonnet-5
    litellm_params:
      model: openrouter/anthropic/claude-5-sonnet
      <<: *common_params

  # 10. Gemini 3.6 Flash (Native + Fallback)
  - model_name: gemini-3.6-flash
    litellm_params:
      model: gemini/gemini-3.6-flash
      <<: *common_params
  # - model_name: gemini-3.6-flash-or
  #   litellm_params:
  #     model: openrouter/google/gemini-3.6-flash
  #     <<: *common_params

  # 11. Claude Opus 5
  - model_name: claude-opus-5
    litellm_params:
      model: openrouter/anthropic/claude-5-opus
      <<: *common_params

  # 12. Claude Fable 5
  - model_name: claude-fable-5
    litellm_params:
      model: openrouter/anthropic/claude-5-fable
      <<: *common_params

  # ==========================================================
  # CLAUDE CODE SUBAGENT ALIAS MAPPINGS
  # ==========================================================
  # These trick Claude Code into routing native Anthropic subagent
  # aliases to our preferred cost-efficient models automatically.

  - model_name: haiku
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-flash
      <<: *common_params
      provider:
        order:
          - DeepSeek
      extra_headers:
        HTTP-Referer: "https://ai-os.local"
        X-Title: "AI-OS"

  - model_name: sonnet
    litellm_params:
      model: openrouter/meta/muse-spark-1.1
      api_base: "https://vercel-openrouter-proxy-chi.vercel.app/api/proxy/v1"
      <<: *common_params
      reasoning_effort: high

  - model_name: opus
    litellm_params:
      model: openrouter/anthropic/claude-5-opus
      <<: *common_params

  - model_name: fable
    litellm_params:
      model: openrouter/anthropic/claude-5-fable
      <<: *common_params

router_settings:
  routing_strategy: simple-shuffle
  fallbacks:
    # Explicit wildcard catch-alls in case it passes complex strings (e.g. claude-3-5-sonnet-20241022)
    - haiku*: ["deepseek-v4-flash"]
    - sonnet*: ["muse-spark-1.1"]
    - opus*: ["claude-opus-5"]
    - fable*: ["claude-fable-5"]
    # Existing Gemini fallbacks
    - gemini-3.5-flash-lite*: ["deepseek-v4-flash"]
    - gemini-3.1-pro*: ["deepseek-v4-flash"]
    - gemini-3.6-flash*: ["deepseek-v4-flash"]

litellm_settings:
  drop_params: true
  modify_params: true
