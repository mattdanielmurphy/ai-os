<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?__FONTS__&display=swap" rel="stylesheet">
<style>
/*__KIT_CSS__*/
/*__THEME_CSS__*/
/* compact player: everything fits one viewport; the slide takes what's left (Matt, 2026-10-23) */
.wrap { max-width: 72rem; padding-block: 12px; gap: 8px; }
header { gap: 2px; } header h1 { font-size: clamp(18px, 2.6vw, 26px); }
.stage { width: min(100%, calc((100dvh - 150px) * 16 / 9)); justify-self: center; }
.stage { position: relative; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--bg); }
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage:fullscreen { border: 0; border-radius: 0; }
.rv { opacity: 0; transform: translateY(var(--rise, 18px)); transform-box: fill-box;
      transition: opacity var(--dur, .55s) ease, transform var(--dur, .55s) cubic-bezier(.2, .8, .2, 1); }
.rv.in { opacity: 1; transform: none; }
/* slide motion (no slow whole-slide drift: its last pixels crawled for seconds); parts can draw, flow, pulse, spin, grow, count and type */
#slide.enter { animation: enter .35s ease both; }
@keyframes enter { from { opacity: 0; } }
.prog { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: var(--ink); opacity: .3; transform: scaleX(0); transform-origin: left; pointer-events: none; }
.prog.run { animation: progress var(--pd, 10s) linear forwards; } .prog.stop { animation-play-state: paused; }
@keyframes progress { to { transform: scaleX(1); } }
.draw { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 1.1s cubic-bezier(.4, 0, .2, 1); }
.in .draw, .draw.in { stroke-dashoffset: 0; }
.grow { transform: scaleX(0); transform-box: fill-box; transform-origin: left; transition: transform 1s cubic-bezier(.2, .8, .2, 1); }
.in .grow { transform: none; }
.flow { stroke-dasharray: 5 9; animation: flow .9s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -14; } }
.pulse { transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; transform: scale(1.12); } }
.glow { animation: glow 2.2s ease-in-out infinite; }
@keyframes glow { 50% { opacity: .3; } }
.spin { transform-box: view-box; animation: spin 4s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.blink { animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .rv { transform: none; } .flow, .pulse, .glow, .spin, .blink  }
.stage .td { font-family: var(--display); font-weight: 800; } .stage .tb { font-family: var(--body); } .stage .tm { font-family: var(--mono); font-weight: 500; letter-spacing: .05em; }
.caption { font: 15px/1.4 var(--body); margin: 0; text-wrap: pretty; } .caption[hidden] { display: none; }
.caption .said { color: var(--ink); } .caption .unsaid { color: var(--muted); }
.controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.controls .btn { font-size: 12px; padding: 6px 10px; min-height: 30px; min-width: 30px; border-radius: 7px; }
.controls .btn[aria-pressed="true"] { border-color: var(--ink); }
.progress { gap: 4px; } .seg { font-size: 10px; gap: 3px; } .seg::before { height: 3px; }
.controls .grow { flex: 1 1 auto; }
.hint { font: 500 10.5px/1.4 var(--mono); color: var(--muted); margin: 0; }
kbd { font: 500 10px/1 var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 2px 5px; background: var(--surface); color: var(--ink); }
.start { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; text-align: center;
         background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(2px); padding: 16px; }
.start .btn { font-size: 20px; padding: 18px 28px; }
.meta { font: 500 13px/1.4 var(--mono); color: var(--muted); }
a.quiet { color: var(--muted); }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <span class="eyebrow" id="eyebrow"></span>
    <h1 id="title"></h1>
  </header>
  <div class="stage" id="stage" aria-live="polite">
    <div id="slide"></div>
    <div class="prog" id="prog"></div>
    <div class="start" id="start">
      <button class="btn primary" id="go" type="button">▶ Play reel</button>
      <span class="meta" id="meta"></span>
    </div>
  </div>
  <p class="caption" id="caption" hidden></p>
  <nav class="progress" id="progress" aria-label="Beats"></nav>
  <div class="controls">
    <button class="btn" id="prev" type="button" title="Previous beat (←)">←</button>
    <button class="btn primary" id="play" type="button" title="Play / pause (Space)">Play</button>
    <button class="btn" id="next" type="button" title="Next beat (→)">→</button>
    <button class="btn" id="replay" type="button" title="Replay this beat (R)">↺ Replay</button>
    <span class="grow"></span>
    <button class="btn" id="speed" type="button" title="Pace (S): normal, quick, or gentle for hard topics">Normal</button>
    <button class="btn" id="voice" type="button" title="Voice / take (V): if a line glitches, try the next take">Voice</button>
    <button class="btn" id="cc" type="button" title="Captions (C): show the narrator's words" aria-pressed="false">CC</button>
    <button class="btn" id="full" type="button" title="Full screen for presenting (F)">⛶</button>
  </div>
  <p class="hint"><kbd>Space</kbd> pause · <kbd>←</kbd> <kbd>→</kbd> beats · <kbd>R</kbd> replay · <kbd>S</kbd> pace (normal / quick / gentle) · <kbd>V</kbd> voice · <kbd>C</kbd> captions · <kbd>F</kbd> full screen · tap a segment to jump</p>
  <p class="hint" id="credit"></p>
</main>
<script>
const D = __DATA__;
const T = D.tweaks;
const $ = id => document.getElementById(id);
const MUTE = new URLSearchParams(location.search).has('mute'); // agents test with ?mute so Matt doesn't hear spoilers
// data: URIs → blob: URLs, so Web Audio may read them (same origin) for the ducking
function blobUrl(uri) {
  const [head, b64] = uri.split(','), bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (let k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
  return URL.createObjectURL(new Blob([bytes], { type: head.slice(5, head.indexOf(';')) }));
}
D.voices.forEach(v => v.beats.forEach(b => b.audio = blobUrl(b.audio)));
let voiceIx = 0;
try { voiceIx = Math.max(0, D.voices.findIndex(v => v.name === localStorage.getItem('reel.voice'))); } catch {}
function applyVoice() { D.voice = D.voices[voiceIx].name; D.beats.forEach((b, k) => Object.assign(b, D.voices[voiceIx].beats[k])); }
applyVoice();
const audio = new Audio();
const music = D.music ? Object.assign(new Audio(blobUrl(D.music.audio)), { loop: true, preload: 'auto' }) : null;

/* Music bed with side-chain ducking: the voice feeds an envelope follower; the louder she speaks,
   the further the music dips (duck.depth), falling fast (duck.attack) and recovering slowly (duck.release). */
let ctx = null, musicGain = null, analyser = null, buf = null, bed = 0, bedTo = 0, bedFade = 1;
function graph() {
  if (ctx) return ctx.resume();
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) { audio.muted = MUTE; if (music) { music.muted = MUTE; music.volume = T['music.level']; } return; }
  ctx = new AC();
  const master = ctx.createGain();
  master.gain.value = MUTE ? 0 : 1; // muted after the meters, so tests still see the ducking
  master.connect(ctx.destination);
  const voice = ctx.createMediaElementSource(audio);
  analyser = ctx.createAnalyser(); analyser.fftSize = 1024; buf = new Float32Array(analyser.fftSize);
  voice.connect(analyser); voice.connect(master);
  if (music) {
    musicGain = ctx.createGain(); musicGain.gain.value = 0;
    ctx.createMediaElementSource(music).connect(musicGain).connect(master);
  }
  let last = performance.now();
  setInterval(() => { // not rAF: keeps ducking while the tab is in the background
    const now = performance.now(), dt = (now - last) / 1000; last = now;
    bed += Math.sign(bedTo - bed) * Math.min(Math.abs(bedTo - bed), dt / Math.max(.05, bedFade));
    if (music && bed <= 0 && bedTo === 0 && !music.paused) music.pause();
    if (!musicGain) return;
    analyser.getFloatTimeDomainData(buf);
    let sum = 0; for (const v of buf) sum += v * v;
    const level = audio.paused ? 0 : Math.sqrt(sum / buf.length);
    const target = bed * T['music.level'] * (1 - T['duck.depth'] * Math.min(1, level / T['duck.threshold']));
    const g = musicGain.gain;
    g.setTargetAtTime(target, ctx.currentTime, target < g.value ? T['duck.attack'] : T['duck.release']);
  }, 25);
}
function bedOn() { if (!music) return; bedTo = 1; bedFade = T['music.fadeIn']; music.play().catch(() => {}); }
function bedOff(fade) { bedTo = 0; bedFade = fade; if (!ctx && music) music.pause(); }
window.reelMix = () => ({ bed, music: musicGain ? +musicGain.gain.value.toFixed(3) : null, musicTime: music && music.currentTime, voiceTime: audio.currentTime }); // for agents' tests
const SPEEDS = [1, T['pace.quick'], T['pace.gentle']];
const PACE_NAMES = { 0: 'Normal', 1: 'Quick', 2: 'Gentle' };
let i = 0, playing = false, timers = [], speed = 1, intro = false;
try { speed = +localStorage.getItem('reel.speed') || 1; } catch {}

$('title').textContent = D.title;
$('eyebrow').textContent = D.eyebrow;
function labels() {
const total = D.beats.reduce((s, b) => s + b.dur + T['beat.gap'] + T['beat.lead'], 0);
$('meta').textContent = `${D.beats.length} beats · ${Math.floor(total / 60)}:${String(Math.round(total % 60)).padStart(2, '0')} · voice: ${D.voice}` + (D.music ? ' · with music' : '');
$('credit').innerHTML = (D.figma ? `Slides made in <a class="quiet" href="${D.figma}" target="_blank" rel="noopener">Figma</a> · ` : '') + `voice by Deepgram (${D.voice})` + (D.music ? ` · music: ${D.music.name}` : '');
$('voice').textContent = 'Voice: ' + D.voice; $('voice').hidden = D.voices.length < 2;
if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: D.title, artist: D.voice });
}
labels();
$('progress').innerHTML = D.beats.map((_, k) => `<button class="seg" type="button" data-k="${k}" aria-label="Beat ${k + 1}">${k + 1}</button>`).join('');
document.documentElement.style.setProperty('--dur', T['reveal.duration'] + 's');
document.documentElement.style.setProperty('--rise', T['reveal.rise'] + 'px');

function clear() { timers.forEach(clearTimeout); timers = []; }
function later(fn, s) { timers.push(setTimeout(fn, s * 1000 / speed)); }
function parts() { return [...$('slide').querySelectorAll('[id]')].filter(n => /^a\d+$/.test(n.id)).sort((a, b) => a.id.slice(1) - b.id.slice(1)); }
function caption(frac) {
  const words = D.beats[i].say.split(' '), n = Math.round(words.length * frac);
  $('caption').innerHTML = `<span class="said">${words.slice(0, n).join(' ')}</span> <span class="unsaid">${words.slice(n).join(' ')}</span>`;
}
function activate(p, instant = false) {
  p.querySelectorAll('[data-count]').forEach(t => {
    const to = +t.dataset.count, unit = t.dataset.unit || '', ms = 1100;
    if (instant) { t.textContent = to + unit; return; }
    const t0 = performance.now();
    (function tick(now) { const f = Math.min(1, (now - t0) / ms); t.textContent = Math.round(to * (1 - Math.pow(1 - f, 3))) + unit; if (f < 1) requestAnimationFrame(tick); })(t0);
  });
  p.querySelectorAll('[data-type]').forEach(t => {
    const full = t.dataset.type;
    if (instant) { t.textContent = full; return; }
    let n = 0; t.textContent = '';
    const step = () => { t.textContent = full.slice(0, ++n); if (n < full.length) timers.push(setTimeout(step, 28 / speed)); };
    timers.push(setTimeout(step, (+t.dataset.delay || 0) * 1000 / speed));
  });
}
function marks() {
  document.querySelectorAll('.seg').forEach((s, k) => { s.classList.toggle('on', k === i); s.classList.toggle('done', k < i); });
}
function show(k, autoplay = playing) {
  clear(); audio.pause();
  i = Math.max(0, Math.min(D.beats.length - 1, k));
  const b = D.beats[i];
  $('slide').innerHTML = b.svg;
  const ps = parts();
  ps.forEach(p => p.classList.add('rv')); // before the reflow below, or parts show, fade out, then reveal
  $('slide').classList.remove('enter'); void $('slide').offsetWidth; $('slide').classList.add('enter');
  marks(); caption(0);
  audio.src = b.audio; audio.playbackRate = speed;
  $('stage').classList.toggle('live', autoplay);
  const pr = $('prog'); pr.classList.remove('run', 'stop'); void pr.offsetWidth;
  if (!autoplay) { ps.forEach(p => { p.classList.add('in'); activate(p, true); }); caption(1); return; }
  const lead = T['beat.lead'] + (intro && music ? T['music.intro'] : 0);
  intro = false;
  pr.style.setProperty('--pd', (lead + b.dur / speed + T['beat.gap'] + T['beat.holdBase'] + T['beat.holdPerText'] * document.querySelectorAll('#slide text').length) + 's'); pr.classList.add('run');
  $('stage').style.setProperty('--beat', (lead + b.dur / speed + T['beat.gap'] + 1) + 's');
  const gap = Math.min(T['reveal.maxGap'], (b.dur * T['reveal.spread']) / Math.max(1, ps.length - 1));
  requestAnimationFrame(() => ps.forEach((p, n) => later(() => { p.classList.add('in'); activate(p); }, n === 0 ? 0 : Math.max(0, lead - T['beat.lead'] + n * gap - T['reveal.advance']))));
  later(() => audio.play().catch(() => setPlaying(false)), lead);
}
function setPlaying(on) {
  playing = on; $('prog').classList.toggle('stop', !on);
  $('play').textContent = on ? 'Pause' : 'Play';
  if (on) { graph(); bedOn(); audio.play().catch(() => {}); }
  else { audio.pause(); bedOff(.6); clear(); $('stage').classList.remove('live'); parts().forEach(p => { p.classList.add('in'); activate(p, true); }); }
}
audio.addEventListener('timeupdate', () => audio.duration && caption(audio.currentTime / audio.duration));
audio.addEventListener('ended', () => {
  caption(1);
  // linger on the finished slide: longer when more is on it
  const hold = T['beat.holdBase'] + T['beat.holdPerText'] * document.querySelectorAll('#slide text').length;
  if (i < D.beats.length - 1) later(() => show(i + 1), T['beat.gap'] + hold);
  else { playing = false; $('play').textContent = 'Play'; bedOff(T['music.outro']); marks(); document.querySelectorAll('.seg').forEach(s => s.classList.add('done')); }
});
function start() { $('start').hidden = true; graph(); playing = true; intro = true; bedOn(); $('play').textContent = 'Pause'; show(0, true); }
$('go').onclick = start;
$('play').onclick = () => { if (!$('start').hidden) return start(); if (playing) setPlaying(false); else { graph(); bedOn(); playing = true; $('play').textContent = 'Pause'; audio.ended || audio.currentTime === 0 ? show(i, true) : (audio.play(), $('prog').classList.remove('stop')); } };
$('prev').onclick = () => { $('start').hidden = true; if (playing) { playing = false; $('play').textContent = 'Play'; bedOff(.6); } show(i - 1, false); }; // going back stops auto-advance until Play
$('next').onclick = () => { $('start').hidden = true; show(i + 1); };
$('replay').onclick = () => { $('start').hidden = true; graph(); bedOn(); playing = true; $('play').textContent = 'Pause'; show(i, true); };
$('progress').onclick = e => { const s = e.target.closest('.seg'); if (s) { $('start').hidden = true; show(+s.dataset.k); } };
function setSpeed(v) { speed = v; audio.playbackRate = v; $('speed').textContent = PACE_NAMES[SPEEDS.indexOf(v)] || v + '×'; try { localStorage.setItem('reel.speed', v); } catch {} }
$('voice').onclick = () => {
  voiceIx = (voiceIx + 1) % D.voices.length; applyVoice(); labels();
  try { localStorage.setItem('reel.voice', D.voice); } catch {}
  if ($('start').hidden) show(i, playing); // same beat, new narrator
};
function setCC(on) { $('caption').hidden = !on; $('cc').setAttribute('aria-pressed', on); try { localStorage.setItem('reel.cc', on ? 1 : 0); } catch {} }
$('cc').onclick = () => setCC($('caption').hidden);
try { setCC(localStorage.getItem('reel.cc') === '1'); } catch {}
$('speed').onclick = () => setSpeed(SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length]);
$('full').onclick = () => document.fullscreenElement ? document.exitFullscreen() : $('stage').requestFullscreen?.();
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', r: 'replay', s: 'speed', v: 'voice', c: 'cc', f: 'full' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('previoustrack', () => $('prev').click());
  navigator.mediaSession.setActionHandler('nexttrack', () => $('next').click());
}
setSpeed(SPEEDS.includes(speed) ? speed : 1);
show(0, false);
</script>
</body>
</html>
