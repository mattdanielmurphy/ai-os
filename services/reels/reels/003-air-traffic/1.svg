<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"><rect width="1280" height="720" class="f-bg"/><g id="a1"><circle cx="111" cy="86" r="7" class="f-accent pulse"/><text x="132" y="92" class="tm f-muted" font-size="17">REEL 03 — HOW YOUR MAC STAYS CALM</text></g><g id="a2"><text x="104" y="200" class="td f-ink" font-size="104">AIR TRAFFIC</text><text x="104" y="299" class="td f-ink" font-size="104">CONTROL</text></g><g id="a3"><text x="104" y="360" class="tb f-muted" font-size="25">Several Claude agents work on your Mac</text><text x="104" y="398" class="tb f-muted" font-size="25">at once. One queue decides who may</text><text x="104" y="436" class="tb f-muted" font-size="25">touch the keyboard, mouse and screen,</text><text x="104" y="474" class="tb f-muted" font-size="25">so nobody types over anybody. Including you.</text></g><g id="a4"><circle cx="950" cy="330" r="210" class="f-surface s-line" stroke-width="2"/><circle cx="950" cy="330" r="210" fill="none" class="s-line" stroke-width="2"/><circle cx="950" cy="330" r="143" fill="none" class="s-line" stroke-width="2"/><circle cx="950" cy="330" r="76" fill="none" class="s-line" stroke-width="2"/><line x1="740" y1="330" x2="1160" y2="330" class="s-line" stroke-width="2"/><line x1="950" y1="120" x2="950" y2="540" class="s-line" stroke-width="2"/><g class="spin" style="transform-origin:950px 330px"><path d="M950 330 L950 120 A210 210 0 0 1 1099.1 180.9 Z" class="f-accent" opacity=".22"/><line x1="950" y1="330" x2="950" y2="120" class="s-accent" stroke-width="3"/></g></g><g id="a5"><circle cx="1028" cy="214" r="9" class="f-accent pulse"/><text x="1044" y="219" class="tm f-ink" font-size="14" text-anchor="start">FIGMA TEST</text><circle cx="852" cy="430" r="9" class="f-sky pulse" style="animation-delay:.6s"/><text x="868" y="435" class="tm f-ink" font-size="14" text-anchor="start">MUSIC</text><circle cx="1062" cy="440" r="9" class="f-sky pulse" style="animation-delay:1.2s"/><text x="1078" y="445" class="tm f-ink" font-size="14" text-anchor="start">CHECK-IN</text></g><g id="a6"><line x1="104" y1="560" x2="1176" y2="560" class="s-line" stroke-width="2"/><text x="104" y="630" class="td f-ink" font-size="54" data-count="1" data-unit="">1</text><text x="104" y="660" class="tm f-muted" font-size="14" text-anchor="start">HOLDS CONTROL AT A TIME</text><text x="420" y="630" class="td f-ink" font-size="54" data-count="3" data-unit=" MIN">3 MIN</text><text x="420" y="660" class="tm f-muted" font-size="14" text-anchor="start">LONGEST WAIT IN LINE</text><text x="736" y="630" class="td f-ink" font-size="54" data-count="2" data-unit="">2</text><text x="736" y="660" class="tm f-muted" font-size="14" text-anchor="start">KINDS OF ASK</text><text x="990" y="630" class="td f-ink" font-size="54" data-count="0" data-unit="">0</text><text x="990" y="660" class="tm f-muted" font-size="14" text-anchor="start">SURPRISE KEYSTROKES</text></g></svg>
