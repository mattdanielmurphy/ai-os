<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"><rect width="1280" height="720" class="f-bg"/><g id="a1"><circle cx="111" cy="86" r="7" class="f-accent pulse"/><text x="132" y="92" class="tm f-muted" font-size="17">CH 01 — THE RULE</text></g><g id="a2"><text x="104" y="168" class="td f-ink" font-size="62">ASK FIRST. ALWAYS.</text></g><g id="a3"><text x="104" y="236" class="tb f-muted" font-size="24">Before an agent touches anything you can see or hear, it runs one</text><text x="104" y="272" class="tb f-muted" font-size="24">command, says what it wants and why, then waits for a yes.</text></g><g id="a4"><rect x="104" y="316" width="1072" height="132" rx="6" class="f-ink s-ink" stroke-width="2" /><circle cx="132" cy="340" r="6" class="f-muted"/><circle cx="152" cy="340" r="6" class="f-muted"/><circle cx="172" cy="340" r="6" class="f-muted"/><text x="132" y="392" class="tm f-bg" font-size="21" data-type="$ claude-control ask &quot;Click Export in Figma&quot; 3 --thread cmsg_…">$ claude-control ask "Click Export in Figma" 3 --thread cmsg_…</text></g><g id="a5"><text x="132" y="428" class="tm f-accent" font-size="21">granted 7f3a</text><rect x="320" y="410" width="12" height="22" class="f-accent blink"/></g><g id="a6"><text x="104" y="512" class="tm f-muted" font-size="15" text-anchor="start">ALL OF THESE COUNT AS INPUT</text><rect x="104" y="532" width="200" height="56" rx="28" class="f-surface s-accent" stroke-width="2"/><text x="204.0" y="566" class="tm f-ink" font-size="16" text-anchor="middle">KEYS &amp; CLICKS</text><rect x="320" y="532" width="286" height="56" rx="28" class="f-surface s-accent" stroke-width="2"/><text x="463.0" y="566" class="tm f-ink" font-size="16" text-anchor="middle">OPENING FILES &amp; APPS</text><rect x="622" y="532" width="236" height="56" rx="28" class="f-surface s-accent" stroke-width="2"/><text x="740.0" y="566" class="tm f-ink" font-size="16" text-anchor="middle">FOCUSING WINDOWS</text><rect x="874" y="532" width="302" height="56" rx="28" class="f-surface s-accent" stroke-width="2"/><text x="1025.0" y="566" class="tm f-ink" font-size="16" text-anchor="middle">PLAY · PAUSE · VOLUME</text></g><g id="a7"><text x="104" y="640" class="tb f-muted" font-size="21">Even a file opening in Finder, or music pausing, is a change on your screen or speakers.</text></g></svg>
