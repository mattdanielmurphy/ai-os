<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"><rect width="1280" height="720" class="f-bg"/><g id="a1"><circle cx="111" cy="86" r="7" class="f-accent pulse"/><text x="132" y="92" class="tm f-muted" font-size="17">CH 04 — YOU&#x27;RE IN CHARGE</text></g><g id="a2"><text x="104" y="168" class="td f-ink" font-size="62">ONE KEY TO SAY NOT NOW</text></g><g id="a3"><text x="104" y="236" class="tb f-muted" font-size="24">Every ask can be answered from the keyboard, without finding a window.</text></g><g id="a4"><rect x="104" y="300" width="96" height="72" rx="8" class="f-surface s-ink" stroke-width="2"/><rect x="104" y="366" width="96" height="8" rx="3" class="f-ink"/><text x="152.0" y="345" class="tm f-ink" font-size="20" text-anchor="middle">ESC</text><text x="104" y="440" class="td f-ink" font-size="40">NOT NOW</text><text x="104" y="480" class="tb f-muted" font-size="22">The agent backs off and</text><text x="104" y="512" class="tb f-muted" font-size="22">waits for your go. It</text><text x="104" y="544" class="tb f-muted" font-size="22">won&#x27;t re-ask on its own.</text><text x="104" y="600" class="tm f-muted" font-size="14" text-anchor="start">exit 1 · cancelled</text></g><g id="a5"><rect x="464" y="300" width="96" height="72" rx="8" class="f-surface s-ink" stroke-width="2"/><rect x="464" y="366" width="96" height="8" rx="3" class="f-ink"/><text x="512.0" y="345" class="tm f-ink" font-size="20" text-anchor="middle">ESC</text><rect x="572" y="300" width="96" height="72" rx="8" class="f-surface s-ink" stroke-width="2"/><rect x="572" y="366" width="96" height="8" rx="3" class="f-ink"/><text x="620.0" y="345" class="tm f-ink" font-size="20" text-anchor="middle">ESC</text><text x="464" y="440" class="td f-bad" font-size="40">STOP</text><text x="464" y="480" class="tb f-muted" font-size="22">Ends that agent&#x27;s whole</text><text x="464" y="512" class="tb f-muted" font-size="22">task, and blocks it from</text><text x="464" y="544" class="tb f-muted" font-size="22">asking again for</text><text x="660" y="544" class="td f-bad" font-size="34" data-count="2" data-unit=" HOURS">2 HOURS</text><text x="464" y="600" class="tm f-muted" font-size="14" text-anchor="start">exit 3 · stopped</text></g><g id="a6"><rect x="824" y="300" width="96" height="72" rx="36" class="f-surface s-sky" stroke-width="2"/><text x="872" y="345" class="tm f-ink" font-size="20" text-anchor="middle">30S</text><rect x="936" y="300" width="96" height="72" rx="36" class="f-surface s-sky" stroke-width="2"/><text x="984" y="345" class="tm f-ink" font-size="20" text-anchor="middle">1M</text><rect x="1048" y="300" width="96" height="72" rx="36" class="f-surface s-sky" stroke-width="2"/><text x="1096" y="345" class="tm f-ink" font-size="20" text-anchor="middle">5M</text><text x="824" y="440" class="td f-ink" font-size="40">SNOOZE</text><text x="824" y="480" class="tb f-muted" font-size="22">Not yet? It waits that</text><text x="824" y="512" class="tb f-muted" font-size="22">long and keeps its place</text><text x="824" y="544" class="tb f-muted" font-size="22">in the line.</text><text x="824" y="600" class="tm f-muted" font-size="14" text-anchor="start">still queued</text></g></svg>
