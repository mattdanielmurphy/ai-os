<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"><rect width="1280" height="720" class="f-bg"/><g id="a1"><circle cx="111" cy="86" r="7" class="f-accent pulse"/><text x="132" y="92" class="tm f-muted" font-size="17">CH 02 — THE QUEUE</text></g><g id="a2"><text x="104" y="168" class="td f-ink" font-size="62">ONE QUEUE. ONE PILOT.</text></g><g id="a3"><text x="104" y="236" class="tb f-muted" font-size="24">Asks line up in the order they arrive. Only one agent holds control;</text><text x="104" y="272" class="tb f-muted" font-size="24">the rest wait their turn, up to three minutes, then give up politely.</text></g><g id="a4"><rect x="104" y="330" width="230" height="140" rx="4" class="f-surface s-line" stroke-width="2" /><text x="124" y="366" class="tm f-muted" font-size="15" text-anchor="start">WAITING #2</text><text x="124" y="414" class="td f-ink" font-size="36">CHECK-IN</text><text x="124" y="446" class="tm f-muted" font-size="14" text-anchor="start">queued:2</text></g><g id="a5"><rect x="364" y="330" width="230" height="140" rx="4" class="f-surface s-line" stroke-width="2" /><text x="384" y="366" class="tm f-muted" font-size="15" text-anchor="start">WAITING #1</text><text x="384" y="414" class="td f-ink" font-size="36">MUSIC</text><text x="384" y="446" class="tm f-muted" font-size="14" text-anchor="start">queued:1</text><line x1="334" y1="400" x2="364" y2="400" class="s-accent flow" stroke-width="3"/><line x1="594" y1="400" x2="700" y2="400" class="s-accent flow" stroke-width="3"/></g><g id="a6"><rect x="700" y="318" width="330" height="164" rx="6" fill="none" class="s-accent glow" stroke-width="8"/><rect x="700" y="318" width="330" height="164" rx="6" class="f-accent s-accent" stroke-width="2" /><text x="724" y="356" class="tm f-accent-ink" font-size="15" text-anchor="start">HAS CONTROL</text><text x="724" y="412" class="td f-accent-ink" font-size="44">FIGMA TEST</text><text x="724" y="452" class="tm f-accent-ink" font-size="14" text-anchor="start">granted · banner showing</text></g><g id="a7"><path d="M1030 400 H1100 V530 H220 V470" pathLength="1" fill="none" class="s-muted draw" stroke-width="2" stroke-dasharray="1"/><text x="1112" y="405" class="tm f-ink" font-size="15" text-anchor="start">DONE</text><text x="640" y="556" class="tm f-muted" font-size="14" text-anchor="middle">done hands control to the next in line</text></g><g id="a8"><text x="104" y="640" class="td f-ink" font-size="54" data-count="1" data-unit="">1</text><text x="104" y="670" class="tm f-muted" font-size="14" text-anchor="start">HOLDS CONTROL</text><text x="420" y="640" class="td f-ink" font-size="54" data-count="2" data-unit="">2</text><text x="420" y="670" class="tm f-muted" font-size="14" text-anchor="start">WAITING THEIR TURN</text><text x="736" y="640" class="td f-ink" font-size="54" data-count="180" data-unit=" S">180 S</text><text x="736" y="670" class="tm f-muted" font-size="14" text-anchor="start">THEN THEY GIVE UP</text></g></svg>
