<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"><rect width="1280" height="720" class="f-bg"/><g id="a1"><circle cx="111" cy="86" r="7" class="f-accent pulse"/><text x="132" y="92" class="tm f-muted" font-size="17">THAT&#x27;S IT</text></g><g id="a2"><text x="104" y="190" class="td f-ink" font-size="80">NOBODY FIGHTS</text><text x="104" y="266" class="td f-ink" font-size="80">FOR THE KEYBOARD</text></g><g id="a3"><path d="M110 352 l9 9 l17 -19" pathLength="1" fill="none" class="s-good draw" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="transition-delay:0.0s"/><text x="154" y="360" class="tb f-ink" font-size="27">Agents ask before touching anything</text><path d="M110 412 l9 9 l17 -19" pathLength="1" fill="none" class="s-good draw" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="transition-delay:0.25s"/><text x="154" y="420" class="tb f-ink" font-size="27">One holds control; the rest wait in line</text><path d="M110 472 l9 9 l17 -19" pathLength="1" fill="none" class="s-good draw" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="transition-delay:0.5s"/><text x="154" y="480" class="tb f-ink" font-size="27">Esc means not now. Esc Esc means stop</text><path d="M110 532 l9 9 l17 -19" pathLength="1" fill="none" class="s-good draw" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="transition-delay:0.75s"/><text x="154" y="540" class="tb f-ink" font-size="27">Click a banner to see who&#x27;s flying</text></g><g id="a4"><circle cx="1000" cy="400" r="170" class="f-surface s-line" stroke-width="2"/><circle cx="1000" cy="400" r="170" fill="none" class="s-line" stroke-width="2"/><circle cx="1000" cy="400" r="116" fill="none" class="s-line" stroke-width="2"/><circle cx="1000" cy="400" r="61" fill="none" class="s-line" stroke-width="2"/><line x1="830" y1="400" x2="1170" y2="400" class="s-line" stroke-width="2"/><line x1="1000" y1="230" x2="1000" y2="570" class="s-line" stroke-width="2"/><g class="spin" style="transform-origin:1000px 400px"><path d="M1000 400 L1000 230 A170 170 0 0 1 1120.7 279.3 Z" class="f-accent" opacity=".22"/><line x1="1000" y1="400" x2="1000" y2="230" class="s-accent" stroke-width="3"/></g><circle cx="1060" cy="330" r="9" class="f-accent pulse" style="animation-delay:0.0s"/><text x="1076" y="335" class="tm f-ink" font-size="14" text-anchor="start">LANDED</text><circle cx="930" cy="470" r="9" class="f-accent pulse" style="animation-delay:0.5s"/><text x="946" y="475" class="tm f-ink" font-size="14" text-anchor="start">WAITING</text></g><g id="a5"><text x="104" y="640" class="tm f-muted" font-size="14" text-anchor="start">MADE WITH A DEEPGRAM VOICE · MUSIC UNDER, DUCKED SO SHE STAYS CLEAR</text></g></svg>
