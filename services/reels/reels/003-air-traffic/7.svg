<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"><rect width="1280" height="720" class="f-bg"/><g id="a1"><circle cx="111" cy="86" r="7" class="f-accent pulse"/><text x="132" y="92" class="tm f-muted" font-size="17">CH 06 — ROBOTS TAKE A NUMBER</text></g><g id="a2"><text x="104" y="168" class="td f-ink" font-size="62">YOUR AUTOMATIONS QUEUE TOO</text></g><g id="a3"><text x="104" y="236" class="tb f-muted" font-size="24">Hammerspoon, Keyboard Maestro and scripts use the same queue, silently:</text><text x="104" y="272" class="tb f-muted" font-size="24">claude-control lock. No banner, but no collisions either.</text></g><g id="a4"><rect x="104" y="340" width="300" height="96" rx="4" class="f-surface s-line" stroke-width="2" /><text x="124" y="374" class="tm f-muted" font-size="15" text-anchor="start">YOU PRESS A KEY</text><text x="124" y="416" class="td f-ink" font-size="32">A HOTKEY, A PAD</text><line x1="404" y1="388" x2="860" y2="388" class="s-good flow" stroke-width="4"/><circle r="8" class="f-good"><animateMotion dur="1.1s" repeatCount="indefinite" path="M404 388 H860"/></circle><rect x="860" y="340" width="316" height="96" rx="4" class="f-good-bg s-good" stroke-width="2" /><text x="880" y="374" class="tm f-good" font-size="15" text-anchor="start">RUNS NOW</text><text x="880" y="416" class="td f-ink" font-size="32">NEVER QUEUED</text></g><g id="a5"><rect x="104" y="486" width="300" height="96" rx="4" class="f-surface s-line" stroke-width="2" /><text x="124" y="520" class="tm f-muted" font-size="15" text-anchor="start">RUNS ON ITS OWN</text><text x="124" y="562" class="td f-ink" font-size="32">TIMERS · AGENTS</text><line x1="404" y1="534" x2="520" y2="534" class="s-accent flow" stroke-width="4"/><rect x="520" y="496" width="230" height="76" rx="4" class="f-surface s-accent" stroke-width="2" /><text x="635" y="541" class="tm f-ink" font-size="15" text-anchor="middle">lock · wait turn</text><line x1="750" y1="534" x2="860" y2="534" class="s-accent flow" stroke-width="4"/><circle r="8" class="f-accent"><animateMotion dur="3.2s" repeatCount="indefinite" keyPoints="0;0.27;0.27;1" keyTimes="0;0.25;0.65;1" calcMode="linear" path="M404 534 H860"/></circle><rect x="860" y="486" width="316" height="96" rx="4" class="f-surface s-line" stroke-width="2" /><text x="880" y="520" class="tm f-muted" font-size="15" text-anchor="start">RUNS IN TURN</text><text x="880" y="562" class="td f-ink" font-size="32">NO BANNER</text></g><g id="a6"><text x="104" y="640" class="tb f-muted" font-size="20">Rule of thumb: quick things you trigger run instantly; anything that holds input for more than a second or two waits.</text></g></svg>
