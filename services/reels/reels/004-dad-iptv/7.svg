<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"><rect width="1280" height="720" class="f-bg"/><g id="a1"><circle cx="111" cy="86" r="7" class="f-accent pulse"/><text x="132" y="92" class="tm f-muted" font-size="17">CH 06 — THE FREE ONE</text></g><g id="a2"><text x="104" y="168" class="td f-ink" font-size="62">PLEX: FREE, WITH ADS</text></g><g id="a3"><text x="104" y="236" class="tb f-muted" font-size="24">Not cable, but a lot of watching for $0.</text></g><g id="a4"><rect x="104" y="290" width="520" height="84" rx="6" class="f-good-bg s-good" stroke-width="2" /><text x="126" y="332" class="td f-ink" font-size="30">LIVE CHANNELS</text><text x="126" y="362" class="tb f-muted" font-size="19">Hundreds: news, movies, kids, some sports.</text><rect x="656" y="290" width="520" height="84" rx="6" class="f-good-bg s-good" stroke-width="2" /><text x="678" y="332" class="td f-ink" font-size="30">ON-DEMAND LIBRARY</text><text x="678" y="362" class="tb f-muted" font-size="19">Tens of thousands of movies and shows.</text></g><g id="a5"><rect x="104" y="394" width="520" height="84" rx="6" class="f-good-bg s-good" stroke-width="2" /><text x="126" y="436" class="td f-ink" font-size="30">CANADIAN CHANNELS</text><text x="126" y="466" class="tb f-muted" font-size="19">Bell Media&#x27;s CTV News and TSN The Ocho.</text><rect x="656" y="394" width="520" height="84" rx="6" class="f-good-bg s-good" stroke-width="2" /><text x="678" y="436" class="td f-ink" font-size="30">RUNS ON YOUR TV</text><text x="678" y="466" class="tb f-muted" font-size="19">App for Fire TV, Roku and most smart TVs.</text></g><g id="a6"><text x="104" y="540" class="tb f-muted" font-size="20">No NHL or premium cable channels.</text><text x="104" y="570" class="tb f-muted" font-size="20">Channel counts vary by source (about 250–600+); check Plex&#x27;s guide.</text></g></svg>
