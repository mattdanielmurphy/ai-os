g id="a6"><text x="104" y="584" class="tb f-muted" font-size="19">List prices from this month; check each site before signing up.</text><text x="104" y="612" class="tb f-muted" font-size="19">Netflix with ads $7.99, Prime $99 a year, Apple One from $22.95 a month.</text></g></svg>
