<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"><rect width="1280" height="720" class="f-bg"/><g id="a1"><circle cx="111" cy="86" r="7" class="f-accent pulse"/><text x="132" y="92" class="tm f-muted" font-size="17">CH 03 — THE BIG ONE: LEGAL</text></g><g id="a2"><text x="104" y="168" class="td f-ink" font-size="54">IT SELLS STREAMS NOBODY LICENSED</text></g><g id="a3"><rect x="104" y="250" width="340" height="130" rx="6" class="f-bad-bg s-bad" stroke-width="2" /><text x="126" y="292" class="td f-ink" font-size="30">SELLING</text><text x="126" y="322" class="tb f-muted" font-size="19">Clearly illegal</text><text x="126" y="348" class="tb f-muted" font-size="19">in Canada.</text></g><g id="a4"><rect x="470" y="250" width="340" height="130" rx="6" class="f-bad-bg s-bad" stroke-width="2" /><text x="492" y="292" class="td f-ink" font-size="30">BLOCKING</text><text x="492" y="322" class="tb f-muted" font-size="19">Courts made ISPs</text><text x="492" y="348" class="tb f-muted" font-size="19">block these sites.</text></g><g id="a5"><rect x="836" y="250" width="340" height="130" rx="6" class="f-surface s-accent" stroke-width="2" /><text x="858" y="292" class="td f-ink" font-size="30">WATCHING</text><text x="858" y="322" class="tb f-muted" font-size="19">Grey zone.</text><text x="858" y="348" class="tb f-muted" font-size="19">Not clearly safe.</text></g><g id="a6"><text x="104" y="440" class="tb f-muted" font-size="22">Court blocking began with a 2019 order against GoldTV and was upheld on appeal in 2021.</text><rect x="104" y="490" width="1072" height="130" rx="6" class="f-ink s-ink" stroke-width="2" /><text x="132" y="545" class="td f-bg" font-size="34">Do not assume nobody will come after you.</text><text x="132" y="588" class="tb f-bg" font-size="22">For a firm answer about Dad personally, ask a lawyer.</text></g></svg>
