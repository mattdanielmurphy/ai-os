<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"><rect width="1280" height="720" class="f-bg"/><g id="a1"><circle cx="111" cy="86" r="7" class="f-accent pulse"/><text x="132" y="92" class="tm f-muted" font-size="17">CH 03 — THE UPSIDE</text></g><g id="a2"><text x="104" y="168" class="td f-ink" font-size="62">WHY IT&#x27;S TEMPTING</text></g><g id="a3"><rect x="104" y="260" width="520" height="96" rx="6" class="f-good-bg s-good" stroke-width="2" /><text x="126" y="302" class="td f-ink" font-size="30">BIG SAVING</text><text x="126" y="332" class="tb f-muted" font-size="19">Often well under cable or Telus TV.</text></g><g id="a4"><rect x="656" y="260" width="520" height="96" rx="6" class="f-good-bg s-good" stroke-width="2" /><text x="678" y="302" class="td f-ink" font-size="30">LOTS OF CHANNELS</text><text x="678" y="332" class="tb f-muted" font-size="19">Live sports, news, movies. Count unverified.</text></g><g id="a5"><rect x="104" y="380" width="520" height="96" rx="6" class="f-good-bg s-good" stroke-width="2" /><text x="126" y="422" class="td f-ink" font-size="30">EASY TO START</text><text x="126" y="452" class="tb f-muted" font-size="19">Arrives as a plug-in Firestick.</text></g><g id="a6"><rect x="656" y="380" width="520" height="96" rx="6" class="f-good-bg s-good" stroke-width="2" /><text x="678" y="422" class="td f-ink" font-size="30">LOW-RISK TRIAL</text><text x="678" y="452" class="tb f-muted" font-size="19">Trials and monthly plans cap the cost.</text></g><g id="a7"><rect x="104" y="520" width="1072" height="100" rx="6" class="f-surface s-line" stroke-width="2" /><text x="132" y="580" class="tb f-ink" font-size="25">A coworker uses it and vouches for it. That counts, but it is one user.</text></g></svg>
