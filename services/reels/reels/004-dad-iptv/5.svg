<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"><rect width="1280" height="720" class="f-bg"/><g id="a1"><circle cx="111" cy="86" r="7" class="f-accent pulse"/><text x="132" y="92" class="tm f-muted" font-size="17">CH 04 — WILL IT JUST WORK?</text></g><g id="a2"><text x="104" y="168" class="td f-ink" font-size="62">NOT LIKE TELUS TV</text></g><g id="a3"><text x="104" y="236" class="tb f-muted" font-size="22">Telus is a company with a phone number.</text><text x="104" y="268" class="tb f-muted" font-size="22">This is a reseller of streams the channels never licensed.</text></g><g id="a4"><rect x="104" y="290" width="520" height="84" rx="6" class="f-bad-bg s-bad" stroke-width="2" /><text x="126" y="332" class="td f-ink" font-size="30">IT CAN VANISH</text><text x="126" y="362" class="tb f-muted" font-size="19">Mid-term, with no refund (unverified).</text></g><g id="a5"><rect x="656" y="290" width="520" height="84" rx="6" class="f-bad-bg s-bad" stroke-width="2" /><text x="678" y="332" class="td f-ink" font-size="30">PEAK-HOUR BUFFERING</text><text x="678" y="362" class="tb f-muted" font-size="19">Hockey night is when it strains.</text></g><g id="a6"><rect x="104" y="394" width="520" height="84" rx="6" class="f-bad-bg s-bad" stroke-width="2" /><text x="126" y="436" class="td f-ink" font-size="30">SITES GET BLOCKED</text><text x="126" y="466" class="tb f-muted" font-size="19">An ISP block may need a VPN.</text></g><g id="a7"><rect x="656" y="394" width="520" height="84" rx="6" class="f-bad-bg s-bad" stroke-width="2" /><text x="678" y="436" class="td f-ink" font-size="30">NO MONEY BACK</text><text x="678" y="466" class="tb f-muted" font-size="19">E-transfer has no chargeback.</text></g><g id="a8"><text x="104" y="540" class="tb f-muted" font-size="21">Plus payment details go to a seller no one holds accountable.</text></g></svg>
