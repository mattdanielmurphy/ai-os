<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"><rect width="1280" height="720" class="f-bg"/><g id="a1"><circle cx="111" cy="86" r="7" class="f-accent pulse"/><text x="132" y="92" class="tm f-muted" font-size="17">CH 04 — WHAT CAN GO WRONG</text></g><g id="a2"><text x="104" y="168" class="td f-ink" font-size="62">THE EVERYDAY RISKS</text></g><g id="a3"><rect x="104" y="230" width="520" height="84" rx="6" class="f-bad-bg s-bad" stroke-width="2" /><text x="126" y="272" class="td f-ink" font-size="30">IT CAN VANISH</text><text x="126" y="302" class="tb f-muted" font-size="19">Mid-term, no refund (unverified).</text></g><g id="a4"><rect x="656" y="230" width="520" height="84" rx="6" class="f-bad-bg s-bad" stroke-width="2" /><text x="678" y="272" class="td f-ink" font-size="30">HOCKEY NIGHT BUFFERING</text><text x="678" y="302" class="tb f-muted" font-size="19">Peak hours strain these services.</text></g><g id="a5"><rect x="104" y="334" width="520" height="84" rx="6" class="f-bad-bg s-bad" stroke-width="2" /><text x="126" y="376" class="td f-ink" font-size="30">SITES GET BLOCKED</text><text x="126" y="406" class="tb f-muted" font-size="19">Your ISP may block it; a VPN may be needed.</text></g><g id="a6"><rect x="656" y="334" width="520" height="84" rx="6" class="f-bad-bg s-bad" stroke-width="2" /><text x="678" y="376" class="td f-ink" font-size="30">NO WAY TO GET MONEY BACK</text><text x="678" y="406" class="tb f-muted" font-size="19">E-transfer has no chargeback.</text></g><g id="a7"><rect x="104" y="438" width="520" height="84" rx="6" class="f-surface s-line" stroke-width="2" /><text x="126" y="480" class="td f-ink" font-size="30">ONE PERSON FOR HELP</text><text x="126" y="510" class="tb f-muted" font-size="19">Support is a single WhatsApp contact.</text></g><g id="a8"><rect x="656" y="438" width="520" height="84" rx="6" class="f-surface s-line" stroke-width="2" /><text x="678" y="480" class="td f-ink" font-size="30">SAFETY OF THE APP</text><text x="678" y="510" class="tb f-muted" font-size="19">Side-loaded apps can carry malware.</text></g><g id="a9"><text x="104" y="584" class="tb f-muted" font-size="20">Also: payment details go to a seller no one holds accountable,</text><text x="104" y="614" class="tb f-muted" font-size="20">and it is nothing like Netflix: no profiles, 15,000 channels to dig through.</text></g></svg>
