<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"><rect width="1280" height="720" class="f-bg"/><g id="a1"><circle cx="111" cy="86" r="7" class="f-accent pulse"/><text x="132" y="92" class="tm f-muted" font-size="17">REEL 04 — THE CHEAP TV BOX</text></g><g id="a2"><text x="104" y="190" class="td f-ink" font-size="88">WILL IT JUST</text><text x="104" y="274" class="td f-ink" font-size="88">WORK LIKE</text><text x="104" y="357" class="td f-ink" font-size="88">TELUS TV?</text></g><g id="a3"><text x="104" y="480" class="tb f-muted" font-size="26">A Firestick sold with a year of live TV for about $150–400.</text><text x="104" y="520" class="tb f-muted" font-size="26">The savings are real. So are the catches.</text></g><g id="a4"><rect x="104" y="570" width="1072" height="80" rx="6" class="f-surface s-line" stroke-width="2" /><text x="132" y="622" class="td f-ink" font-size="30">Short answer: cheaper, but not hands-off.</text></g></svg>
