<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"><rect width="1280" height="720" class="f-bg"/><g id="a1"><circle cx="111" cy="86" r="7" class="f-accent pulse"/><text x="132" y="92" class="tm f-muted" font-size="17">THE TAKEAWAY</text></g><g id="a2"><text x="104" y="190" class="td f-ink" font-size="76">TRIM FIRST,</text><text x="104" y="262" class="td f-ink" font-size="76">THEN DECIDE</text></g><g id="a3"><path d="M110 332 l9 9 l17 -19" pathLength="1" fill="none" class="s-good draw" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="transition-delay:0.0s"/><text x="154" y="340" class="tb f-ink" font-size="27">Add Plex; it&#x27;s free</text><path d="M110 392 l9 9 l17 -19" pathLength="1" fill="none" class="s-good draw" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="transition-delay:0.25s"/><text x="154" y="400" class="tb f-ink" font-size="27">Pay for hockey only in season</text><path d="M110 452 l9 9 l17 -19" pathLength="1" fill="none" class="s-good draw" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="transition-delay:0.5s"/><text x="154" y="460" class="tb f-ink" font-size="27">Drop overlapping subscriptions</text><path d="M110 512 l9 9 l17 -19" pathLength="1" fill="none" class="s-good draw" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="transition-delay:0.75s"/><text x="154" y="520" class="tb f-ink" font-size="27">That alone gets near $620 a year</text></g><g id="a4"><rect x="104" y="566" width="1072" height="92" rx="6" class="f-bad-bg s-bad" stroke-width="2" /><text x="132" y="604" class="tb f-ink" font-size="24">Still tempted by the box? Pay month to month, not for a year.</text><text x="132" y="638" class="tb f-ink" font-size="24">Keep another way to watch hockey in case it stops working.</text></g></svg>
