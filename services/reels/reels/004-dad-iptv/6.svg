<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"><rect width="1280" height="720" class="f-bg"/><g id="a1"><circle cx="111" cy="86" r="7" class="f-accent pulse"/><text x="132" y="92" class="tm f-muted" font-size="17">CH 05 — WHO FIXES IT?</text></g><g id="a2"><text x="104" y="168" class="td f-ink" font-size="62">YOU ARE TECH SUPPORT</text></g><g id="a3"><text x="104" y="236" class="tb f-muted" font-size="23">Telus fixed problems. Here the only help is one person on WhatsApp.</text></g><g id="a4"><rect x="104" y="290" width="520" height="84" rx="6" class="f-surface s-accent" stroke-width="2" /><text x="126" y="332" class="td f-ink" font-size="30">IT BREAKS AT THE WORST TIME</text><text x="126" y="362" class="tb f-muted" font-size="19">Game night, and the call comes to you.</text></g><g id="a5"><rect x="656" y="290" width="520" height="84" rx="6" class="f-surface s-accent" stroke-width="2" /><text x="678" y="332" class="td f-ink" font-size="30">NO NETFLIX-STYLE APP</text><text x="678" y="362" class="tb f-muted" font-size="19">No profiles; 15,000 channels to dig through.</text></g><g id="a6"><rect x="104" y="394" width="520" height="84" rx="6" class="f-surface s-accent" stroke-width="2" /><text x="126" y="436" class="td f-ink" font-size="30">SIDE-LOADED APPS</text><text x="126" y="466" class="tb f-muted" font-size="19">Outside the app store; malware risk.</text></g><g id="a7"><rect x="656" y="394" width="520" height="84" rx="6" class="f-surface s-accent" stroke-width="2" /><text x="678" y="436" class="td f-ink" font-size="30">NOTHING IS CHECKED</text><text x="678" y="466" class="tb f-muted" font-size="19">Age, refunds, channel count: unverified.</text></g><g id="a8"><rect x="104" y="520" width="1072" height="100" rx="6" class="f-ink s-ink" stroke-width="2" /><text x="132" y="582" class="td f-bg" font-size="32">Expect a few calls a month, and some outages.</text></g></svg>
