<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Explainer reels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
/* Shared look for Matt's artifact pages (check-in, review). build scripts inline it.
   Dawn sky palette, narrow column, segmented progress strip, card steps. */
:root {
  --bg: #eef2f6;
  --surface: #ffffff;
  --ink: #1d2a3a;
  --muted: #5d6b7c;
  --line: #d6dee8;
  --accent: #d9822b;
  --accent-ink: #ffffff;
  --sky: #9fb8d4;
  --good: #2f7d5b;
  --bad: #b3443c;
  --good-bg: #e3f2ea;
  --bad-bg: #f8e4e2;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121a24; --surface: #1b2531; --ink: #e8eef5; --muted: #9aa9ba; --line: #2c3a4a;
  --accent: #f0a050; --accent-ink: #1b1308; --sky: #4a6584; --good: #6cc59c; --bad: #ec8a80;
  --good-bg: #173226; --bad-bg: #3a1f1d; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121a24; --surface: #1b2531; --ink: #e8eef5; --muted: #9aa9ba; --line: #2c3a4a;
  --accent: #f0a050; --accent-ink: #1b1308; --sky: #4a6584; --good: #6cc59c; --bad: #ec8a80;
  --good-bg: #173226; --bad-bg: #3a1f1d; color-scheme: dark; }

[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 17px/1.55 var(--body); }
.wrap { max-width: 34rem; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; display: grid; gap: 20px; }
header { display: grid; gap: 4px; }
.eyebrow { font: 500 12px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font: 700 clamp(28px, 7vw, 38px)/1.05 var(--display); margin: 0; text-wrap: balance; }
h2 { font: 700 24px/1.15 var(--display); margin: 0; text-wrap: balance; }
.progress { display: grid; grid-auto-columns: 1fr; grid-auto-flow: column; gap: 6px; }
.seg { display: grid; gap: 6px; font: 500 11px/1 var(--mono); color: var(--muted); letter-spacing: .04em; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
.seg::before { content: ""; height: 4px; border-radius: 2px; background: var(--line); }
.seg.done::before { background: var(--sky); }
.seg.on::before { background: var(--accent); }
.seg.on { color: var(--ink); }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px 20px; display: grid; gap: 16px; }
.step p { margin: 0; }
.lede { color: var(--muted); }
button { font: inherit; }
.btn { font: 600 16px/1 var(--display); border-radius: 10px; padding: 14px 18px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; min-height: 48px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.btn:focus-visible, .seg:focus-visible, .opt:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.row .btn { flex: 1 1 8rem; }
a.btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
.status { font: 500 12px/1.3 var(--mono); color: var(--muted); text-align: center; }
textarea { width: 100%; box-sizing: border-box; min-height: 7rem; font: 18px/1.5 var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; resize: vertical; }

.wrap { max-width: 64rem; }
.stage { position: relative; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--bg); }
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage:fullscreen { border: 0; border-radius: 0; }
.f-bg { fill: var(--bg) } .f-surface { fill: var(--surface) } .f-ink { fill: var(--ink) } .f-muted { fill: var(--muted) }
.f-line { fill: var(--line) } .f-accent { fill: var(--accent) } .f-sky { fill: var(--sky) } .f-good { fill: var(--good) }
.f-bad { fill: var(--bad) } .f-good-bg { fill: var(--good-bg) } .f-bad-bg { fill: var(--bad-bg) }
.s-line { stroke: var(--line) } .s-ink { stroke: var(--ink) } .s-accent { stroke: var(--accent) } .s-sky { stroke: var(--sky) }
.rv { opacity: 0; transform: translateY(var(--rise, 18px)); transform-box: fill-box;
      transition: opacity var(--dur, .55s) ease, transform var(--dur, .55s) cubic-bezier(.2, .8, .2, 1); }
.rv.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { .rv { transform: none; } }
.caption { font: 20px/1.45 var(--body); min-height: 3em; margin: 0; text-wrap: pretty; }
.caption .said { color: var(--ink); } .caption .unsaid { color: var(--muted); }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.controls .btn { min-width: 48px; }
.controls .grow { flex: 1 1 auto; }
.hint { font: 500 12px/1.4 var(--mono); color: var(--muted); }
kbd { font: 500 11px/1 var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 2px 5px; background: var(--surface); color: var(--ink); }
.start { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; text-align: center;
         background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(2px); padding: 16px; }
.start .btn { font-size: 20px; padding: 18px 28px; }
.meta { font: 500 13px/1.4 var(--mono); color: var(--muted); }
a.quiet { color: var(--muted); }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <span class="eyebrow" id="eyebrow"></span>
    <h1 id="title"></h1>
  </header>
  <div class="stage" id="stage" aria-live="polite">
    <div id="slide"></div>
    <div class="start" id="start">
      <button class="btn primary" id="go" type="button">▶ Play reel</button>
      <span class="meta" id="meta"></span>
    </div>
  </div>
  <p class="caption" id="caption"></p>
  <nav class="progress" id="progress" aria-label="Beats"></nav>
  <div class="controls">
    <button class="btn" id="prev" type="button" title="Previous beat (←)">←</button>
    <button class="btn primary" id="play" type="button" title="Play / pause (Space)">Play</button>
    <button class="btn" id="next" type="button" title="Next beat (→)">→</button>
    <button class="btn" id="replay" type="button" title="Replay this beat (R)">↺ Replay</button>
    <span class="grow"></span>
    <button class="btn" id="speed" type="button" title="Speed (S)">1×</button>
    <button class="btn" id="full" type="button" title="Full screen for presenting (F)">⛶</button>
  </div>
  <p class="hint"><kbd>Space</kbd> pause · <kbd>←</kbd> <kbd>→</kbd> beats · <kbd>R</kbd> replay · <kbd>S</kbd> speed · <kbd>F</kbd> full screen · tap a segment to jump</p>
  <p class="hint" id="credit"></p>
</main>

$('meta').textContent = `${D.beats.length} beats · ${Math.floor(total / 60)}:${String(Math.round(total % 60)).padStart(2, '0')} · voice: ${D.voice}`;
$('credit').innerHTML = D.figma ? `Slides made in <a class="quiet" href="${D.figma}" target="_blank" rel="noopener">Figma</a> · voice by Deepgram (${D.voice})` : '';
$('progress').innerHTML = D.beats.map((_, k) => `<button class="seg" type="button" data-k="${k}" aria-label="Beat ${k + 1}">${k + 1}</button>`).join('');
document.documentElement.style.setProperty('--dur', T['reveal.duration'] + 's');
document.documentElement.style.setProperty('--rise', T['reveal.rise'] + 'px');

function clear() { timers.forEach(clearTimeout); timers = []; }
function later(fn, s) { timers.push(setTimeout(fn, s * 1000 / speed)); }
function parts() { return [...$('slide').querySelectorAll('[id]')].filter(n => /^a\d+$/.test(n.id)).sort((a, b) => a.id.slice(1) - b.id.slice(1)); }
function caption(frac) {
  const words = D.beats[i].say.split(' '), n = Math.round(words.length * frac);
  $('caption').innerHTML = `<span class="said">${words.slice(0, n).join(' ')}</span> <span class="unsaid">${words.slice(n).join(' ')}</span>`;
}
function marks() {
  document.querySelectorAll('.seg').forEach((s, k) => { s.classList.toggle('on', k === i); s.classList.toggle('done', k < i); });
}
function show(k, autoplay = playing) {
  clear(); audio.pause();
  i = Math.max(0, Math.min(D.beats.length - 1, k));
  const b = D.beats[i];
  $('slide').innerHTML = b.svg;
  const ps = parts();
  ps.forEach(p => p.classList.add('rv'));
  marks(); caption(0);
  audio.src = b.audio; audio.playbackRate = speed;
  if (!autoplay) { ps.forEach(p => p.classList.add('in')); caption(1); return; }
  const gap = Math.min(T['reveal.maxGap'], (b.dur * T['reveal.spread']) / Math.max(1, ps.length - 1));
  requestAnimationFrame(() => ps.forEach((p, n) => later(() => p.classList.add('in'), n === 0 ? 0 : n * gap)));
  later(() => audio.play().catch(() => setPlaying(false)), T['beat.lead']);
}
function setPlaying(on) {
  playing = on;
  $('play').textContent = on ? 'Pause' : 'Play';
  if (on) audio.play().catch(() => {});
  else { audio.pause(); clear(); parts().forEach(p => p.classList.add('in')); }
}
audio.addEventListener('timeupdate', () => audio.duration && caption(audio.currentTime / audio.duration));
audio.addEventListener('ended', () => {
  caption(1);
  if (i < D.beats.length - 1) later(() => show(i + 1), T['beat.gap']);
  else { setPlaying(false); marks(); document.querySelectorAll('.seg').forEach(s => s.classList.add('done')); }
});
function start() { $('start').hidden = true; playing = true; $('play').textContent = 'Pause'; show(0, true); }
$('go').onclick = start;
$('play').onclick = () => { if (!$('start').hidden) return start(); if (playing) setPlaying(false); else { playing = true; $('play').textContent = 'Pause'; audio.ended || audio.currentTime === 0 ? show(i, true) : audio.play(); } };
$('prev').onclick = () => { $('start').hidden = true; show(i - 1); };
$('next').onclick = () => { $('start').hidden = true; show(i + 1); };
$('replay').onclick = () => { $('start').hidden = true; playing = true; $('play').textContent = 'Pause'; show(i, true); };
$('progress').onclick = e => { const s = e.target.closest('.seg'); if (s) { $('start').hidden = true; show(+s.dataset.k); } };
function setSpeed(v) { speed = v; audio.playbackRate = v; $('speed').textContent = v + '×'; try { localStorage.setItem('reel.speed', v); } catch {} }
$('speed').onclick = () => setSpeed(SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length]);
$('full').onclick = () => document.fullscreenElement ? document.exitFullscreen() : $('stage').requestFullscreen?.();
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', r: 'replay', s: 'speed', f: 'full' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
if ('mediaSession' in navigator) {
  navigator.mediaSession.metadata = new MediaMetadata({ title: D.title, artist: D.voice });
  navigator.mediaSession.setActionHandler('previoustrack', () => $('prev').click());
  navigator.mediaSession.setActionHandler('nexttrack', () => $('next').click());
}
setSpeed(SPEEDS.includes(speed) ? speed : 1);
show(0, false);
</script>
</body>
</html>
