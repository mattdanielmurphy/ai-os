<meta charset="utf-8">
<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
/*__KIT_CSS__*/
/* Review: every section on one scrolling page. Tap a sentence to aim the section's comment box at it;
   with nothing tapped the box is a general comment. Tick when read. Done pings Matt's Mac. */
.body { display: grid; gap: 10px; }
.body > * { margin: 0; }
.body ul, .body ol { padding-left: 1.3em; display: grid; gap: 6px; margin: 0; }
.body code { font: 500 .85em var(--mono); background: var(--bg); padding: 1px 4px; border-radius: 4px; }
.body a { color: inherit; }
.s { cursor: pointer; border-radius: 3px; -webkit-tap-highlight-color: transparent; }
@media (hover: hover) { .s:hover { background: var(--bg); } }
.s.noted { background: var(--good-bg); box-shadow: 0 2px 0 var(--good); }
.s.target { background: color-mix(in srgb, var(--accent) 22%, transparent); box-shadow: 0 2px 0 var(--accent); }
.tick { display: flex; gap: 10px; align-items: center; font: 600 15px/1.2 var(--display); cursor: pointer; }
.tick input { width: 22px; height: 22px; accent-color: var(--good); }
.aim { display: flex; gap: 8px; align-items: baseline; font: 500 12px/1.4 var(--mono); color: var(--muted); min-height: 1.4em; margin-bottom: 6px; }
.aim q { font: italic 14px/1.4 var(--body); color: var(--ink); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.aim button { margin-left: auto; font: 500 12px/1 var(--mono); color: var(--muted); background: none; border: 0; padding: 4px; cursor: pointer; text-decoration: underline; }
.box textarea { min-height: 4.5rem; }
.step.read { border-color: var(--good); }
.donebar { position: sticky; bottom: 0; padding-block: 10px max(10px, env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, var(--bg) 30%); display: grid; gap: 6px; }
</style>

<div class="wrap">
  <header>
    <span class="eyebrow" id="eyebrow">Review</span>
    <h1 id="title"></h1>
  </header>
  <nav class="progress" id="progress" aria-label="Sections"></nav>
  <div id="sections" style="display:grid;gap:20px"></div>
  <div class="donebar">
    <a class="btn primary" id="done" target="_blank" rel="noopener">Done, send to Claude</a>
    <p class="status" id="status">Tap a sentence to comment on it. With nothing tapped, it's a general comment.</p>
  </div>
</div>

<script>
const DATA = __DATA__;
const $ = id => document.getElementById(id);
const SEG = typeof Intl.Segmenter === "function" ? new Intl.Segmenter("en", { granularity: "sentence" }) : null;
const BLOCKS = "p,li,h1,h2,h3,h4,h5,h6,td,th,blockquote";

// state.sections[id] = { read, general, notes: { key: { quote, text } } }
let state = { sections: {}, finishedAt: null };
const sec = id => (state.sections[id] ??= { read: false, general: "", notes: {} });
const aim = {};  // section id -> { key, quote }, or null for a general comment

$("title").textContent = DATA.title;
if (DATA.eyebrow) $("eyebrow").textContent = DATA.eyebrow;

/* Split a rendered block into sentence spans, keeping inline formatting (bold, links). */
function wrapSentences(block, sid, counter) {
  const nodes = [];
  const walk = document.createTreeWalker(block, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement.closest(BLOCKS) === block ? 1 : 2 });
  while (walk.nextNode()) nodes.push(walk.currentNode);
  const text = nodes.map(n => n.data).join("");
  if (!text.trim()) return;
  const cuts = SEG ? [...SEG.segment(text)].map(s => s.index) : [0];
  cuts.push(text.length);
  let pos = 0;
  for (const n of nodes) {
    const start = pos, end = pos + n.data.length;
    pos = end;
    const frag = document.createDocumentFragment();
    for (let i = 0; i < cuts.length - 1; i++) {
      const a = Math.max(cuts[i], start), b = Math.min(cuts[i + 1], end);
      if (a >= b) continue;
      const t = n.data.slice(a - start, b - start);
      if (!t.trim()) { frag.append(t); continue; }
      const sp = document.createElement("span");
      sp.className = "s";
      sp.dataset.key = `${sid}:${counter.base + i}`;
      sp.textContent = t;
      frag.append(sp);
    }
    n.replaceWith(frag);
  }
  counter.base += cuts.length;
}
const quoteOf = (root, key) => [...root.querySelectorAll(`.s[data-key="${key}"]`)].map(s => s.textContent).join("").trim();

function render() {
  DATA.sections.forEach((S, idx) => {
    const el = document.createElement("section");
    el.className = "step"; el.id = "sec-" + S.id;
    el.innerHTML = `<h2></h2><div class="body"></div>
      <label class="tick"><input type="checkbox"> Read, and I'm good with it</label>
      <div class="box"><div class="aim"><span>General comment</span></div><textarea rows="3" placeholder="Comment (dictate or type)…"></textarea></div>`;
    el.querySelector("h2").textContent = S.title;
    const body = el.querySelector(".body");
    body.innerHTML = DOMPurify.sanitize(marked.parse(S.md));
    const counter = { base: 0 };
    body.querySelectorAll(BLOCKS).forEach(b => wrapSentences(b, S.id, counter));
    $("sections").append(el);

    const box = el.querySelector("textarea"), tick = el.querySelector(".tick input");
    tick.onchange = () => { sec(S.id).read = tick.checked; el.classList.toggle("read", tick.checked); renderProgress(); save(); };
    box.oninput = () => writeBox(S.id, box.value);
    box.onblur = () => save();
    body.addEventListener("click", e => {
      if (wordAim(S.id, body)) return;
      const s = e.target.closest(".s");
      if (!s || e.target.closest("a")) return;
      const key = s.dataset.key;
      setAim(S.id, aim[S.id]?.key === key ? null : { key, quote: quoteOf(body, key) });
    });
    if (idx === 0) setTimeout(() => box.focus({ preventScroll: true }), 300);
  });
}

/* A drag or long-press over words narrows the target to those words. Single characters and bullets never count. */
function wordAim(sid, body) {
  const sel = getSelection();
  if (!sel || sel.isCollapsed || !body.contains(sel.anchorNode)) return false;
  const r = sel.getRangeAt(0), W = /[\p{L}\p{N}'’-]/u;  // snap both ends out to whole words
  if (r.startContainer.nodeType === 3) { let o = r.startOffset; while (o > 0 && W.test(r.startContainer.data[o - 1])) o--; r.setStart(r.startContainer, o); }
  if (r.endContainer.nodeType === 3) { let o = r.endOffset; const d = r.endContainer.data; while (o < d.length && W.test(d[o])) o++; r.setEnd(r.endContainer, o); }
  const quote = r.toString().replace(/\s+/g, " ").trim();
  if (quote.length < 2 || !/[A-Za-z0-9]{2}/.test(quote)) return false;
  setAim(sid, { key: "w:" + quote.slice(0, 80), quote });
  sel.removeAllRanges();
  return true;
}

function writeBox(sid, v) {
  const a = aim[sid], s = sec(sid);
  if (!a) s.general = v;
  else if (v.trim()) s.notes[a.key] = { quote: a.quote, text: v };
  else delete s.notes[a.key];
  paintNotes(sid);
}

function setAim(sid, next) {
  const el = $("sec-" + sid), box = el.querySelector("textarea"), s = sec(sid);
  aim[sid] = next;
  box.value = next ? (s.notes[next.key]?.text ?? "") : s.general;  // a noted sentence brings its note back
  const label = el.querySelector(".aim");
  label.replaceChildren();
  if (next) {
    const q = document.createElement("q"); q.textContent = next.quote;
    const x = document.createElement("button"); x.type = "button"; x.textContent = "general";
    x.onclick = () => setAim(sid, null);
    label.append(q, x);
  } else label.append(Object.assign(document.createElement("span"), { textContent: "General comment" }));
  paintNotes(sid);
  box.focus({ preventScroll: true });
  save();
}

function paintNotes(sid) {
  const el = $("sec-" + sid), s = sec(sid);
  el.querySelectorAll(".s").forEach(sp => {
    sp.classList.toggle("noted", !!s.notes[sp.dataset.key]);
    sp.classList.toggle("target", aim[sid]?.key === sp.dataset.key);
  });
}

function renderProgress() {
  $("progress").replaceChildren(...DATA.sections.map((S, i) => {
    const b = document.createElement("button");
    b.className = "seg" + (sec(S.id).read ? " done" : "");
    b.type = "button"; b.textContent = String(i + 1);
    b.onclick = () => $("sec-" + S.id).scrollIntoView({ behavior: "smooth", block: "start" });
    return b;
  }));
}

/* Done: save, then open the Mac link (the Mac tells the coordinator, which wakes the thread). */
const doneUrl = DATA.act && DATA.page ? `${DATA.act}/review-done?page=${encodeURIComponent(DATA.page)}&thread=${encodeURIComponent(DATA.thread || "")}` : "";
if (doneUrl) $("done").href = doneUrl;
$("done").onclick = e => {
  state.finishedAt = new Date().toISOString();
  save();
  if (!doneUrl) { e.preventDefault(); $("status").textContent = "Saved. Tell Claude \"done\" in the thread."; }
  else $("status").textContent = "Sent. Claude picks it up in the thread.";
};

/* Saving to the shared store Claude reads (collection "reviews"). */
let dbRef = null, saving = Promise.resolve();
function save() {
  saving = saving.then(async () => {
    if (!dbRef) { $("status").textContent = "Not saved (open this page from the thread)."; return; }
    try { await dbRef.set(state); $("status").textContent = "Saved " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }
    catch (e) { $("status").textContent = "Couldn't save (" + (e && e.code || "error") + "). Tell Claude in the thread."; }
  });
  return saving;
}

render();
renderProgress();
(async () => {
  const db = await window.claude?.use?.("db");
  if (!db) return;
  dbRef = db.doc("reviews/" + DATA.id);
  try {
    const snap = await dbRef.get();
    if (!snap.exists) return;
    const d = snap.data();
    for (const [id, s] of Object.entries(d.sections || {})) {
      const mine = sec(id);
      mine.read = mine.read || !!s.read;
      mine.general = mine.general || s.general || "";
      mine.notes = { ...(s.notes || {}), ...mine.notes };
      const el = $("sec-" + id);
      if (!el) continue;
      el.querySelector(".tick input").checked = mine.read;
      el.classList.toggle("read", mine.read);
      if (!aim[id]) el.querySelector("textarea").value = mine.general;
      paintNotes(id);
    }
    state.finishedAt = d.finishedAt || null;
    renderProgress();
    $("status").textContent = "Picked up where you left off";
  } catch {}
})();
</script>
