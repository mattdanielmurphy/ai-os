<meta charset="utf-8">
<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
/*__KIT_CSS__*/
/* Review: every section on one scrolling page. Tap a sentence to aim the section's comment box at it;
   with nothing tapped the box is a general comment. Tick when read. Done pings Matt's Mac. */
/* Review overrides the kit for a desktop reading page: smaller type, wider column, roomier cards. */
body { font-size: 16px; line-height: 1.65; }
.wrap { max-width: 46rem; gap: 26px; padding-block: 28px 24px; }
h1 { font-size: clamp(24px, 5vw, 30px); }
h2 { font-size: 20px; }
.step { padding: 32px 40px; gap: 22px; }
@media (max-width: 560px) { .step { padding: 24px 20px; } }
.body { display: grid; gap: 14px; }
.body h1, .body h2 { font: 700 18px/1.3 var(--display); }
.body h3, .body h4 { font: 700 16px/1.3 var(--display); }
.body hr { display: none; }
.body > * { margin: 0; }
.body ul, .body ol { padding-left: 1.3em; display: grid; gap: 6px; margin: 0; }
.body code { font: 500 .85em var(--mono); background: var(--bg); padding: 1px 4px; border-radius: 4px; }
.body a { color: inherit; }
.s { cursor: pointer; border-radius: 3px; -webkit-tap-highlight-color: transparent; }
@media (hover: hover) { .s:hover { background: var(--bg); } }
.s.noted { background: var(--good-bg); box-shadow: 0 2px 0 var(--good); }
.s.target { background: color-mix(in srgb, var(--accent) 22%, transparent); box-shadow: 0 2px 0 var(--accent); }
.tick { display: flex; gap: 10px; align-items: center; font: 600 15px/1.2 var(--display); cursor: pointer; }
.tick input { width: 22px; height: 22px; accent-color: var(--good); }
.aim { display: flex; gap: 8px; align-items: baseline; font: 500 12px/1.4 var(--mono); color: var(--muted); min-height: 1.4em; margin-bottom: 6px; }
.aim q { font: italic 14px/1.4 var(--body); color: var(--ink); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.aim button { margin-left: auto; font: 500 12px/1 var(--mono); color: var(--muted); background: none; border: 0; padding: 4px; cursor: pointer; text-decoration: underline; }
.box textarea { min-height: 4.5rem; }
.step.read { border-color: var(--good); }
.donebar { position: sticky; bottom: 0; padding-block: 12px max(12px, env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, var(--bg) 40%); display: flex; gap: 14px; align-items: center; justify-content: flex-end; }
.donebar .btn { min-height: 40px; padding: 10px 18px; font-size: 15px; }
.donebar .status { margin: 0; flex: 1; text-align: left; }
.tick { font-size: 14px; }
.box textarea { min-height: 3.5rem; font-size: 16px; }
.picked { background: color-mix(in srgb, var(--accent) 10%, transparent); border-radius: 6px; box-shadow: -10px 0 0 color-mix(in srgb, var(--accent) 10%, transparent), 10px 0 0 color-mix(in srgb, var(--accent) 10%, transparent); }
.body > *, .body li { cursor: pointer; }
h2.pick { cursor: pointer; }
.wrap { -webkit-user-select: none; user-select: none; }
.boxrow { display: flex; gap: 8px; align-items: flex-start; }
.mic { flex: none; width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 18px; cursor: pointer; }
.mic.on { background: var(--bad-bg); border-color: var(--bad); }
.wrap textarea { -webkit-user-select: text; user-select: text; }
::highlight(words) { background-color: color-mix(in srgb, #d9822b 30%, transparent); }
</style>

<div class="wrap">
  <header>
    <span class="eyebrow" id="eyebrow">Review</span>
    <h1 id="title"></h1>
  </header>
  <nav class="progress" id="progress" aria-label="Sections"></nav>
  <div id="sections" style="display:grid;gap:20px"></div>
  <div class="donebar">
    <p class="status" id="status">Tap a sentence to comment on it, beside it for the paragraph, the heading for the whole section.</p>
    <a class="btn primary" id="done" target="_blank" rel="noopener">Done, send to Claude</a>
  </div>
</div>

<script>
const DATA = __DATA__;
const $ = id => document.getElementById(id);
const SEG = typeof Intl.Segmenter === "function" ? new Intl.Segmenter("en", { granularity: "sentence" }) : null;
const BLOCKS = "p,li,h1,h2,h3,h4,h5,h6,td,th,blockquote";

// state.sections[id] = { read, general, notes: { key: { quote, text } } }
let state = { sections: {}, finishedAt: null };
const sec = id => (state.sections[id] ??= { read: false, general: "", notes: {} });
const aim = {};  // section id -> { key, quote }, or null for a general comment

$("title").textContent = DATA.title;
if (DATA.eyebrow) $("eyebrow").textContent = DATA.eyebrow;

/* Split a rendered block into sentence spans, keeping inline formatting (bold, links). */
function wrapSentences(block, sid, counter) {
  const nodes = [];
  const walk = document.createTreeWalker(block, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement.closest(BLOCKS) === block ? 1 : 2 });
  while (walk.nextNode()) nodes.push(walk.currentNode);
  const text = nodes.map(n => n.data).join("");
  if (!text.trim()) return;
  const cuts = SEG ? [...SEG.segment(text)].map(s => s.index) : [0];
  cuts.push(text.length);
  let pos = 0;
  for (const n of nodes) {
    const start = pos, end = pos + n.data.length;
    pos = end;
    const frag = document.createDocumentFragment();
    for (let i = 0; i < cuts.length - 1; i++) {
      const a = Math.max(cuts[i], start), b = Math.min(cuts[i + 1], end);
      if (a >= b) continue;
      const t = n.data.slice(a - start, b - start);
      if (!t.trim()) { frag.append(t); continue; }
      const sp = document.createElement("span");
      sp.className = "s";
      sp.dataset.key = `${sid}:${counter.base + i}`;
      sp.dataset.p = block.dataset.p;
      sp.textContent = t;
      frag.append(sp);
    }
    n.replaceWith(frag);
  }
  counter.base += cuts.length;
}
const quoteOf = (root, key) => [...root.querySelectorAll(`.s[data-key="${key}"]`)].map(s => s.textContent).join("").trim();

function render() {
  DATA.sections.forEach((S, idx) => {
    const el = document.createElement("section");
    el.className = "step"; el.id = "sec-" + S.id;
    el.innerHTML = `<h2></h2><div class="body"></div>
      <label class="tick"><input type="checkbox"> Read, and I'm good with it</label>
      <div class="box"><div class="aim"><span>General comment</span></div><div class="boxrow"><textarea rows="3" placeholder="Comment (dictate or type)…"></textarea><button class="mic" type="button" title="Dictate (TypeWhisper on your Mac)" aria-label="Dictate">🎙</button></div></div>`;
    el.querySelector("h2").textContent = S.title;
    const body = el.querySelector(".body");
    body.innerHTML = DOMPurify.sanitize(marked.parse(S.md));
    const counter = { base: 0 };
    body.querySelectorAll(BLOCKS).forEach((b, i) => { b.dataset.p = `p:${S.id}:${i}`; wrapSentences(b, S.id, counter); });
    const h2 = el.querySelector("h2");
    h2.classList.add("pick");
    h2.onclick = () => setAim(S.id, aim[S.id]?.key === "sec:" + S.id ? null : { key: "sec:" + S.id, quote: "Whole section: " + S.title });
    $("sections").append(el);

    const box = el.querySelector("textarea"), tick = el.querySelector(".tick input");
    tick.onchange = () => { sec(S.id).read = tick.checked; el.classList.toggle("read", tick.checked); renderProgress(); save(); };
    box.oninput = () => writeBox(S.id, box.value);
    box.onblur = () => save();
    body.addEventListener("click", e => {
      if (justDragged) return;
      if (e.target.closest("a")) return;
      const s = e.target.closest(".s");
      // On a sentence: that sentence. Beside it, still inside the paragraph's box: the whole paragraph.
      const blk = s ? null : e.target.closest("[data-p]");
      if (!s && !blk) return;
      const key = s ? s.dataset.key : blk.dataset.p;
      const quote = s ? quoteOf(body, key) : blk.textContent.replace(/\s+/g, " ").trim();
      setAim(S.id, aim[S.id]?.key === key ? null : { key, quote });
    });
    wordDrag(S.id, body);
    const mic = el.querySelector(".mic");
    mic.onmousedown = e => e.preventDefault();  // keep the comment box focused: TypeWhisper types into it
    mic.onclick = () => dictate(box, mic);
    if (idx === 0) setTimeout(() => box.focus({ preventScroll: true }), 300);
  });
}

/* Mouse drag over words narrows the target to those words: our own drag (native selection is off), painted
   live with the CSS Highlight API and snapped to whole words. Single characters and bullets never count. */
const W = /[\p{L}\p{N}'’-]/u;
function caretAt(x, y) {
  if (document.caretPositionFromPoint) { const p = document.caretPositionFromPoint(x, y); return p && { node: p.offsetNode, offset: p.offset }; }
  const r = document.caretRangeFromPoint?.(x, y);
  return r && { node: r.startContainer, offset: r.startOffset };
}
function wordRange(a, b) {
  const r = document.createRange();
  r.setStart(a.node, a.offset);
  if (r.comparePoint(b.node, b.offset) < 0) { r.setStart(b.node, b.offset); r.setEnd(a.node, a.offset); } else r.setEnd(b.node, b.offset);
  if (r.startContainer.nodeType === 3) { let o = r.startOffset; while (o > 0 && W.test(r.startContainer.data[o - 1])) o--; r.setStart(r.startContainer, o); }
  if (r.endContainer.nodeType === 3) { let o = r.endOffset; const d = r.endContainer.data; while (o < d.length && W.test(d[o])) o++; r.setEnd(r.endContainer, o); }
  return r;
}
const paintWords = r => { if (window.Highlight && CSS.highlights) CSS.highlights.set("words", new Highlight(r)); };
let drag = null, justDragged = false;
function wordDrag(sid, body) {
  body.addEventListener("pointerdown", e => {
    if (e.pointerType !== "mouse" || e.button !== 0 || e.target.closest("a")) return;
    const c = caretAt(e.clientX, e.clientY);
    if (c && body.contains(c.node)) drag = { sid, body, start: c, x: e.clientX, y: e.clientY, range: null };
  });
}
document.addEventListener("pointermove", e => {
  if (!drag || Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 5) return;
  const c = caretAt(e.clientX, e.clientY);
  if (!c || !drag.body.contains(c.node)) return;
  drag.range = wordRange(drag.start, c);
  paintWords(drag.range);
});
document.addEventListener("pointerup", () => {
  if (!drag) return;
  const { sid, range } = drag;
  drag = null;
  if (!range) return;
  justDragged = true; setTimeout(() => justDragged = false, 0);
  const quote = range.toString().replace(/\s+/g, " ").trim();
  if (quote.length < 2 || !/[\p{L}\p{N}]{2}/u.test(quote)) { CSS.highlights?.delete("words"); return; }
  setAim(sid, { key: "w:" + quote.slice(0, 80), quote });
  paintWords(range);
});

function writeBox(sid, v) {
  const a = aim[sid], s = sec(sid);
  if (!a) s.general = v;
  else if (v.trim()) s.notes[a.key] = { quote: a.quote, text: v };
  else delete s.notes[a.key];
  paintNotes(sid);
}

function setAim(sid, next) {
  const el = $("sec-" + sid), box = el.querySelector("textarea"), s = sec(sid);
  aim[sid] = next;
  box.value = next ? (s.notes[next.key]?.text ?? "") : s.general;  // a noted sentence brings its note back
  const label = el.querySelector(".aim");
  label.replaceChildren();
  if (next) {
    const q = document.createElement("q"); q.textContent = next.quote;
    const x = document.createElement("button"); x.type = "button"; x.textContent = "general";
    x.onclick = () => setAim(sid, null);
    label.append(q, x);
  } else label.append(Object.assign(document.createElement("span"), { textContent: "General comment" }));
  paintNotes(sid);
  if (!next?.key.startsWith("w:")) CSS.highlights?.delete("words");
  box.focus({ preventScroll: true });
  save();
}

function paintNotes(sid) {
  const el = $("sec-" + sid), s = sec(sid);
  const k = aim[sid]?.key;
  el.querySelectorAll(".s").forEach(sp => {
    sp.classList.toggle("noted", !!(s.notes[sp.dataset.key] || s.notes[sp.dataset.p]));
    sp.classList.toggle("target", k === sp.dataset.key);
  });
  el.querySelectorAll("[data-p]").forEach(b => b.classList.toggle("picked", k === b.dataset.p));
  el.querySelector(".body").classList.toggle("picked", k === "sec:" + sid);
}

function renderProgress() {
  $("progress").replaceChildren(...DATA.sections.map((S, i) => {
    const b = document.createElement("button");
    b.className = "seg" + (sec(S.id).read ? " done" : "");
    b.type = "button"; b.textContent = String(i + 1);
    b.onclick = () => $("sec-" + S.id).scrollIntoView({ behavior: "smooth", block: "start" });
    return b;
  }));
}

/* Done: save, then open the Mac link (the Mac tells the coordinator, which wakes the thread). */
const doneUrl = DATA.act && DATA.page ? `${DATA.act}/review-done?page=${encodeURIComponent(DATA.page)}&thread=${encodeURIComponent(DATA.thread || "")}` : "";
if (doneUrl) $("done").href = doneUrl;
/* Mac actions go through Matt's "My Mac" claude.ai connector (no tab opens). A page can't reach the
   Mac directly: a background fetch to it is blocked (tested 2026-10-22). */
let mcpRef = null;
const mac = async () => (mcpRef ??= await window.claude?.use?.("mcp"));
async function dictate(box, mic) {
  box.focus({ preventScroll: true });
  try {
    const m = await mac();
    if (!m) throw { message: "connector unavailable here" };
    await m.callTool("My Mac", "dictate", { action: "toggle" });
    mic.classList.toggle("on");
  } catch (e) { $("status").textContent = "Couldn't start dictation (" + (e?.code || e?.message || "error") + "). Use your TypeWhisper hotkey."; }
}
mac();  // resolve early so Done can decide synchronously whether to follow its link
$("done").onclick = e => {
  state.finishedAt = new Date().toISOString();
  save();
  if (mcpRef && DATA.page) {
    e.preventDefault();
    mcpRef.callTool("My Mac", "review_done", { page: DATA.page, thread: DATA.thread || "" })
      .then(() => $("status").textContent = "Sent. Claude picks it up in the thread.",
            () => { if (doneUrl) window.open(doneUrl, "_blank"); else $("status").textContent = "Saved. Tell Claude \"done\" in the thread."; });
    return;
  }
  if (!doneUrl) { e.preventDefault(); $("status").textContent = "Saved. Tell Claude \"done\" in the thread."; }
  else $("status").textContent = "Sent. Claude picks it up in the thread.";
};

/* Saving to the shared store Claude reads (collection "reviews"). */
let dbRef = null, saving = Promise.resolve();
function save() {
  saving = saving.then(async () => {
    if (!dbRef) { $("status").textContent = "Not saved (open this page from the thread)."; return; }
    try { await dbRef.set(state); $("status").textContent = "Saved " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }
    catch (e) { $("status").textContent = "Couldn't save (" + (e && e.code || "error") + "). Tell Claude in the thread."; }
  });
  return saving;
}

render();
renderProgress();

(async () => {
  const db = await window.claude?.use?.("db");
  if (!db) return;
  dbRef = db.doc("reviews/" + DATA.id);
  try {
    const snap = await dbRef.get();
    if (!snap.exists) return;
    const d = snap.data();
    for (const [id, s] of Object.entries(d.sections || {})) {
      const mine = sec(id);
      mine.read = mine.read || !!s.read;
      mine.general = mine.general || s.general || "";
      mine.notes = { ...(s.notes || {}), ...mine.notes };
      const el = $("sec-" + id);
      if (!el) continue;
      el.querySelector(".tick input").checked = mine.read;
      el.classList.toggle("read", mine.read);
      if (!aim[id]) el.querySelector("textarea").value = mine.general;
      paintNotes(id);
    }
    state.finishedAt = d.finishedAt || null;
    renderProgress();
    $("status").textContent = "Picked up where you left off";
  } catch {}
})();
</script>
