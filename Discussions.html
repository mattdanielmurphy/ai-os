Row / Both) Mismatch\n* **Cause**: When holding modifier keys, `PROPOSED_LAYOUT_MAP` in [`src/hud.lua`](file:///Users/matt/projects/qwerty-midi-hammerspoon/src/hud.lua#L671) updated `displayNote` to the proposed label (e.g. `TopOct +`), but **never** updated `keyUpdates[strCode].action` or `shiftAction` to `layerDef.action`. In JS, `effAction` evaluated using stale default actions (`octaveDown` on base, `topVolDown` on shift), causing:\n  * Option (`TopOct +`): showed `both-active`.\n  * Ctrl (`BotOct +`): showed `both-active`.\n  * Shift+Ctrl (`BotOct -`): showed `top-active` (top row icon for a bottom row action).\n  * Shift (`Oct -`): showed `top-active`.\n* **Fix**:\n  * [`src/hud.lua`](file:///Users/matt/projects/qwerty-midi-hammerspoon/src/hud.lua#L675) now sets `action = layerDef.action`, `shiftAction = layerDef.action`, and assigns `rowActive = \"top\"`, `\"bottom\"`, or `\"both\"`.\n  * [`src/web/index.html`](file:///Users/matt/projects/qwerty-midi-hammerspoon/src/web/index.html#L4711) validates `k.rowActive`, regex matching on `k.displayNote` (`TopOct`, `BotOct`, `Oct +/-`), and `effAction`.\n\n---\n\n### Live Verification Summary\nVerified live inside the running Hammerspoon instance via `hs -c`:\n* **Track Buttons**: Track 1 (`#key-18`) & Track 2 (`#key-19`) show `bottom-active`; Track 3 (`#key-20`) & Track 4 (`#key-21`) show `top-active` with corresponding track colors.\n* **Key D (`#key-2`)**:\n  * Base (`Oct +`): `both-active`\n  * Shift (`Oct -`): `both-active`\n  * Option (`TopOct +`): `top-active`\n  * Shift+Option (`TopOct -`): `top-active`\n  * Control (`BotOct +`): `bottom-active`\n  * Shift+Control (`BotOct -`): `bottom-active`\n  * Control+Option (`Oct Reset`): `both-active`\n* **Key A (`#key-0`)**:\n  * Base: `Arp` $\\rightarrow$ `Arp \ud83d\udd12` (in latch mode with cyan `.latch-mode-active` glow).\n  * Shift+A: toggles latch mode on/off for active track and updates key to `Latch \ud83d\udd12`.\n\n---\n* Conversation Transcript: [thread.md] <script>
  const threads = JSON.parse(document.getElementById('threads-data').textContent);
  const list = document.getElementById('thread-list');
  const content = document.getElementById('thread-content');
  
  function openFinder(url) {
    // macOS file URL handler trick: use a hidden iframe to prevent browser navigation
    const iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);
    setTimeout(() => document.body.removeChild(iframe), 1000);
  }

  function renderThread(id) {
    const thread = threads[id];
    document.querySelectorAll('.thread-item').forEach(el => el.classList.remove('active'));
    document.getElementById('item-' + id).classList.add('active');
    
    // Milestone View Layout
    content.innerHTML = `
      <div style="margin-bottom:30px; padding:20px; background:var(--panel2); border-radius:12px;">
        <h2 style="margin-top:0;">${thread.title}</h2>
        <p><strong>Context & Discussion Summary:</strong><br>${thread.summary || '<i>No summary available.</i>'}</p>
        <p><strong>Agent Actions:</strong><br>${thread.actions || '<i>No specific actions logged.</i>'}</p>
        <a href="thread.md" style="display:inline-block; margin-top:10px; padding:8px 16px; background:var(--accent); color:var(--bg); border-radius:6px; font-weight:600;">Open Full Raw Thread</a>
      </div>
      ${thread.html}
    `;
  }

  Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp).forEach(id => {
    const t = threads[id];
    const div = document.createElement('div');
    div.className = 'thread-item';
    div.id = 'item-' + id;
    div.innerHTML = `<div class="title">${t.title}</div><div class="meta">${t.date} · ${t.source}</div>`;
    div.onclick = () => renderThread(id);
    list.appendChild(div);
  });

  if (Object.keys(threads).length > 0) {
      renderThread(Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp)[0]);
  }
</script>
