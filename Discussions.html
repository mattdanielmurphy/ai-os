  pre.code { background:var(--code-bg); border:1px solid #262b38; border-radius:8px;

  details.code-fold { margin:6px 0; }
  details.code-fold summary { cursor:pointer; color:var(--accent); font-size:12px;

  details.full-reply summary { cursor:pointer; color:var(--accent); font-size:12px;

  .lead b { color:#cfc7ff; }

{"2c0e8e12-3d15-402d-8817-157b752d26a4": {"title": "Conversation 2c0e8e12", "exchanges": [{"user": "An insanely frustrating pattern:\n1. I have 1-3 Chrome windows open with 20-40 tabs open *but most are put to \"sleep\" and are just in the background\n2. An agent enables Chrome debugging MCP tool\n3. Chrome FORCE refreshes EVERY FUCKING TAB at once, and destroys my Mac for MINUTES.\n\nAny ideas?", "time": "", "agent": "I am checking your Chrome DevTools MCP configuration and investigating how Chrome's remote debugging protocol handles discarded tabs. I'll analyze the output as soon as it returns.", "agent_time": "3:56pm", "date_iso": "2026-10-16"}, {"user": "I'm really fucking sick of this; how do you now know a reliable way to tell something so basic?", "time": "", "agent": "", "agent_time": "3:57pm", "date_iso": "2026-10-16"}, {"user": "continue, I didn't mean to stop this one", "time": "", "agent": "I'm locating the exact MCP configuration files for Chrome DevTools to see how the connection is being launched. Once the search finishes, I will inspect the launch parameters.\n\nI'm searching for where the `--auto-connect` flag is defined across the plugin manifests and configurations. I'll check the output when it completes.\n\n<span style=\"display: block; max-width: 65rem;\">\n\nThe root cause is a catastrophic design flaw in how `chrome-devtools-mcp` initializes when configured with the `--auto-connect` flag:\n\n1. **Eager Full-Browser Target Enumeration:** When an agent invokes Chrome DevTools MCP, it attaches Puppeteer to your running Chrome instance and queries every single open target across all windows.\n2. **Mass Parallel CDP Attach:** Inside `McpContext.js`, it runs `Promise.all()` across all 40 tabs simultaneously to establish a dedicated DevTools session (`page.createCDPSession()`) and force focus emulation (`page.emulateFocusedPage(true)`).\n3. **The Thundering Herd:** Chrome's Memory Saver sleeps background tabs by terminating their renderer processes. However, the Chrome DevTools Protocol cannot attach to a dead process. Attaching CDP forces Chromium's browser process to immediately revive and reload every sleeping tab at the exact same millisecond, spawning 40 heavy renderer processes at once and locking macOS.\n\n<br>\n\n<details>\n<summary>\ud83d\udd0d Deep Dive: The exact lines in `chrome-devtools-mcp` triggering the reloads</summary>\n\nInside `chrome-devtools-mcp` (`src/McpContext.js` and `src/DevtoolsUtils.js`), the initialization sequence eagerly hooks into every tab instead of lazily attaching to the active one:\n\n```javascript\n// McpContext.js -> createPagesSnapshot()\nfor (const page of allPages) {\n    // 1. Forces focus emulation on EVERY background tab\n    void page.emulateFocusedPage(true);\n}\n\n// DevtoolsUtils.js -> UniverseManager.init()\nconst promises = [];\nfor (const page of pages) {\n    // 2. Creates a CDP session on EVERY tab simultaneously in Promise.all\n    promises.push(this.#createUniverseFor(page).then(...));\n}\nawait Promise.all(promises);\n```\n\nWhen Chromium receives `Target.attachToTarget` or `Emulation.setFocusEmulationEnabled` for a discarded `WebContents`, it invokes `WebContents::Reload()` to bring the renderer back to life. Firing this across 40 discarded tabs in parallel causes a massive burst of V8 compilation, network fetches, and DOM layout that consumes 100% CPU and triggers disk paging thrash.\n</details>\n\n<br>\n\n<details>\n<summary>\ud83d\udee0\ufe0f Recommended Fix: Decouple MCP from your personal Chrome profile</summary>\n\nIn your configuration files (`~/.gemini/antigravity/mcp_config.json`, `~/.gemini/antigravity-ide/mcp_config.json`, and `~/.gemini/config/mcp_config.json`), `chrome-devtools-mcp` is currently launched with:\n\n```json\n\"chrome-devtools\": {\n  \"command\": \"npx\",\n  \"args\": [\n    \"-y\",\n    \"chrome-devtools-mcp@latest\",\n    \"--auto-connect\"\n  ]\n}\n```\n\n### Option A: Remove `--auto-connect` (Recommended)\nRemove the `\"--auto-connect\"` argument from the config. \n\nWhen `--auto-connect` is omitted, `chrome-devtools-mcp` automatically spawns its own isolated Chrome profile (`~/.cache/chrome-devtools-mcp/chrome-profile`) dedicated purely to agent automation:\n- Your daily driver Chrome (and all 40 sleeping tabs) remains 100% untouched.\n- Agent automation runs in a clean, snappy, single-tab environment.\n- Logins or state tested by the agent persist within that dedicated test profile without polluting your personal browsing session.\n\n### Option B: Disable the Remote Debugging Server in Chrome\nIf you keep the flag for specific workflows but don't want it hijacking your main session automatically, navigate to `chrome://inspect/#remote-debugging` in Chrome and ensure **\"Start debugging server\"** is disabled. `chrome-devtools-mcp` connects by reading the `DevToolsActivePort` file generated by that feature; disabling it prevents auto-attaching to your daily browser.\n</details>\n\n<br>\n\nWould you like me to update your `mcp_config.json` files to remove `--auto-connect` so agents run on an isolated Chrome profile?\n\n<br>\n</span>", "agent_time": "3:57pm", "date_iso": "2026-10-16"}]}}

<script>
  const threads = JSON.parse(document.getElementById('threads-data').textContent);
  const list = document.getElementById('thread-list');
  const content = document.getElementById('thread-content');
  
  function openFinder(url) {
    // macOS file URL handler trick: use a hidden iframe to prevent browser navigation
    const iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);
    setTimeout(() => document.body.removeChild(iframe), 1000);
  }

  function renderThread(id) {
    const thread = threads[id];
    document.querySelectorAll('.thread-item').forEach(el => el.classList.remove('active'));
    document.getElementById('item-' + id).classList.add('active');
    
    // Milestone View Layout
    content.innerHTML = `
      <div style="margin-bottom:30px; padding:20px; background:var(--panel2); border-radius:12px;">
        <h2 style="margin-top:0;">${thread.title}</h2>
        <p><strong>Context & Discussion Summary:</strong><br>${thread.summary || '<i>No summary available.</i>'}</p>
        <p><strong>Agent Actions:</strong><br>${thread.actions || '<i>No specific actions logged.</i>'}</p>
        <a href="thread.md" style="display:inline-block; margin-top:10px; padding:8px 16px; background:var(--accent); color:var(--bg); border-radius:6px; font-weight:600;">Open Full Raw Thread</a>
      </div>
      ${thread.html}
    `;
  }

  Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp).forEach(id => {
    const t = threads[id];
    const div = document.createElement('div');
    div.className = 'thread-item';
    div.id = 'item-' + id;
    div.innerHTML = `<div class="title">${t.title}</div><div class="meta">${t.date} · ${t.source}</div>`;
    div.onclick = () => renderThread(id);
    list.appendChild(div);
  });

  if (Object.keys(threads).length > 0) {
      renderThread(Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp)[0]);
  }
</script>
</script>
