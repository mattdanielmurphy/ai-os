{"83452085-f2a9-4fd2-8125-c3fef5b8a1d3": {"title": "Conversation 83452085", "exchanges": [{"user": "I want to get better at singing.\nI need a github project that will replicate Rock Band style live pitch detection feedback and an accuracy score for each song. Must be able to use basically any song in the world.", "time": "", "agent": "I've initiated the pre-flight check and am waiting for the system status to return before analyzing the best GitHub open-source options for Rock Band-style live pitch detection and scoring.\n\nTo get real-time **Rock Band**-style vocal feedback (scrolling pitch highway, live pitch indicator showing whether you are sharp/flat, and an accuracy score) with the requirement to support **basically any song in the world**, there is an established open-source ecosystem that handles both sides of the challenge:\n\n---\n\n### The Two Halves of the Problem\n\n1. **The Game & Feedback Engine:** Needs real-time mic capture, low-latency pitch detection (e.g. YIN/CREPE algorithms), octave-independent pitch matching, and visual highway scoring.\n2. **The \"Any Song in the World\" Pipeline:** In commercial games like Rock Band or SingStar, humans painstakingly author the vocal note tracks. For *any* song, modern AI pipelines extract vocals (Demucs), detect lyrics & timestamps (Whisper), and extract note pitches (SPICE / torchcrepe) automatically into standard game format files.\n\n---\n\n### 1. Ready-to-Play Open Source Engines (The Game)\n\n* **[UltraStar Play](https://github.com/UltraStar-Deluxe/Play)** (Unity, Cross-Platform macOS / Windows / Linux)\n  * **Why it fits:** The modern, polished rewrite of UltraStar Deluxe. Provides the exact SingStar / Rock Band style horizontal pitch highway, visual sharp/flat feedback, syllable alignment, and real-time accuracy scoring.\n  * **Mic input:** Works directly with USB microphones, audio interfaces, or even a smartphone companion app.\n  * **Format:** Uses the universal `.txt` karaoke track format (specifying timing, pitch/note, and syllable for each phrase).\n\n* **[UltraStar Deluxe (USDX)](https://github.com/UltraStar-Deluxe/USDX)**\n  * The classic open-source singing engine with over 15 years of community song libraries (tens of thousands of pre-made community charts available online).\n\n---\n\n### 2. The \"Any Song in the World\" AI Generators (The Pipeline)\n\nTo take any arbitrary MP3, YouTube URL, or audio file and turn it into a playable pitch highway in seconds:\n\n* **[UltraSinger](https://github.com/rakuri255/UltraSinger)** \u2b50 *(Recommended)*\n  * **Pipeline:** Takes any raw audio file $\\rightarrow$ runs **Demucs** to isolate the lead vocal $\\rightarrow$ runs **Whisper** for word/syllable timing $\\rightarrow$ runs **CREPE / Pyin** for pitch extraction $\\rightarrow$ quantizes notes to key $\\rightarrow$ exports directly to UltraStar song files with audio & background video.\n  * Can be run via a simple CLI command:\n    ```bash\n    ultrasinger -i \"song.mp3\"\n    ```\n* **[Ultrasongs](https://github.com/pablopramparo/ultrasongs)**\n  * A modern web/desktop GUI that combines Demucs, `torchcrepe`, and `faster-whisper` with a built-in interactive timeline editor so you can visually verify and tweak notes before singing.\n\n---\n\n### 3. Web-First Alternative (If you want a lightweight browser app)\n\nIf you'd prefer a self-contained browser app (or want to build/host one locally):\n* Use **Web Audio API** (`AudioWorklet`) paired with **[pitchfinder](https://github.com/peterkhayes/pitchfinder)** (YIN algorithm) or TensorFlow.js **SPICE** for zero-latency in-browser vocal pitch tracking.\n* Convert frequency ($Hz$) to musical pitch with the standard equation:\n  $$\\text{MIDI Note} = 69 + 12 \\log_2\\left(\\frac{f}{440}\\right)$$\n* Render the pitch highway on an HTML5 `<canvas>` comparing your live note against an UltraStar `.txt` or MIDI track.\n\n---\n\n### Recommended Quick Start\nThe fastest path to practicing immediately:\n1. Install **[UltraStar Play](https://github.com/UltraStar-Deluxe/Play)** for the gameplay and live feedback UI.\n2. Run **[UltraSinger](https://github.com/rakuri255/UltraSinger)** against whatever songs you want to practice to auto-generate the pitch highways.", "agent_time": "1:42am", "date_iso": "2026-10-14"}]}}

<script>
  const threads = JSON.parse(document.getElementById('threads-data').textContent);
  const list = document.getElementById('thread-list');
  const content = document.getElementById('thread-content');
  
  function openFinder(url) {
    // macOS file URL handler trick: use a hidden iframe to prevent browser navigation
    const iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);
    setTimeout(() => document.body.removeChild(iframe), 1000);
  }

  function renderThread(id) {
    const thread = threads[id];
    document.querySelectorAll('.thread-item').forEach(el => el.classList.remove('active'));
    document.getElementById('item-' + id).classList.add('active');
    
    // Milestone View Layout
    content.innerHTML = `
      <div style="margin-bottom:30px; padding:20px; background:var(--panel2); border-radius:12px;">
        <h2 style="margin-top:0;">${thread.title}</h2>
        <p><strong>Context & Discussion Summary:</strong><br>${thread.summary || '<i>No summary available.</i>'}</p>
        <p><strong>Agent Actions:</strong><br>${thread.actions || '<i>No specific actions logged.</i>'}</p>
        <a href="thread.md" style="display:inline-block; margin-top:10px; padding:8px 16px; background:var(--accent); color:var(--bg); border-radius:6px; font-weight:600;">Open Full Raw Thread</a>
      </div>
      ${thread.html}
    `;
  }

  Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp).forEach(id => {
    const t = threads[id];
    const div = document.createElement('div');
    div.className = 'thread-item';
    div.id = 'item-' + id;
    div.innerHTML = `<div class="title">${t.title}</div><div class="meta">${t.date} · ${t.source}</div>`;
    div.onclick = () => renderThread(id);
    list.appendChild(div);
  });

  if (Object.keys(threads).length > 0) {
      renderThread(Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp)[0]);
  }
</script>
