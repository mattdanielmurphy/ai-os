-crossword/.gitignore) and adheres to workspace temporary file standards.\n2. **Robust Cleanup**: Wrapped `child.exited` in a `try ... finally` block ensuring `rm(tsconfigPath, { force: true })` runs on normal exits and intercepted termination signals (`SIGINT`, `SIGTERM`).\n3. **Defense-in-Depth Git Ignore**: Added `.tsconfig.dev-*.json` to [.gitignore](file:///Users/matt/projects/daily-mini-crossword/.gitignore) to prevent any stray configs from appearing in `git status`.\n4. **Preserved Working Tree**: Retained all unrelated working tree changes untouched, including [src/components/crossword/ActiveClueBar.tsx](file:///Users/matt/projects/daily-mini-crossword/src/components/crossword/ActiveClueBar.tsx), [src/lib/audio/RadioContext.tsx](file:///Users/matt/projects/daily-mini-crossword/src/lib/audio/RadioContext.tsx), [src/lib/audio/radio-stations.ts](file:///Users/matt/projects/daily-mini-crossword/src/lib/audio/radio-stations.ts), [package.json](file:///Users/matt/projects/daily-mini-crossword/package.json), and [bun.lock](file:///Users/matt/projects/daily-mini-crossword/bun.lock).\n\n---\n\n### Verification Commands & Outcomes\n\n#### 1. Reproducing the Original Failure\n\n**Build Path Reproduction:**\n```bash\nmkdir -p .next/dev-test && \\\necho '{ \"extends\": \"../../tsconfig.json\" }' > .next/dev-test/tsconfig.json && \\\nNEXT_DEV_DIST_DIR=.next/dev-test NEXT_DEV_TSCONFIG=.next/dev-test/tsconfig.json bun run build\n```\n- **Outcome:** **Failed (Reproduced exact error)**\n  ```\n  ./.next/dev-test/tsconfig.json\n  tsconfig not found\n  ```\n\n**Dev Server Reproduction:**\n```bash\nNEXT_DEV_DIST_DIR=.next/dev-test NEXT_DEV_TSCONFIG=.next/dev-test/tsconfig.json ./node_modules/.bin/next dev --experimental-https --port 0\ncurl -k -i https://localhost:<PORT>/\n```\n- **Outcome:** **Failed with HTTP 500 (Reproduced exact error)**\n  ```\n  \"message\":\"./.next/dev-test/tsconfig.json\\nError: An issue occurred while parsing a tsconfig.json file.\\ntsconfig not found <script>
  const threads = JSON.parse(document.getElementById('threads-data').textContent);
  const list = document.getElementById('thread-list');
  const content = document.getElementById('thread-content');
  
  function openFinder(url) {
    // macOS file URL handler trick: use a hidden iframe to prevent browser navigation
    const iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);
    setTimeout(() => document.body.removeChild(iframe), 1000);
  }

  function renderThread(id) {
    const thread = threads[id];
    document.querySelectorAll('.thread-item').forEach(el => el.classList.remove('active'));
    document.getElementById('item-' + id).classList.add('active');
    
    // Milestone View Layout
    content.innerHTML = `
      <div style="margin-bottom:30px; padding:20px; background:var(--panel2); border-radius:12px;">
        <h2 style="margin-top:0;">${thread.title}</h2>
        <p><strong>Context & Discussion Summary:</strong><br>${thread.summary || '<i>No summary available.</i>'}</p>
        <p><strong>Agent Actions:</strong><br>${thread.actions || '<i>No specific actions logged.</i>'}</p>
        <a href="thread.md" style="display:inline-block; margin-top:10px; padding:8px 16px; background:var(--accent); color:var(--bg); border-radius:6px; font-weight:600;">Open Full Raw Thread</a>
      </div>
      ${thread.html}
    `;
  }

  Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp).forEach(id => {
    const t = threads[id];
    const div = document.createElement('div');
    div.className = 'thread-item';
    div.id = 'item-' + id;
    div.innerHTML = `<div class="title">${t.title}</div><div class="meta">${t.date} · ${t.source}</div>`;
    div.onclick = () => renderThread(id);
    list.appendChild(div);
  });

  if (Object.keys(threads).length > 0) {
      renderThread(Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp)[0]);
  }
</script>
