{"d985be29-9601-45b6-b046-f11f412ba303": {"title": "Conversation d985be29", "exchanges": [{"user": "I have a special puzzle for tyler for today published, and then unpublished it (changed it to a draft), and now, when I go to the same url (`https://localhost:57557/tyler?d=2026-10-09`) as before, instead of seeing the generic daily puzzle for that day, I see YESTERDAY'S special puzzle.", "time": "", "agent": "The tests are finishing execution in the background; waiting for the test suite results.\n\nThe new puzzle assignment unit tests are executing in the background; awaiting completion.\n\nThe entire test suite is running in the background; awaiting final results.\n\n\nAlmost complete.\n\nFinishing test run.\n\n### Root Cause\n\n1. **Custom Puzzle Bleed across Dates**: In [`src/lib/services/puzzle-service.ts`](file:///Users/matt/projects/daily-mini-crossword/src/lib/services/puzzle-service.ts#L678-L690), Step 1 prioritizes custom puzzles explicitly scheduled for today (`assignedDate = dateStr`). When today's custom puzzle was unpublished (draft), Step 2 looked for unplayed custom puzzles for Tyler without checking `isNull(puzzles.assignedDate)`. Because `custom-tyler-01` had `assignedDate: \"2026-10-08\"` and was uncompleted, Step 2 greedily assigned yesterday's custom puzzle to Tyler for today (`2026-10-09`).\n2. **Missing `assignedDate` Check on Reused Assignments**: In [`getOrAssignProfileDailyPuzzle`](file:///Users/matt/projects/daily-mini-crossword/src/lib/services/puzzle-service.ts#L614-L630), when reusing a profile's saved `dailyPuzzleId`, the query checked `status = 'published'` but never verified whether `assignedDate` matched `dateStr`, locking in the stale cross-date assignment.\n3. **Stale Profile References on Unpublishing**: When an active custom puzzle was changed to `draft` via `upsertCustomPuzzle`, `dailyPuzzleId` on profiles was not unlinked.\n\n---\n\n### Changes Implemented\n\n1. **Restricted Step 2 to Floating Custom Puzzles**:\n   - Added `isNull(puzzles.assignedDate)` to Step 2 in [`src/lib/services/puzzle-service.ts`](file:///Users/matt/projects/daily-mini-crossword/src/lib/services/puzzle-service.ts#L678-L690). Custom crosswords with an explicit `assignedDate` are strictly bound to their calendar day and cannot bleed into other days.\n2. **Validated `assignedDate` on `dailyPuzzleId` Reuse**:\n   - Added `!selected[0].assignedDate || selected[0].assignedDate === dateStr` in [`getOrAssignProfileDailyPuzzle`](file:///Users/matt/projects/daily-mini-crossword/src/lib/services/puzzle-service.ts#L614-L630) so an assignment from a different date is rejected and reassigned to the generic daily puzzle.\n3. **Unlinked Daily Assignment on Draft**:\n   - When a puzzle is updated to `status = 'draft'` in [`upsertCustomPuzzle`](file:///Users/matt/projects/daily-mini-crossword/src/lib/services/puzzle-service.ts#L305-L310), any profile that had that puzzle assigned has `dailyPuzzleId` cleared immediately.\n4. **Automated Test Suite**:\n   - Added [`src/lib/services/puzzle-service.test.ts`](file:///Users/matt/projects/daily-mini-crossword/src/lib/services/puzzle-service.test.ts) covering date isolation, fallback to the generic daily catalogue when today's puzzle is draft, and draft unlinking.\n\n---\n\n### Verification\n\n- **Live Test on Tyler's Profile**: Navigating to `https://localhost:57557/tyler?d=2026-10-09` now serves the generic daily catalogue puzzle (**Daily Mini Crossword 2015-03-16**), while navigating to `?d=2026-10-08` serves **Tyler's First Mini**.\n- **Automated Tests**: All 80 tests pass across 12 test files (`bun test`).\n- **Production Build**: Built cleanly with Turbopack and 0 TypeScript errors (`bun run build`).", "agent_time": "11:48pm", "date_iso": "2026-10-09"}]}}

<script>
  const threads = JSON.parse(document.getElementById('threads-data').textContent);
  const list = document.getElementById('thread-list');
  const content = document.getElementById('thread-content');
  
  function openFinder(url) {
    // macOS file URL handler trick: use a hidden iframe to prevent browser navigation
    const iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);
    setTimeout(() => document.body.removeChild(iframe), 1000);
  }

  function renderThread(id) {
    const thread = threads[id];
    document.querySelectorAll('.thread-item').forEach(el => el.classList.remove('active'));
    document.getElementById('item-' + id).classList.add('active');
    
    // Milestone View Layout
    content.innerHTML = `
      <div style="margin-bottom:30px; padding:20px; background:var(--panel2); border-radius:12px;">
        <h2 style="margin-top:0;">${thread.title}</h2>
        <p><strong>Context & Discussion Summary:</strong><br>${thread.summary || '<i>No summary available.</i>'}</p>
        <p><strong>Agent Actions:</strong><br>${thread.actions || '<i>No specific actions logged.</i>'}</p>
        <a href="thread.md" style="display:inline-block; margin-top:10px; padding:8px 16px; background:var(--accent); color:var(--bg); border-radius:6px; font-weight:600;">Open Full Raw Thread</a>
      </div>
      ${thread.html}
    `;
  }

  Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp).forEach(id => {
    const t = threads[id];
    const div = document.createElement('div');
    div.className = 'thread-item';
    div.id = 'item-' + id;
    div.innerHTML = `<div class="title">${t.title}</div><div class="meta">${t.date} · ${t.source}</div>`;
    div.onclick = () => renderThread(id);
    list.appendChild(div);
  });

  if (Object.keys(threads).length > 0) {
      renderThread(Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp)[0]);
  }
</script>
