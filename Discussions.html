tml](file:///Users/matt/projects/qwerty-midi-hammerspoon/src/web/index.html):\n     - $\\text{Rate} = \\left\\lfloor \\frac{BPM - 30}{240 - 30} \\times 127 + 0.5 \\right\\rfloor$\n     - **30 BPM** $\\to$ **Rate 0** (fully counter-clockwise)\n     - **~136\u2013137 BPM** $\\to$ **Rate 64** (exact 12:00 midpoint rotation)\n     - **240 BPM** $\\to$ **Rate 127** (fully clockwise)\n\n3. **Sub-Second Adaptive Sliding-Window Clock Tracking**:\n   - **Root Cause**: The old `handleClock` routine waited for 24 non-overlapping pulses before calculating tempo (up to 2.0s at low BPM) and then blended with a 60% exponential memory (`bpm * 0.6 + instantBpm * 0.4`), requiring 6\u201310 multi-second cycles (5\u201310+ seconds) to slowly creep to the new value.\n   - **Fix**: Rebuilt the clock estimator with an adaptive rolling ring buffer:\n     - Evaluates on **every clock pulse** over a target sliding window of ~200ms ($\\ge 4$ pulses, up to 16 pulses).\n     - Employs an adaptive slew rate: $\\alpha = 0.85$ on active knob turns ($|\\Delta| > 8$ BPM) for immediate snapping ($< 0.25$s), scaling to $\\alpha = 0.10$ with deadband hysteresis in steady state to reject USB packet jitter.\n\n### Verification Details\n- **Automated Tests**: All 29 tests pass across 8 test suites in `bun test`.\n- **Live Hardware Test**: Verified live in Hammerspoon with your physical KeyStep 32 connected and streaming 24-PPQN timing clock; resting position at halfway locked cleanly to `137-138 BPM` (Rate 65).\n- Detailed technical notes and metrics are recorded in the [walkthrough.md](file:///Users/matt/.gemini/antigravity/brain/34a365b8-bfc2-4c50-8d08-8f3aeab14dee/walkthrough.md) artifact.", "agent_time": "9:51pm", "date_iso": "2026-10-01"}]}}

<script>
  const threads = JSON.parse(document.getElementById('threads-data').textContent);
  const list = document.getElementById('thread-list');
  const content = document.getElementById('thread-content');
  
  function openFinder(url) {
    // macOS file URL handler trick: use a hidden iframe to prevent browser navigation
    const iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);
    setTimeout(() => document.body.removeChild(iframe), 1000);
  }

  function renderThread(id) {
    const thread = threads[id];
    document.querySelectorAll('.thread-item').forEach(el => el.classList.remove('active'));
    document.getElementById('item-' + id).classList.add('active');
    
    // Milestone View Layout
    content.innerHTML = `
      <div style="margin-bottom:30px; padding:20px; background:var(--panel2); border-radius:12px;">
        <h2 style="margin-top:0;">${thread.title}</h2>
        <p><strong>Context & Discussion Summary:</strong><br>${thread.summary || '<i>No summary available.</i>'}</p>
        <p><strong>Agent Actions:</strong><br>${thread.actions || '<i>No specific actions logged.</i>'}</p>
        <a href="thread.md" style="display:inline-block; margin-top:10px; padding:8px 16px; background:var(--accent); color:var(--bg); border-radius:6px; font-weight:600;">Open Full Raw Thread</a>
      </div>
      ${thread.html}
    `;
  }

  Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp).forEach(id => {
    const t = threads[id];
    const div = document.createElement('div');
    div.className = 'thread-item';
    div.id = 'item-' + id;
    div.innerHTML = `<div class="title">${t.title}</div><div class="meta">${t.date} · ${t.source}</div>`;
    div.onclick = () => renderThread(id);
    list.appendChild(div);
  });

  if (Object.keys(threads).length > 0) {
      renderThread(Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp)[0]);
  }
</script>
