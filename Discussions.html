laying with synths and laptops in a live jam creates genuine performance anxiety if you're worried a random velocity spike or knob glitch will blast 110 dB into a PA speaker.\n\nTo make Logic behave like a locked-down, fail-safe hardware groovebox:\n\n1. **Brickwall Limiter on the Stereo Out (Safety Ceiling)**:\n   - Insert Logic's built-in **Limiter** or **Adaptive Limiter** as the very last plugin on your `Stereo Out`.\n   - Set **Ceiling** to `-2.0 dB` or `-3.0 dB`, with lookahead enabled. No matter what feedback loop or volume knob accident happens upstream, the audio signal physically cannot exceed that threshold into the room's speakers.\n2. **Constrain MIDI CC Range in Controller Assignments**:\n   - When mapping your Korg knobs/faders to channel volume (`Cmd + K` > Controller Assignments), check the **Value** properties:\n   - Restrict the **Max Value** so 100% on the physical knob corresponds to `0.0 dB` (or `-3.0 dB`), and **Min Value** to `-40 dB` or `-inf`. That way, even if you panic and crank the knob all the way up, it can never boost past unity.\n3. **Dedicated 3-Track Template**:\n   - Create a single template with exactly 3 pre-sound-checked channels:\n     1. *Guitar* (clean/light crunch amp sim + tuner plugin engaged on bypass).\n     2. *Poly Synth Pad/Lead* (one warm, gentle sound that blends easily).\n     3. *Sample/Texture Track*.\n   - Lock track protection on everything else so clicking the trackpad can't accidentally add tracks or change routing mid-jam.\n\n---\n\nReview the draft text above. If you'd like any wording tweaked before sending, let me know; otherwise, you can copy, paste, send, and cross those off your mind immediately.\n\nReference log: [thread.md](file:///Users/matt/.gemini/antigravity-cli/brain/eb9b4e39-1b23-4417-b8dd-c10333fbefc2/thread.md)", "agent_time": "6:42pm", "date_iso": "2026-09-27"}]}}

<script>
  const threads = JSON.parse(document.getElementById('threads-data').textContent);
  const list = document.getElementById('thread-list');
  const content = document.getElementById('thread-content');
  
  function openFinder(url) {
    // macOS file URL handler trick: use a hidden iframe to prevent browser navigation
    const iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);
    setTimeout(() => document.body.removeChild(iframe), 1000);
  }

  function renderThread(id) {
    const thread = threads[id];
    document.querySelectorAll('.thread-item').forEach(el => el.classList.remove('active'));
    document.getElementById('item-' + id).classList.add('active');
    
    // Milestone View Layout
    content.innerHTML = `
      <div style="margin-bottom:30px; padding:20px; background:var(--panel2); border-radius:12px;">
        <h2 style="margin-top:0;">${thread.title}</h2>
        <p><strong>Context & Discussion Summary:</strong><br>${thread.summary || '<i>No summary available.</i>'}</p>
        <p><strong>Agent Actions:</strong><br>${thread.actions || '<i>No specific actions logged.</i>'}</p>
        <a href="thread.md" style="display:inline-block; margin-top:10px; padding:8px 16px; background:var(--accent); color:var(--bg); border-radius:6px; font-weight:600;">Open Full Raw Thread</a>
      </div>
      ${thread.html}
    `;
  }

  Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp).forEach(id => {
    const t = threads[id];
    const div = document.createElement('div');
    div.className = 'thread-item';
    div.id = 'item-' + id;
    div.innerHTML = `<div class="title">${t.title}</div><div class="meta">${t.date} · ${t.source}</div>`;
    div.onclick = () => renderThread(id);
    list.appendChild(div);
  });

  if (Object.keys(threads).length > 0) {
      renderThread(Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp)[0]);
  }
</script>
