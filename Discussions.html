ted template (e.g. `cover_letter_classic` or a standalone `CoverLetterRenderer`) keeps your resume themes clean while giving cover letters dedicated typesetting controls.\n\n***\n\n## Implementation Plan for `job-applier`\n\n### 1. Data Schema & Model Separation\nEnsure the cover letter payload provides dedicated business letter fields rather than overloading resume profile structures:\n\n```typescript\ninterface CoverLetterPayload {\n  sender: {\n    name: string;\n    title?: string;\n    credentials?: string; // e.g. \"RSE\"\n    location: string;\n    email: string;\n    phone: string;\n    linkedin?: string;\n  };\n  recipient: {\n    name?: string;          // e.g. \"Hiring Committee\" or \"Jane Doe\"\n    title?: string;         // e.g. \"Director of Talent Acquisition\"\n    companyName: string;\n    department?: string;\n    addressLine?: string;\n  };\n  metadata: {\n    date: string;           // Formatted date string\n    jobTitle: string;       // e.g. \"Electrical Project Manager\"\n    referenceNumber?: string;\n  };\n  content: {\n    salutation: string;     // e.g. \"Dear Hiring Committee,\"\n    paragraphs: string[];   // Body paragraphs\n    closing: string;        // e.g. \"Sincerely,\" or \"Respectfully,\"\n    signatureName: string;\n    signatureSuffix?: string; // e.g. \"Interprovincial Red Seal Electrician (#618435)\"\n  };\n  styleVariant?: 'classic-letter' | 'modern-letter' | 'minimal';\n}\n```\n\n***\n\n### 2. Dedicated Template & Layout Component\nBuild a standalone template (`CoverLetterClassic.tsx` / `.html.jinja`) with specific typographic and layout rules:\n\n- **Letterhead / Header:**\n  - Clean typographic hierarchy: Name in 20\u201324pt bold serif or clean neo-grotesque sans.\n  - Subtitle / target specialty centered or left-aligned beneath the name in 10pt with muted tracking.\n  - Contact row in 9\u20139.5pt separated by clean bullets or pipe characters (no bulky SVG icons).\n  - Optional elegant 0.5pt divider line to anchor the <script>
  const threads = JSON.parse(document.getElementById('threads-data').textContent);
  const list = document.getElementById('thread-list');
  const content = document.getElementById('thread-content');
  
  function openFinder(url) {
    // macOS file URL handler trick: use a hidden iframe to prevent browser navigation
    const iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);
    setTimeout(() => document.body.removeChild(iframe), 1000);
  }

  function renderThread(id) {
    const thread = threads[id];
    document.querySelectorAll('.thread-item').forEach(el => el.classList.remove('active'));
    document.getElementById('item-' + id).classList.add('active');
    
    // Milestone View Layout
    content.innerHTML = `
      <div style="margin-bottom:30px; padding:20px; background:var(--panel2); border-radius:12px;">
        <h2 style="margin-top:0;">${thread.title}</h2>
        <p><strong>Context & Discussion Summary:</strong><br>${thread.summary || '<i>No summary available.</i>'}</p>
        <p><strong>Agent Actions:</strong><br>${thread.actions || '<i>No specific actions logged.</i>'}</p>
        <a href="thread.md" style="display:inline-block; margin-top:10px; padding:8px 16px; background:var(--accent); color:var(--bg); border-radius:6px; font-weight:600;">Open Full Raw Thread</a>
      </div>
      ${thread.html}
    `;
  }

  Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp).forEach(id => {
    const t = threads[id];
    const div = document.createElement('div');
    div.className = 'thread-item';
    div.id = 'item-' + id;
    div.innerHTML = `<div class="title">${t.title}</div><div class="meta">${t.date} · ${t.source}</div>`;
    div.onclick = () => renderThread(id);
    list.appendChild(div);
  });

  if (Object.keys(threads).length > 0) {
      renderThread(Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp)[0]);
  }
</script>
