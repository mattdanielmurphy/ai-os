n**:\n   - Sponsored row containers (`.AdHolder` with `data-asin=\"\"`) bypassed `RESULT_SELECTOR`, allowing sponsored items with excluded terms (such as \"motion\") to remain rendered in the feed.\n5. **Non-Word Character Boundary Failures**:\n   - Unconditional `\\b` word boundary anchors failed when terms contained punctuation, symbols, or hyphens because regex `\\b` requires a transition between word (`\\w`) and non-word (`\\W`) characters.\n\n---\n\n### Fixes Implemented\n\n1. **Flexible Delimiter Regex Matching**:\n   - Updated [`makeTermRegex()`](file:///Users/matt/projects/userscript-bundler/userscripts/amazon%20filter.js#L174-L203) so hyphenated terms (e.g. `pull-out`) match `pull-out`, `pull out`, and `pullout` (`[-\\s]?`).\n   - Space-separated terms (e.g. `pull out`) match `pull out` and `pull-out` (`[-\\s]+`).\n   - Guarded `\\b` boundaries so they are only applied when adjacent characters are alphanumeric (`\\w`), and enabled the `\"i\"` flag with automatic trimming of quotes.\n2. **Comma-Separated Multi-Term Support for \"Require:\"**:\n   - Updated [`titleMatchesMustHave()`](file:///Users/matt/projects/userscript-bundler/userscripts/amazon%20filter.js#L209-L226) to split OR clauses first, then parse each clause by `[,;]|\\s+and\\s+/i`.\n   - Terms like `dual, step` or `recycle, trash` now correctly require all listed terms, and trailing commas no longer cause empty-string matching failures.\n3. **Accurate Keyword vs. Brand Statistics & UI Counts**:\n   - Expanded [`state.stats`](file:///Users/matt/projects/userscript-bundler/userscripts/amazon%20filter.js#L137-L143) to track `filteredByKeywords` and `filteredByBrand` independently.\n   - Updated [`updateTopFilterCount()`](file:///Users/matt/projects/userscript-bundler/userscripts/amazon%20filter.js#L907-L936):\n     - **Brand Filter OFF:** Displays `\ud83d\udc41\ufe0f [allowed] of [total] products shown ([filteredByKeywords] hidden by keyword filter). Brand Filter is OFF.`\n     - **Brand Filter ON:* <script>
  const threads = JSON.parse(document.getElementById('threads-data').textContent);
  const list = document.getElementById('thread-list');
  const content = document.getElementById('thread-content');
  
  function openFinder(url) {
    // macOS file URL handler trick: use a hidden iframe to prevent browser navigation
    const iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);
    setTimeout(() => document.body.removeChild(iframe), 1000);
  }

  function renderThread(id) {
    const thread = threads[id];
    document.querySelectorAll('.thread-item').forEach(el => el.classList.remove('active'));
    document.getElementById('item-' + id).classList.add('active');
    
    // Milestone View Layout
    content.innerHTML = `
      <div style="margin-bottom:30px; padding:20px; background:var(--panel2); border-radius:12px;">
        <h2 style="margin-top:0;">${thread.title}</h2>
        <p><strong>Context & Discussion Summary:</strong><br>${thread.summary || '<i>No summary available.</i>'}</p>
        <p><strong>Agent Actions:</strong><br>${thread.actions || '<i>No specific actions logged.</i>'}</p>
        <a href="thread.md" style="display:inline-block; margin-top:10px; padding:8px 16px; background:var(--accent); color:var(--bg); border-radius:6px; font-weight:600;">Open Full Raw Thread</a>
      </div>
      ${thread.html}
    `;
  }

  Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp).forEach(id => {
    const t = threads[id];
    const div = document.createElement('div');
    div.className = 'thread-item';
    div.id = 'item-' + id;
    div.innerHTML = `<div class="title">${t.title}</div><div class="meta">${t.date} · ${t.source}</div>`;
    div.onclick = () => renderThread(id);
    list.appendChild(div);
  });

  if (Object.keys(threads).length > 0) {
      renderThread(Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp)[0]);
  }
</script>
</script>
