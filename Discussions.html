{"177c7808-617a-43fb-b783-5464a5b34528": {"title": "Conversation 177c7808", "exchanges": [{"user": "I'm wondering if I might consider a slight change in direction at uni.\nBasically, I am majoring in computer science with emphasis on AI, and I think that's what I want to be doing. But you know what, to be honest with you, right now, I'm extremely interested in building and designing software with AI. And so the course that I am in right now, C-M-P-U-T-1-7-4, where you're just learning the fundamentals of Python, I mean, it's fine. It's just now getting to the point where it's mostly interesting. But I just don't know how valuable it is for me to learn, really. And I think right now there's like this golden opportunity to make software and to build software with AI and to explore new things and do new research. and basically I think, I don't know, part of me wonders if I'm wasting extremely precious time learning like fundamentals of how to program in Python when in reality the need to program by hand is becoming really obsolete to be honest I mean, the state-of-the-art models are so good and so cheap that it's not really all that necessary. I think my grasp is probably good enough. But I understand we're not just learning about Python syntax and stuff in the class, So I don't know, maybe I just need to be patient and hold the line here. But honestly, as I continue to make a bunch of different projects, I struggle with them, with staying organized, with designing them. and I've come up with a few ideas now that I think could be legitimately viable apps that not only could generate some income for me, but legitimately make the world a better place. I don't know. I almost feel like I'm not as focused as I should be and that I should be talking with people on a daily basis who are also designing software and possibly try to actually meet some people to work with to make some real progress because it's hard to make progress on your own when you're so disorganized, have so many projects.", "time": "", "agent": "This is a dilemma that almost every builder who is genuinely ahead of the curve runs into right now. What you're feeling isn't laziness or lack of discipline; it\u2019s the **friction of operating at two completely different levels of abstraction**.\n\nHere is an honest breakdown of what's happening, what's actually valuable about your degree, and how to address the isolation and disorganization you\u2019re facing:\n\n---\n\n### 1. The Disconnect with CMPUT 174\nIntroductory courses like CMPUT 174 are pedagogical bottlenecks designed for students who have never reasoned about computation. \n- **The reality:** You are right that writing boilerplate Python syntax by hand is rarely the bottleneck when frontier AI handles 95% of syntax generation.\n- **The trap:** It's tempting to conclude that *all* of foundational CS is obsolete. But notice what you mentioned later in your message:\n  > *\"I struggle with them, with staying organized, with designing them.\"*\n- **The pivot in value:** The value of a CS degree today isn't syntax or writing a `for` loop from memory. It is **system design, state management, mental models of failure modes, architectural boundaries, and algorithmic thinking**. CMPUT 174 is teaching basic syntax today, but the downstream coursework (data structures, algorithms, operating systems, distributed architectures, database internals) gives you the exact mental models needed to debug and architect complex systems when AI makes mistakes or hallucinations occur.\n\n**Verdict:** Don't drop or pivot away from CS yet. Treat CMPUT 174 as an administrative box to check with minimum effective effort. Clear the assignments efficiently (even leveraging AI to explore deeper concepts beyond the assignment specs) so it doesn't drain the energy you need for building.\n\n---\n\n### 2. Disorganization & The \"Too Many Projects\" Trap\nWhen building with AI, the barrier to generating code drops to near zero. Because it\u2019s so easy to generate 500 lines of working code in 30 seconds, it is dangerously easy to start five apps in a weekend without finishing any of them.\n\nWhen you struggle with \"staying organized and designing them,\" that\u2019s usually a symptom of:\n1. **Scope sprawl:** Jumping straight to implementation before nailing a minimal, self-contained scope.\n2. **Context degradation:** Not having a single source of truth for architecture, schemas, and specs, causing projects to collapse under their own complexity when they grow past 3\u20134 files.\n3. **Lack of accountability:** When you're solo, you can abandon a hard architecture problem and start a shiny new repo without consequences.\n\nTo fix this:\n- **Pick exactly ONE project** from your list of ideas. Move the rest into a \"Backlog / Ideas\" list in your Obsidian vault.\n- **Enforce a strict constraint:** You are not allowed to push new features to a second project until project #1 has a working end-to-end prototype deployed or in the hands of a single real user.\n- **Use disciplined spec-driven development:** Write down the data model and core user loop in markdown *before* writing or generating code.\n\n---\n\n### 3. Finding Collaborators & Breaking the Solo Isolation\nBuilding alone in a room with an LLM is productive for spikes, but it creates an echo chamber. You miss peer code review, shared excitement, complementary skillsets (e.g. someone focused on distribution/frontend while you focus on system architecture/AI orchestration), and external accountability.\n\nAt the University of Alberta, there are immediate ways to connect with other builders:\n- **Student Tech Groups & Clubs:** \n  - **Ada's Team** and the **Undergraduate Computer Science Society (UACS)**: Drop into UACS events or the discord/lounge in CSC.\n  - **Student Dev / Hackathon Teams:** Look into groups building for competitions (like HackED, AlbertaSat, or local hackathons). Hackathons are the fastest filter to find people who actually *ship* rather than just talking about theory.\n  - **Amii (Alberta Machine Intelligence Institute):** U of A has one of the premier AI research ecosystems in the world. Look into Amii student events, meetups, and talks. You'll meet people who are passionate about the frontier of AI, not just classroom exercises.\n- **Local Builder Meetups:** Check Edmonton tech meetups (e.g., Edmonton.rb / Edmonton Tech / Startup TNT / Technology Alberta events). You\u2019ll find people who have product ideas and domain knowledge but desperately want technical collaborators who understand how to build fast with AI.\n\n---\n\n### Suggested Next Step\nRather than letting these thoughts swirl or feeling guilty about CMPUT 174:\n1. **Catalog your top app ideas:** Write a quick 3-bullet breakdown of each (Problem, Solution, Minimal Viable Scope).\n2. **Select the single highest-conviction idea** to focus your build energy on.\n3. **Set aside one afternoon this week** to drop by the UACS lounge, attend a student tech meetup, or reach out to 1\u20132 peers in your labs who seem engaged and interested in building real software.\n\nYou have the vision and the momentum with AI tools that most students won't discover for another two years. Combining that momentum with the foundational grounding of your degree and a couple of solid collaborators is the highest-leverage path forward.\n\n---\n*Reference:* [thread.md](file:///Users/matt/.gemini/antigravity/brain/177c7808-617a-43fb-b783-5464a5b34528/thread.md)", "agent_time": "6:00pm", "date_iso": "2026-09-21"}]}}

<script>
  const threads = JSON.parse(document.getElementById('threads-data').textContent);
  const list = document.getElementById('thread-list');
  const content = document.getElementById('thread-content');
  
  function openFinder(url) {
    // macOS file URL handler trick: use a hidden iframe to prevent browser navigation
    const iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);
    setTimeout(() => document.body.removeChild(iframe), 1000);
  }

  function renderThread(id) {
    const thread = threads[id];
    document.querySelectorAll('.thread-item').forEach(el => el.classList.remove('active'));
    document.getElementById('item-' + id).classList.add('active');
    
    // Milestone View Layout
    content.innerHTML = `
      <div style="margin-bottom:30px; padding:20px; background:var(--panel2); border-radius:12px;">
        <h2 style="margin-top:0;">${thread.title}</h2>
        <p><strong>Context & Discussion Summary:</strong><br>${thread.summary || '<i>No summary available.</i>'}</p>
        <p><strong>Agent Actions:</strong><br>${thread.actions || '<i>No specific actions logged.</i>'}</p>
        <a href="thread.md" style="display:inline-block; margin-top:10px; padding:8px 16px; background:var(--accent); color:var(--bg); border-radius:6px; font-weight:600;">Open Full Raw Thread</a>
      </div>
      ${thread.html}
    `;
  }

  Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp).forEach(id => {
    const t = threads[id];
    const div = document.createElement('div');
    div.className = 'thread-item';
    div.id = 'item-' + id;
    div.innerHTML = `<div class="title">${t.title}</div><div class="meta">${t.date} · ${t.source}</div>`;
    div.onclick = () => renderThread(id);
    list.appendChild(div);
  });

  if (Object.keys(threads).length > 0) {
      renderThread(Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp)[0]);
  }
</script>
</script>
