se muscles relax. Taking glasses off leaves them relaxed briefly, making uncorrected vision feel startlingly blurry.\n* **Neuroadaptation:** The brain adapts quickly to high-resolution input (\"4K\"). Removing glasses forces the brain back into muddy blur, which feels worse simply due to the visual contrast.\n* **Glasses Do Not Ruin Sight:** Eyeglasses do not cause muscle atrophy or permanent dependency; they merely relieve chronic fatigue and strain.\n\n---\n\n## 3. Eyeglass Tech & Manufacturing\n\n* **100-Year Progress:** Core spherical refraction math hasn't changed, but materials evolved from heavy crown glass $\\rightarrow$ CR-39 plastic $\\rightarrow$ high-index dense polymers with vacuum-deposited anti-reflective (AR) coatings.\n* **Digital Free-Form Surfacing (CNC):** Computer-controlled diamond point lathes cut custom, asymmetric surfaces on the back of lenses down to $0.01\\text{ D}$ precision. Eliminates off-axis peripheral distortion.\n* **Budget vs. Boutique:** Global scaling of free-form manufacturing means budget online labs ($30\u2013$60) deliver ~90\u201395% of the optical clarity of $600 boutique pairs.\n\n---\n\n## 4. Maintenance & Cleaning Protocol\n\n### Why Coatings Scratch\n* Modern plastic doesn't scratch easily; the **brittle outer Anti-Reflective (AR) coating** chips or gouges.\n* **Dry Wiping is Sandpaper:** Airborne dust, grit, and micro-salts dragged across a dry lens under finger pressure permanently scratch coatings.\n* **At-Home Repairs:** Toothpaste, baking soda, or etching cream strip or melt the AR coating, permanently ruining the lens geometry.\n\n### Safe Cleaning System\n1. **Always Rinse First:** Use water or lens spray to float off hard grit before touching with a cloth.\n2. **Microfiber Storage:** Store active cloths in a sealed Ziploc bag, hardshell case, or Altoids tin to block room dust/grit.\n3. **Rotation Schedule:** Buy multi-packs of microfiber cloths; treat them like socks and cycle into the wash weekly.\n\n---\n\n## 5. Laundry & Fabric Optimization\n\n### The Problem with Dryer Sheets / Liquid Softeners\n* Coat fibers in a thin, water-resistant layer of fat, wax, and silicone compounds.\n* **Microfiber:** Clogs microscopic split-polyester hooks, preventing oil absorption and causing smears.\n* **Towels:** Makes cotton water-repellent (slides water around instead of absorbing).\n* **Synthetics / Activewear:** Traps sweat and body oils, causing permanent odor (\"permastink\").\n* **Pet Hair:** Creates a micro-tacky residue that locks cat/dog hair into shirt weaves.\n\n### The Optimal Laundry Setup\n* **Ditch Dryer Sheets Entirely:** Use 3\u20134 **100% Wool Dryer Balls** kept permanently in the dryer drum.\n  * Reduces static by separating clothes and balancing electrical charge.\n  * Mechanically beats out pet hair into the lint trap.\n  * Leaves zero chemical or waxy residue on microfiber and towels.\n  * Lasts ~1,000+ loads (2\u20135 years).\n* **Heat Settings:** Default to **Low Heat / Perm Press / Delicates**.\n  * High heat (150\u00b0F+) bakes and snaps elastic (spandex), shrinks cotton, and creates severe static.\n* **Stripping Waxy Build-up:** Run towels/microfibers through a hot cycle with **1 cup of white vinegar** (no detergent) to strip legacy dryer sheet wax.", "time": "", "agent": "The content has been broken down into a suite of modular, deeply detailed notes adhering to the Karpathy LLM Wiki pattern in your personal Obsidian vault:\n\n---\n\n### Created Notes & Map of Content\n\n1. **[Optics, Vision, and Glasses Care Master Note](file:///Users/matt/Library/Mobile%20Documents/iCloud~md~obsidian/Documents/Personal/Health%20&%20Fitness/Optics,%20Vision,%20and%20Glasses%20Care.md)**\n   * **Role:** Central Hub / Map of Content (MOC).\n   * Synthesizes all five sub-domains and establishes cross-links across the physiological, optical, manufacturing, and textile maintenance subsystems.\n\n2. **[Ocular Shapes and Refractive Optics](file:///Users/matt/Library/Mobile%20Doc <script>
  const threads = JSON.parse(document.getElementById('threads-data').textContent);
  const list = document.getElementById('thread-list');
  const content = document.getElementById('thread-content');
  
  function openFinder(url) {
    // macOS file URL handler trick: use a hidden iframe to prevent browser navigation
    const iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);
    setTimeout(() => document.body.removeChild(iframe), 1000);
  }

  function renderThread(id) {
    const thread = threads[id];
    document.querySelectorAll('.thread-item').forEach(el => el.classList.remove('active'));
    document.getElementById('item-' + id).classList.add('active');
    
    // Milestone View Layout
    content.innerHTML = `
      <div style="margin-bottom:30px; padding:20px; background:var(--panel2); border-radius:12px;">
        <h2 style="margin-top:0;">${thread.title}</h2>
        <p><strong>Context & Discussion Summary:</strong><br>${thread.summary || '<i>No summary available.</i>'}</p>
        <p><strong>Agent Actions:</strong><br>${thread.actions || '<i>No specific actions logged.</i>'}</p>
        <a href="thread.md" style="display:inline-block; margin-top:10px; padding:8px 16px; background:var(--accent); color:var(--bg); border-radius:6px; font-weight:600;">Open Full Raw Thread</a>
      </div>
      ${thread.html}
    `;
  }

  Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp).forEach(id => {
    const t = threads[id];
    const div = document.createElement('div');
    div.className = 'thread-item';
    div.id = 'item-' + id;
    div.innerHTML = `<div class="title">${t.title}</div><div class="meta">${t.date} · ${t.source}</div>`;
    div.onclick = () => renderThread(id);
    list.appendChild(div);
  });

  if (Object.keys(threads).length > 0) {
      renderThread(Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp)[0]);
  }
</script>
