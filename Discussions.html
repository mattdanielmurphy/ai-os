rative fairness and natural justice.\u201d\n\nLet me be clear: When I paid my deposit, I was fully aware of the official policy which states it is non-refundable. I have no basis to claim any unfairness on your end.\nHowever, I am still asking that you consider the unique circumstances that were out of my control which led to me having to back out of living at I-House.\n\nI am aware you are probably at peak business, so I will try to keep this brief, while also illustrating my decision process and the timeline of events.\n\n1. Signed up for housing and immediately paid the deposit; signed up for waiting list of I-House\n2. A spot for I-House opened and I was switched over\n3. By the end of July I am confused as to why my transcript has still not shown up on the Application Portal. I have asked U of A to look into it multiple times, and they tell me essentially there\u2019s nothing that can be done.\n4. On August 2 (I think?) I discover a bug with the BC Ministry of Education website that has resulted in my final transcript not being sent even though it\u2019s been ready for over a month at that point.\n5. On August 4 (I think), the BC Ministry of Education has corrected the issue.\n6. On August 6 (I think), MacEwan gives me an offer, with a deadline to accept and pay a $400 deposit by August 13\n7. At this point, my concerns about the delays reach an apex. I figure, if I U of A doesn\u2019t accept me, then I\u2019ll have nowhere to live in September, and so I must seek alternative housing arrangements. I have no idea whether U of A will accept me. Given my marks, I would safely assume so if not for the 1 month+ delay and the fact that it\u2019s already early-mid August. I basically decide: I can no longer bank on being able to live at I-House. Knowing the policy: deposits are non-refundable unless U of A issues an explicit denial, I decide to wait until a decision has been made instead of immediately cancelling my policy. The logic is: if I act now, I am guaranteed <script>
  const threads = JSON.parse(document.getElementById('threads-data').textContent);
  const list = document.getElementById('thread-list');
  const content = document.getElementById('thread-content');
  
  function openFinder(url) {
    // macOS file URL handler trick: use a hidden iframe to prevent browser navigation
    const iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);
    setTimeout(() => document.body.removeChild(iframe), 1000);
  }

  function renderThread(id) {
    const thread = threads[id];
    document.querySelectorAll('.thread-item').forEach(el => el.classList.remove('active'));
    document.getElementById('item-' + id).classList.add('active');
    
    // Milestone View Layout
    content.innerHTML = `
      <div style="margin-bottom:30px; padding:20px; background:var(--panel2); border-radius:12px;">
        <h2 style="margin-top:0;">${thread.title}</h2>
        <p><strong>Context & Discussion Summary:</strong><br>${thread.summary || '<i>No summary available.</i>'}</p>
        <p><strong>Agent Actions:</strong><br>${thread.actions || '<i>No specific actions logged.</i>'}</p>
        <a href="thread.md" style="display:inline-block; margin-top:10px; padding:8px 16px; background:var(--accent); color:var(--bg); border-radius:6px; font-weight:600;">Open Full Raw Thread</a>
      </div>
      ${thread.html}
    `;
  }

  Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp).forEach(id => {
    const t = threads[id];
    const div = document.createElement('div');
    div.className = 'thread-item';
    div.id = 'item-' + id;
    div.innerHTML = `<div class="title">${t.title}</div><div class="meta">${t.date} · ${t.source}</div>`;
    div.onclick = () => renderThread(id);
    list.appendChild(div);
  });

  if (Object.keys(threads).length > 0) {
      renderThread(Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp)[0]);
  }
</script>
</script>
