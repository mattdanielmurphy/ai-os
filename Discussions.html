on, but standard cell phone up to $75/mo is permitted without extra receipts)*.\n3. **Brief Statement of Context / Letter of Explanation:**\n   * A concise 1-page note uploaded alongside the lease stating that you are an independent mature student who had to secure immediate off-campus market housing in Edmonton due to late admissions finalization, and that your actual shelter commitment is $1,500/month.\n\n---\n\n### Important Timing & Details\n* **Processing Time:** Review processing takes **15 to 30 days**.\n* **Disbursement:** Once approved, Alberta Student Aid issues an **Amended Notice of Assessment (NOA)** and automatically direct-deposits the retroactive adjustment to your verified bank account.\n* **Deadline:** The request must be received at least **30 calendar days** prior to the end of your study period (submitting as soon as you have your executed lease is ideal).\n\n---\n*Reference:* [thread.md](file:///Users/matt/.gemini/antigravity/brain/e716e5fa-b538-4a95-b3f9-32ac8a8c46b8/thread.md)", "agent_time": "4:29am", "date_iso": "2026-08-28"}, {"user": "oh, here's the thing too...\n1. my application is still currently under review for some reason... maybe because I've uploaded disability documentation recently\n2. I believe when I filled this out I thought I was living on campus. It's actually very similar rent though. But anyway, I figure I should do this. On the screen saying I can't request for reconsideration because the app is still under review, it says to just upload e-docs. So I'm going to select Change to Monthly Cost, because even though it's similar, I believe the costs ARE different.\n\nSo...\nthe question is: what do I put in the comments for that document?\nI figure I should maybe explain briefly that I had to back out of I-House because of the transcript delay and that my rent is $1500 not including internet. Although I suppose you only get what you show receipts for, so just say $1500 incl utils.", "time": "", "agent": "Here is clean, profes <script>
  const threads = JSON.parse(document.getElementById('threads-data').textContent);
  const list = document.getElementById('thread-list');
  const content = document.getElementById('thread-content');
  
  function openFinder(url) {
    // macOS file URL handler trick: use a hidden iframe to prevent browser navigation
    const iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);
    setTimeout(() => document.body.removeChild(iframe), 1000);
  }

  function renderThread(id) {
    const thread = threads[id];
    document.querySelectorAll('.thread-item').forEach(el => el.classList.remove('active'));
    document.getElementById('item-' + id).classList.add('active');
    
    // Milestone View Layout
    content.innerHTML = `
      <div style="margin-bottom:30px; padding:20px; background:var(--panel2); border-radius:12px;">
        <h2 style="margin-top:0;">${thread.title}</h2>
        <p><strong>Context & Discussion Summary:</strong><br>${thread.summary || '<i>No summary available.</i>'}</p>
        <p><strong>Agent Actions:</strong><br>${thread.actions || '<i>No specific actions logged.</i>'}</p>
        <a href="thread.md" style="display:inline-block; margin-top:10px; padding:8px 16px; background:var(--accent); color:var(--bg); border-radius:6px; font-weight:600;">Open Full Raw Thread</a>
      </div>
      ${thread.html}
    `;
  }

  Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp).forEach(id => {
    const t = threads[id];
    const div = document.createElement('div');
    div.className = 'thread-item';
    div.id = 'item-' + id;
    div.innerHTML = `<div class="title">${t.title}</div><div class="meta">${t.date} · ${t.source}</div>`;
    div.onclick = () => renderThread(id);
    list.appendChild(div);
  });

  if (Object.keys(threads).length > 0) {
      renderThread(Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp)[0]);
  }
</script>
