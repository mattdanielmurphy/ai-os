ions: 1.5\u00d7 time in a reduced-distraction room; auditory/captioning accommodations).\n> 2. Discuss the CSG-DSE (Canada Student Grant for Services and Equipment) application with an accessibility advisor.\n> \n> Could you please assist in provisioning my portal access or provide the initial intake forms/steps so we can schedule an intake appointment?\n> \n> Thank you,  \n> **[Your Full Name]**  \n> CCID: `[Your CCID]` | Student ID: `[Your Student ID]`\n\n---\n\n### 2. Alberta Student Aid: Schedule 4 & Physician Receipt\n\nUploading a fresh copy of the **Schedule 4** along with the **physician's fee receipt** to your [Alberta Student Aid Portal](https://sfs.studentaid.alberta.ca/SFS2R2.Web.UI.Learner/) is the right move. \n\nHere is what you need to keep in mind:\n\n1. **How to verify if Schedule 4 is already approved:**\n   - Log into your portal and open your **Notice of Assessment (NOA)**.\n   - Look under the **Grants** section: if you see the **Canada Student Grant for Students with Disabilities ($2,800)**, your permanent disability status is already active on file!\n   - If it is not listed on the NOA, the uploaded copy will prompt them to adjust your assessment.\n\n2. **Doctor\u2019s Fee Reimbursement:**\n   - Alberta Student Aid reimburses out-of-pocket physician fees paid for completing disability verification forms. \n   - Since you uploaded the paid receipt/invoice under e-Documents, it will be reviewed and disbursed directly to your linked bank account.\n\n3. **Check the 40% Reduced Course Load:**\n   - As long as Schedule 4 is on file, your 2-course enrollment (6 credits / 40% load) will be treated and funded as **100% Full-Time**.\n\n---\n\n\ud83d\udcc4 Reference: [thread.md](file:///Users/matt/.gemini/antigravity/brain/b8b5a248-8df6-4705-bca8-46c9a3614d25/thread.md)", "agent_time": "7:22pm", "date_iso": "2026-08-15"}, {"user": "> How to verify if Schedule 4 is already approved:\n>\n> \ud83d\udcac **Comment**: I know it's not been approved yet. (writ <script>
  const threads = JSON.parse(document.getElementById('threads-data').textContent);
  const list = document.getElementById('thread-list');
  const content = document.getElementById('thread-content');
  
  function openFinder(url) {
    // macOS file URL handler trick: use a hidden iframe to prevent browser navigation
    const iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);
    setTimeout(() => document.body.removeChild(iframe), 1000);
  }

  function renderThread(id) {
    const thread = threads[id];
    document.querySelectorAll('.thread-item').forEach(el => el.classList.remove('active'));
    document.getElementById('item-' + id).classList.add('active');
    
    // Milestone View Layout
    content.innerHTML = `
      <div style="margin-bottom:30px; padding:20px; background:var(--panel2); border-radius:12px;">
        <h2 style="margin-top:0;">${thread.title}</h2>
        <p><strong>Context & Discussion Summary:</strong><br>${thread.summary || '<i>No summary available.</i>'}</p>
        <p><strong>Agent Actions:</strong><br>${thread.actions || '<i>No specific actions logged.</i>'}</p>
        <a href="thread.md" style="display:inline-block; margin-top:10px; padding:8px 16px; background:var(--accent); color:var(--bg); border-radius:6px; font-weight:600;">Open Full Raw Thread</a>
      </div>
      ${thread.html}
    `;
  }

  Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp).forEach(id => {
    const t = threads[id];
    const div = document.createElement('div');
    div.className = 'thread-item';
    div.id = 'item-' + id;
    div.innerHTML = `<div class="title">${t.title}</div><div class="meta">${t.date} · ${t.source}</div>`;
    div.onclick = () => renderThread(id);
    list.appendChild(div);
  });

  if (Object.keys(threads).length > 0) {
      renderThread(Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp)[0]);
  }
</script>
</script>
