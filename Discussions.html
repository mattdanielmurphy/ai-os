{"83452085-f2a9-4fd2-8125-c3fef5b8a1d3": {"title": "Conversation 83452085", "exchanges": [{"user": "I want to get better at singing.\nI need a github project that will replicate Rock Band style live pitch detection feedback and an accuracy score for each song. Must be able to use basically any song in the world.", "time": "", "agent": "I've initiated the pre-flight check and am waiting for the system status to return before analyzing the best GitHub open-source options for Rock Band-style live pitch detection and scoring.\n\nTo get real-time **Rock Band**-style vocal feedback (scrolling pitch highway, live pitch indicator showing whether you are sharp/flat, and an accuracy score) with the requirement to support **basically any song in the world**, there is an established open-source ecosystem that handles both sides of the challenge:\n\n---\n\n### The Two Halves of the Problem\n\n1. **The Game & Feedback Engine:** Needs real-time mic capture, low-latency pitch detection (e.g. YIN/CREPE algorithms), octave-independent pitch matching, and visual highway scoring.\n2. **The \"Any Song in the World\" Pipeline:** In commercial games like Rock Band or SingStar, humans painstakingly author the vocal note tracks. For *any* song, modern AI pipelines extract vocals (Demucs), detect lyrics & timestamps (Whisper), and extract note pitches (SPICE / torchcrepe) automatically into standard game format files.\n\n---\n\n### 1. Ready-to-Play Open Source Engines (The Game)\n\n* **[UltraStar Play](https://github.com/UltraStar-Deluxe/Play)** (Unity, Cross-Platform macOS / Windows / Linux)\n  * **Why it fits:** The modern, polished rewrite of UltraStar Deluxe. Provides the exact SingStar / Rock Band style horizontal pitch highway, visual sharp/flat feedback, syllable alignment, and real-time accuracy scoring.\n  * **Mic input:** Works directly with USB microphones, audio interfaces, or even a smartphone companion app.\n  * **Format:** Uses the universal `.txt` karaoke track format (specifying timing, pitch/note, and syllable for each phrase).\n\n* **[UltraStar Deluxe (USDX)](https://github.com/UltraStar-Deluxe/USDX)**\n  * The classic open-source singing engine with over 15 years of community song libraries (tens of thousands of pre-made community charts available online).\n\n---\n\n### 2. The \"Any Song in the World\" AI Generators (The Pipeline)\n\nTo take any arbitrary MP3, YouTube URL, or audio file and turn it into a playable pitch highway in seconds:\n\n* **[UltraSinger](https://github.com/rakuri255/UltraSinger)** \u2b50 *(Recommended)*\n  * **Pipeline:** Takes any raw audio file $\\rightarrow$ runs **Demucs** to isolate the lead vocal $\\rightarrow$ runs **Whisper** for word/syllable timing $\\rightarrow$ runs **CREPE / Pyin** for pitch extraction $\\rightarrow$ quantizes notes to key $\\rightarrow$ exports directly to UltraStar song files with audio & background video.\n  * Can be run via a simple CLI command:\n    ```bash\n    ultrasinger -i \"song.mp3\"\n    ```\n* **[Ultrasongs](https://github.com/pablopramparo/ultrasongs)**\n  * A modern web/desktop GUI that combines Demucs, `torchcrepe`, and `faster-whisper` with a built-in interactive timeline editor so you can visually verify and tweak notes before singing.\n\n---\n\n### 3. Web-First Alternative (If you want a lightweight browser app)\n\nIf you'd prefer a self-contained browser app (or want to build/host one locally):\n* Use **Web Audio API** (`AudioWorklet`) paired with **[pitchfinder](https://github.com/peterkhayes/pitchfinder)** (YIN algorithm) or TensorFlow.js **SPICE** for zero-latency in-browser vocal pitch tracking.\n* Convert frequency ($Hz$) to musical pitch with the standard equation:\n  $$\\text{MIDI Note} = 69 + 12 \\log_2\\left(\\frac{f}{440}\\right)$$\n* Render the pitch highway on an HTML5 `<canvas>` comparing your live note against an UltraStar `.txt` or MIDI track.\n\n---\n\n### Recommended Quick Start\nThe fastest path to practicing immediately:\n1. Install **[UltraStar Play](https://github.com/UltraStar-Deluxe/Play)** for the gameplay and live feedback UI.\n2. Run **[UltraSinger](https://github.com/rakuri255/UltraSinger)** against whatever songs you want to practice to auto-generate the pitch highways.", "agent_time": "1:42am", "date_iso": "2026-10-14"}, {"user": "apple music integration somehow would be nice too.\nI guess I'm willing to use a paid app too, but ideally non-subscription.\nBut if it's subscription too, let me know.\n\nOf the options you listed above, how good are they? How fussy? Like, honeslty, even just having to download teh audio is too fussy for me lmao so that probably rules out most of those I'd imagine?", "time": "", "agent": "### The Honest Reality on \"Fussiness\"\n\n**Yes, the open-source pipeline (UltraStar + UltraSinger) is definitely fussy.** \n* You have to find or rip an MP3/video file.\n* You run terminal commands to separate stems, extract pitches, and generate the files.\n* AI vocal-pitch extraction is ~85\u201390% accurate; on rapid runs, vocal glides, or quiet phrases, it makes mistakes that you end up having to tweak manually in an editor.\nIf downloading audio is already a dealbreaker, **do not go down the open-source DIY rabbit hole**\u2014you'll spend more time fighting Python dependencies than actually singing.\n\n---\n\n### The Apple Music Problem\n\n**Apple Music Sing** has the ultimate frictionless experience: you tap any song, slide down the artist's vocals, and follow the beat-by-beat bouncing lyrics. \n\n**However, Apple Music does NOT have pitch scoring or a pitch highway.**\nBecause of FairPlay DRM, third-party apps **cannot inspect or tap the decoded audio stream** to calculate pitch tracks on the fly. No third-party app can take an Apple Music streaming link and auto-score it.\n\n---\n\n### Best Options Ranked by \"Zero Friction\"\n\n#### 1. Yousician (The Closest to Rock Band, but Subscription)\n* **How it works:** Literally *Guitar Hero / Rock Band* for singing on your iPhone, iPad, or Mac. It shows a rolling pitch highway, tracks your mic input in real time, shows if you are sharp or flat, and awards stars/scores (0\u2013100%).\n* **Song Library:** Thousands of commercial pop/rock songs with professionally charted pitch lines (no AI guessing errors).\n* **Friction level:** **Zero.** Search the song, press play, sing into your iPhone or laptop mic.\n* **Catch:** It does **not** have *literally every song* (only licensed tracks), and it's a subscription (~$10\u2013$15/mo).\n\n#### 2. The Apple Music Sing + Live Pitch Monitor Combo (Zero Subscription)\nIf you want to use **literally any song in Apple Music** without downloading files:\n* **Step 1:** Play any song on **Apple Music** with **Apple Music Sing** turned on (vocals lowered, real-time lyrics bouncing).\n* **Step 2:** Open a visual vocal monitor next to it, like **[SingScope](https://apps.apple.com/app/singscope/id974676579)** (free / cheap one-time unlock on iOS) or **[Nail the Pitch](https://apps.apple.com/app/nail-the-pitch-vocal-monitor/id1388049182)**.\n* **How it helps you improve:** As you sing along to Apple Music, the pitch monitor shows a real-time oscilloscope/note line of your voice against the musical staff ($C3, D3, E3\\dots$). You can instantly see when you drift flat, when you overshoot high, or how steady your sustained notes are.\n* **Trade-off:** You see your exact pitch live, but you don't get an automatic percentage score at the end.\n\n#### 3. Smule / StarMaker (Casual Karaoke Apps)\n* **Friction:** Low (massive cloud catalog, tap and sing).\n* **Pitch feedback:** Very basic guide bars with a loose score at the end, but it leans heavily towards social karaoke and auto-tune/reverb effects rather than strict pitch-training feedback. Mostly freemium/subscription-heavy.\n\n---\n\n### Recommendation\n\n* If you want a **true Rock Band game experience** with automated scoring and zero file setup: Try the **Yousician** free trial first to see if their catalog covers what you like to sing.\n* If you want to **use your actual Apple Music library on any song**: Use **Apple Music Sing** with the vocal slider lowered, and prop up **SingScope** or **Nail the Pitch** on your phone/iPad as a live visual pitch mirror. It gives you immediate intonation feedback on any song without having to download a single file.", "agent_time": "1:44am", "date_iso": "2026-10-14"}, {"user": "you know what would be nice... is if I could start on \"Easy\" with large tolerances for pitch, and then move up to Hard eventually which is stricter.\nWith SingScope, the idea is just: I probably can figure out the right note they're singing, and I'll use the scope to make sure I'm on pitch, but I have to rely on my ear, and there's no stats.", "time": "", "agent": "That exact insight hits the nail on the head: **SingScope only gives you a raw mirror, not a target.** Without a reference pitch line, you still have to guess if you're singing the right note, and there\u2019s no feedback loop or scoring to tell you if you're improving.\n\nWhat you're describing\u2014**configurable pitch tolerances (cents threshold) with Easy $\\rightarrow$ Hard difficulty modes and objective accuracy stats**\u2014is exactly how rhythm games score vocals.\n\nHere is the practical breakdown of your best options:\n\n---\n\n### Option 1. Singing Carrots (Web / Mobile \u2013 Browser-based)\nIf you want something you can open right in your browser or phone with **zero file downloading**:\n* **How it handles pitch tolerance:** It is built explicitly around **cents-level deviation** (e.g. within $\\pm 50$ cents vs $\\pm 15$ cents).\n* **The Training Mode:** You pick pitch-accuracy drills, interval games, or songs. In beginner mode, it allows a wider window of error; as you level up, it shrinks the tolerance window down to strict concert pitch.\n* **The Feedback:** Shows target pitch bars, live tracking, and gives detailed accuracy stats (% on pitch, cents flat/sharp average, and stability/vibrato).\n* **Friction:** Low (web-based, cloud library).\n\n---\n\n### Option 2. Yousician (The True Rock Band \"Easy $\\rightarrow$ Hard\" Experience)\n* **How it handles difficulty:** Yousician literally structures songs into progressive tiers (Level 1, 2, 3...):\n  * **Beginner:** Tolerates wider timing windows and chromatic deviation; target lines are longer and less rapid.\n  * **Advanced:** Very tight pitch gating\u2014if you scoop into a note or wobble off-center, you miss the multiplier/star.\n* **Stats:** Provides percentage accuracy scores (e.g. 94%), star ratings, and streak counters after every take.\n* **Friction:** Near zero (app store download, press play).\n\n---\n\n### Option 3. A Simple Custom Local Web App (Tailored to You)\nIf you want a lightweight tool built specifically around your workflow:\n* We can build a fast, single-page local web app (`bun run dev`) using the **Web Audio API** and `pitchfinder`.\n* **How it works:**\n  1. You pick an audio file or play your song in the background.\n  2. You select a target scale, melody guide, or drop in a basic MIDI/chart.\n  3. **Difficulty Slider / Presets:**\n     * **Easy:** $\\pm 50$ cents (forgiving half-step window; lets you build confidence hitting the ballpark).\n     * **Medium:** $\\pm 25$ cents (demands decent ear/intonation).\n     * **Hard:** $\\pm 10$ cents (professional studio intonation).\n  4. Real-time canvas highway with an end-of-run accuracy score (`% on-pitch`, average cent offset, and sharp/flat bias).\n\n---\n\n### Summary Recommendation\n1. Check out **Singing Carrots** or the free tier of **Yousician** first\u2014they both implement the exact progressive tolerance/scoring mechanics you're looking for without you having to build anything.\n2. If those feel too restrictive or you'd prefer an owned, zero-subscription local tool with custom tolerance dials, we can spin up a dedicated web prototype in a local project folder.", "agent_time": "1:48pm", "date_iso": "2026-10-14"}]}}
</script>
<script>
  const threads = JSON.parse(document.getElementById('threads-data').textContent);
  const list = document.getElementById('thread-list');
  const content = document.getElementById('thread-content');
  
  function openFinder(url) {
    // macOS file URL handler trick: use a hidden iframe to prevent browser navigation
    const iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);
    setTimeout(() => document.body.removeChild(iframe), 1000);
  }

  function renderThread(id) {
    const thread = threads[id];
    document.querySelectorAll('.thread-item').forEach(el => el.classList.remove('active'));
    document.getElementById('item-' + id).classList.add('active');
    
    // Milestone View Layout
    content.innerHTML = `
      <div style="margin-bottom:30px; padding:20px; background:var(--panel2); border-radius:12px;">
        <h2 style="margin-top:0;">${thread.title}</h2>
        <p><strong>Context & Discussion Summary:</strong><br>${thread.summary || '<i>No summary available.</i>'}</p>
        <p><strong>Agent Actions:</strong><br>${thread.actions || '<i>No specific actions logged.</i>'}</p>
        <a href="thread.md" style="display:inline-block; margin-top:10px; padding:8px 16px; background:var(--accent); color:var(--bg); border-radius:6px; font-weight:600;">Open Full Raw Thread</a>
      </div>
      ${thread.html}
    `;
  }

  Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp).forEach(id => {
    const t = threads[id];
    const div = document.createElement('div');
    div.className = 'thread-item';
    div.id = 'item-' + id;
    div.innerHTML = `<div class="title">${t.title}</div><div class="meta">${t.date} · ${t.source}</div>`;
    div.onclick = () => renderThread(id);
    list.appendChild(div);
  });

  if (Object.keys(threads).length > 0) {
      renderThread(Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp)[0]);
  }
</script>
</script>
