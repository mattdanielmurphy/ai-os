g true 0-nit pixel-level shutoff with the XDR display's local dimming backlight bleed.\n\n---\n\n### 2. Current Machine & Core Requirements\n* **Thread: [Antigravity `251d1b9c`](file:///Users/matt/.gemini/antigravity/brain/251d1b9c-f64b-4b4f-9859-9712edbcfed9/transcript.jsonl) & [`e815fdca`](file:///Users/matt/.gemini/antigravity/brain/e815fdca-be86-568c-b695-8ee638f5b5f3/transcript.jsonl)**\n  * **Current Rig**: 16-inch MacBook Pro, **M2 Pro, 16GB Unified RAM** (bought Aug 19, 2024).\n  * **The Real Bottleneck**: The **16GB RAM limit** (\"the RAM crisis\"). While CPU utilization is rarely an issue, heavy multitasking across Antigravity, Chrome Canary, Godot, Ableton/Logic, and background local AI models causes severe memory pressure and swap.\n  * **Target Spec Floor**: Moving to at least **36GB or 48GB Unified Memory** is your mandatory jump for meaningful day-to-day improvement.\n\n---\n\n### 3. Purchase Strategies Discussed\n* **Grant Funding / Co-Pay Stacking**: In thread `251d1b9c`, we mapped out using your Alberta Student Aid Schedule 4 / ARDS equipment allocations (~$2,500\u2013$3,500 CAD) as a base, combined with non-repayable cash grants (CSGD / GFD) to top-up and cover a high-RAM configuration without paying entirely out-of-pocket.\n* **Apple Certified Refurbished vs. Education Pricing**: Stacking education pricing or targeting official Apple Refurbished units to get a 36GB/48GB M-series Pro/Max machine around ~$3,100\u2013$3,600 CAD.\n\n---\n\n### Next Step\nWhen you're ready, we can compare the practical options for your 7\u201310 week timeframe:\n1. **Hold out for OLED (M6)** vs. **Upgrading now to 36GB/48GB M-series Pro/Max**.\n2. Form factors (sticking with **16\"** vs. dropping to **14\"** for portability/thermals).\n3. Budget allocations and refurbished options available right now in Canada.", "agent_time": "2:32am", "date_iso": "2026-10-15"}]}}

<script>
  const threads = JSON.parse(document.getElementById('threads-data').textContent);
  const list = document.getElementById('thread-list');
  const content = document.getElementById('thread-content');
  
  function openFinder(url) {
    // macOS file URL handler trick: use a hidden iframe to prevent browser navigation
    const iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);
    setTimeout(() => document.body.removeChild(iframe), 1000);
  }

  function renderThread(id) {
    const thread = threads[id];
    document.querySelectorAll('.thread-item').forEach(el => el.classList.remove('active'));
    document.getElementById('item-' + id).classList.add('active');
    
    // Milestone View Layout
    content.innerHTML = `
      <div style="margin-bottom:30px; padding:20px; background:var(--panel2); border-radius:12px;">
        <h2 style="margin-top:0;">${thread.title}</h2>
        <p><strong>Context & Discussion Summary:</strong><br>${thread.summary || '<i>No summary available.</i>'}</p>
        <p><strong>Agent Actions:</strong><br>${thread.actions || '<i>No specific actions logged.</i>'}</p>
        <a href="thread.md" style="display:inline-block; margin-top:10px; padding:8px 16px; background:var(--accent); color:var(--bg); border-radius:6px; font-weight:600;">Open Full Raw Thread</a>
      </div>
      ${thread.html}
    `;
  }

  Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp).forEach(id => {
    const t = threads[id];
    const div = document.createElement('div');
    div.className = 'thread-item';
    div.id = 'item-' + id;
    div.innerHTML = `<div class="title">${t.title}</div><div class="meta">${t.date} · ${t.source}</div>`;
    div.onclick = () => renderThread(id);
    list.appendChild(div);
  });

  if (Object.keys(threads).length > 0) {
      renderThread(Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp)[0]);
  }
</script>
