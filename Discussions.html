hrough is available in [walkthrough.md](file:///Users/matt/.gemini/antigravity/brain/d72fd45c-471b-490e-8df2-235ad89cc829/walkthrough.md), and the complete session history can be referenced in [thread.md](file:///Users/matt/.gemini/antigravity/brain/d72fd45c-471b-490e-8df2-235ad89cc829/thread.md).", "agent_time": "10:02pm", "date_iso": "2026-09-20"}, {"user": "One more thing; I was getting a server error when I reload the page on the crossword app or when I click on a past puzzle link.\nAnd now, I'm getting a server error when I load the site, full stop.", "time": "", "agent": "", "agent_time": "10:06pm", "date_iso": "2026-09-20"}, {"user": "o: remaining connection slots are reserved for non-replication superuser connections\n    at es (.next/server/chunks/src_lib_db_client_ts_0ziljnh._.js:4:2292)\n    at <unknown> (.next/server/chunks/src_lib_db_client_ts_0ziljnh._.js:4:3216)\n    at Socket.eD (.next/server/chunks/src_lib_db_client_ts_0ziljnh._.js:4:3220) {\n  severity_local: 'FATAL',\n  severity: 'FATAL',\n  code: '53300',\n  file: 'postinit.c',\n  line: '826',\n  routine: 'InitPostgres'\n}", "time": "", "agent": "### Root Cause & Resolution\n\nThe server error you encountered:\n```\nPostgresError: remaining connection slots are reserved for non-replication superuser connections (code: 53300)\n```\n\n#### What Happened\n1. **Connection Pool Leaks on Next.js HMR**:\n   - In [`src/lib/db/client.ts`](file:///Users/matt/projects/daily-mini-crossword/src/lib/db/client.ts), Drizzle and the `postgres.js` client were instantiating multiple connection pools on development restarts and across concurrent worker routes.\n   - 97 idle Postgres connections accumulated on the database host against the 100 max connection ceiling, exhausting the pool and causing PostgreSQL to reject any further client connections with error code `53300`.\n2. **Guest / Anonymous Route Handling**:\n   - When playing at `/` (or clicking past puzzle links before claiming a profile), requests were sent using the `\"guest\"` slug.\n   - Several API endpoints ([`/api/profiles/[slug]/puzzles`](file:///Users/matt/projects/daily-mini-crossword/src/app/api/profiles/[slug]/puzzles/route.ts), [`complete`](file:///Users/matt/projects/daily-mini-crossword/src/app/api/profiles/[slug]/puzzles/[date]/complete/route.ts), [`hint`](file:///Users/matt/projects/daily-mini-crossword/src/app/api/profiles/[slug]/puzzles/[date]/hint/route.ts), and the date route) expected a persisted profile in the database, causing 404s/500s when handling anonymous solvers.\n\n---\n\n### What Was Fixed\n\n1. **VPS Connection Cleanup**:\n   - Connected to the VPS host and terminated all leaked idle backend connections for `daily_mini_crossword`. Active connection count was brought back down to normal levels.\n\n2. **Drizzle & Postgres Singleton Caching** ([`src/lib/db/client.ts`](file:///Users/matt/projects/daily-mini-crossword/src/lib/db/client.ts)):\n   - Cached both `global._drizzleDb` and `global._postgresClient` on `globalThis`.\n   - Reduced `max` pool size to conservative limits (3 connections in dev, 5 in prod), reduced `idle_timeout` to 10s, and enabled `max_lifetime` connection recycling.\n\n3. **Full Guest Solver & Past Puzzle Route Support**:\n   - **[`/api/profiles/[slug]/puzzles`](file:///Users/matt/projects/daily-mini-crossword/src/app/api/profiles/[slug]/puzzles/route.ts)**: When `slug` is `guest` or anonymous, it returns all published past puzzles without failing or querying missing profiles.\n   - **[`/api/profiles/[slug]/puzzles/[date]`](file:///Users/matt/projects/daily-mini-crossword/src/app/api/profiles/[slug]/puzzles/[date]/route.ts)**: Serves public puzzle data with default initial progress for guest solvers.\n   - **[`complete`](file:///Users/matt/projects/daily-mini-crossword/src/app/api/profiles/[slug]/puzzles/[date]/complete/route.ts) & [`hint`](file:///Users/matt/projects/daily-mini-crossword/src/app/api/profiles/[slug]/puzzles/[date]/hint/route.ts)**: Validates puzzle solutions and reveals hints server-authoritatively for guests without throwing profile errors.\n   - **[`useProgressSync.ts`](file:///Users/matt/projects/daily-mini-crossword/src/hooks/useProgressSync.ts)**: Skips sending draft PUT requests for guest sessions (local progress remains saved in `localStorage`).\n   - **[`src/app/p/[slug]/page.tsx`](file:///Users/matt/projects/daily-mini-crossword/src/app/p/[slug]/page.tsx)**: Automatically redirects `/p/guest` or `/p/anonymous` requests directly to `/?d=...`.\n\n4. **Verification**:\n   - Production build (`bun run build`) passed with 0 errors.\n   - Full test suite (`bun test`) passed 18/18 tests.\n   - Changes committed and pushed to `main` (`b8208abb`).\n\nYou can inspect the conversation record in [thread.md](file:///Users/matt/.gemini/antigravity/brain/d72fd45c-471b-490e-8df2-235ad89cc829/thread.md). Refresh your app now and it will load smoothly without errors.", "agent_time": "10:06pm", "date_iso": "2026-09-20"}]}}

<script>
  const threads = JSON.parse(document.getElementById('threads-data').textContent);
  const list = document.getElementById('thread-list');
  const content = document.getElementById('thread-content');
  
  function openFinder(url) {
    // macOS file URL handler trick: use a hidden iframe to prevent browser navigation
    const iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);
    setTimeout(() => document.body.removeChild(iframe), 1000);
  }

  function renderThread(id) {
    const thread = threads[id];
    document.querySelectorAll('.thread-item').forEach(el => el.classList.remove('active'));
    document.getElementById('item-' + id).classList.add('active');
    
    // Milestone View Layout
    content.innerHTML = `
      <div style="margin-bottom:30px; padding:20px; background:var(--panel2); border-radius:12px;">
        <h2 style="margin-top:0;">${thread.title}</h2>
        <p><strong>Context & Discussion Summary:</strong><br>${thread.summary || '<i>No summary available.</i>'}</p>
        <p><strong>Agent Actions:</strong><br>${thread.actions || '<i>No specific actions logged.</i>'}</p>
        <a href="thread.md" style="display:inline-block; margin-top:10px; padding:8px 16px; background:var(--accent); color:var(--bg); border-radius:6px; font-weight:600;">Open Full Raw Thread</a>
      </div>
      ${thread.html}
    `;
  }

  Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp).forEach(id => {
    const t = threads[id];
    const div = document.createElement('div');
    div.className = 'thread-item';
    div.id = 'item-' + id;
    div.innerHTML = `<div class="title">${t.title}</div><div class="meta">${t.date} · ${t.source}</div>`;
    div.onclick = () => renderThread(id);
    list.appendChild(div);
  });

  if (Object.keys(threads).length > 0) {
      renderThread(Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp)[0]);
  }
</script>
</script>
