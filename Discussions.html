ix\n\nEvery rule currently in [`~/.codex/AGENTS.md`](file:///Users/matt/.codex/AGENTS.md) and [`/Users/matt/projects/ai-os/.rules/`](file:///Users/matt/projects/ai-os/.rules/) is mapped to its optimal enforcement tier:\n\n| # | Rule / Directive | Source File | New Destination | Enforcement Mechanism |\n|---|------------------|-------------|-----------------|-----------------------|\n| 1 | **Identity Baseline** (Name, email, OS, shell) | `core_safety.md` | Minimal Global `AGENTS.md` | Static (Prompt: ~15 lines) |\n| 2 | **Path Migration** (`matthewmurphy` -> `matt`) | `core_safety.md` | Minimal Global `AGENTS.md` | Static (Prompt: 2 lines) |\n| 3 | **Trash Protocol** (NEVER `rm`, ALWAYS `mv ... ~/.Trash/`) | `core_safety.md` | Hard Gate (`PreToolUse`) + Minimal | **Deterministic Block** (Rejects `rm`/`rmdir`) |\n| 4 | **Tooling Policy** (ALWAYS `bun`, NEVER `npm`/`pnpm`) | `core_safety.md` | Hard Gate (`PreToolUse`) + Dynamic | **Deterministic Block** (Rejects `npm`/`pnpm`/`yarn`) |\n| 5 | **No Git Repo in `~`** | `core_safety.md` | Hard Gate (`PreToolUse`) | **Deterministic Block** (Rejects `git init ~`) |\n| 6 | **Secret Isolation** (Never read `.env` / raw keys) | `core_safety.md` | Hard Gate (`PreToolUse`) + Dynamic | **Deterministic Block** (Rejects reads of `.env*`, `*credentials*`, `id_rsa`, `*.pem`) |\n| 7 | **Local Temp Directory** (Never `/tmp`, use `./tmp`) | `core_safety.md` | Hard Gate (`PreToolUse`) + Dynamic | **Deterministic Block** (Rejects output to system `/tmp/`) |\n| 8 | **Generic Container Guard** (No loose files in `~/projects`) | `core_safety.md` | Hard Gate (`PreToolUse`) + Dynamic | **Deterministic Block** (Rejects bare files created in `~/projects/`) |\n| 9 | **Personal Identifiers** (ASN, PEN, Student ID, CCID, DOB) | `core_safety.md` | Dynamic Pack: `policy_personal_ids.md` | Injected ONLY on form/application/resume tasks |\n| 10 | **Personal To-Dos & Apple Reminders** | `core_safety.md` | Dynamic Pack: `policy_reminders.md` | Injected ONLY when to-do/remind/calendar matches |\n| 11 | **Music Recommendations** (Apple Music links) | `core_safety.md` | Dynamic Pack: `policy_music.md` | Injected ONLY on music/track/album queries |\n| 12 | **Proactive System Directives** (`build_rules.py`) | `core_safety.md` | Dynamic Pack: `policy_rules_engine.md` | Injected when user mentions \"always do X\", \"from now on\" |\n| 13 | **Architectural Preservation & Span-Only Layouts** | `core_safety.md` | Dynamic Pack: `policy_frontend_layout.md` | Injected ONLY on UI, CSS, HTML, `thread.md` tasks |\n| 14 | **Shared VPS Database Guidance** | `core_safety.md` | Dynamic Pack: `policy_database.md` | Injected on DB / SQL / provisioning tasks |\n| 15 | **Model Family Naming Invariant** (No version guessing) | `core_safety.md` | Minimal Global `AGENTS.md` | Static (Prompt: 2 lines) |\n| 16 | **Search-to-Memory Invariant** | `core_safety.md` | Dynamic Pack: `policy_dev_workflow.md` | Injected on debugging / exploratory dev tasks |\n| 17 | **Custom Skills Naming (`_` prefix)** | `core_safety.md` | Dynamic Pack: `policy_skills_authoring.md` | Injected on skill/workflow authoring |\n| 18 | **Git Auto-Commit & Tracking Protocol** | `git_protocol.md` | Dynamic Pack: `policy_git.md` | Injected on dev tasks inside git repositories |\n| 19 | **Agent Logs & Journal Protocol** | `agent_logs.md` | Dynamic Pack: `policy_dev_workflow.md` | Injected on dev tasks concluding in repo |\n| 20 | **ChatGPT vs `agy` macOS Delegation Protocol** | `codex_only.md` | Minimal Global `AGENTS.md` + Dynamic | High-level split static; thin handoff injected on complex tasks |\n| 21 | **Durable Historical Memories** | Mem0 SQLite/Qdrant | Dynamic Mem0 Semantic Recall | Hydrated JIT into `additionalContext` conditionally |\n\n---\n\n## 3. Hook Event Specifications & Wire Decisions\n\nThe Codex CLI / app-server binary (`/Applications/ChatGPT.app/Contents/Resources/codex`) natively implements the internal hook runner with standard JSON schema interfaces.\n\n### A. `UserPromptSubmit` (Dynamic Context Injection)\n- **Input JSON** received via `stdin`:\n  ```json\n  {\n    \"hook_event_name\": \"UserPromptSubmit\",\n    \"prompt\": \"<raw user prompt>\",\n    \"cwd\": \"/Users/matt/Documents/Codex/2026-09-25/pickleball\",\n    \"model\": \"gpt-5-codex\",\n    \"session_id\": \"sess-xyz\",\n    \"turn_id\": \"turn-1\",\n    \"permission_mode\": \"default\",\n    \"transcript_path\": null\n  }\n  ```\n- **Output JSON** emitted to `stdout`:\n  - *Casual/Ephemeral Query*:\n    ```json\n    {\n      \"continue\": true,\n      \"hookSpecificOutput\": {\n        \"hookEventName\": \"UserPromptSubmit\",\n        \"additionalContext\": null\n      }\n    }\n    ```\n  - *Substantive / Project Query*:\n    ```json\n    {\n      \"continue\": true,\n      \"hookSpecificOutput\": {\n        \"hookEventName\": \"UserPromptSubmit\",\n        \"additionalContext\": \"=== ACTIVE AI-OS POLICIES ===\\n[policy_git]\\n- Use bun, auto-commit with ai-os\\n\\n=== RECALLED MEMORIES (Mem0) ===\\n- User prefers bun over npm (score: 0.88)\"\n      }\n    }\n    ```\n\n### B. `PreToolUse` (Deterministic Hard Security Guard)\n- **Input JSON** received via `stdin`:\n  ```json\n  {\n    \"hook_event_name\": \"PreToolUse\",\n    \"tool_name\": \"execute_command\",\n    \"tool_input\": { \"command\": \"rm -rf ./tmp\" },\n    \"tool_use_id\": \"tool-call-abc\",\n    \"cwd\": \"/Users/matt/projects/ai-os\",\n    \"session_id\": \"sess-xyz\",\n    \"turn_id\": \"turn-2\",\n    \"permission_mode\": \"default\"\n  }\n  ```\n- **Output JSON** emitted to `stdout`:\n  - *Allow*:\n    ```json\n    {\n      \"continue\": true,\n      \"decision\": \"approve\",\n      \"hookSpecificOutput\": {\n        \"hookEventName\": \"PreToolUse\",\n        \"permissionDecision\": \"allow\"\n      }\n    }\n    ```\n  - *Block (Hard Violation)*:\n    ```json\n    {\n      \"continue\": false,\n      \"decision\": \"block\",\n      \"reason\": \"AI-OS Safety Gate Violation: 'rm' <script>
  const threads = JSON.parse(document.getElementById('threads-data').textContent);
  const list = document.getElementById('thread-list');
  const content = document.getElementById('thread-content');
  
  function openFinder(url) {
    // macOS file URL handler trick: use a hidden iframe to prevent browser navigation
    const iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);
    setTimeout(() => document.body.removeChild(iframe), 1000);
  }

  function renderThread(id) {
    const thread = threads[id];
    document.querySelectorAll('.thread-item').forEach(el => el.classList.remove('active'));
    document.getElementById('item-' + id).classList.add('active');
    
    // Milestone View Layout
    content.innerHTML = `
      <div style="margin-bottom:30px; padding:20px; background:var(--panel2); border-radius:12px;">
        <h2 style="margin-top:0;">${thread.title}</h2>
        <p><strong>Context & Discussion Summary:</strong><br>${thread.summary || '<i>No summary available.</i>'}</p>
        <p><strong>Agent Actions:</strong><br>${thread.actions || '<i>No specific actions logged.</i>'}</p>
        <a href="thread.md" style="display:inline-block; margin-top:10px; padding:8px 16px; background:var(--accent); color:var(--bg); border-radius:6px; font-weight:600;">Open Full Raw Thread</a>
      </div>
      ${thread.html}
    `;
  }

  Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp).forEach(id => {
    const t = threads[id];
    const div = document.createElement('div');
    div.className = 'thread-item';
    div.id = 'item-' + id;
    div.innerHTML = `<div class="title">${t.title}</div><div class="meta">${t.date} · ${t.source}</div>`;
    div.onclick = () => renderThread(id);
    list.appendChild(div);
  });

  if (Object.keys(threads).length > 0) {
      renderThread(Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp)[0]);
  }
</script>
