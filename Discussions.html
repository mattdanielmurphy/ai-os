ell.tsx))**:\n   - Stripped out individual `<input>` elements and touch-blocking pointerdown handlers.\n   - Converted cells to display `<div>` elements with standard accessibility semantics (`role=\"gridcell\"`, `aria-selected`, `aria-label`).\n   - Enforced inline WebKit selection suppression (`WebkitTouchCallout: \"none\"`, `WebkitUserSelect: \"none\"`, `userSelect: \"none\"`) and `touch-manipulation` directly on cell containers and letter display spans.\n   - Tapping any square now calls `onSelect()` directly: selecting an inactive square moves the caret/active ring there; tapping the selected square toggles Across/Down direction.\n\n2. **Single Proxy Keyboard Input ([`CrosswordGrid.tsx`](file:///Users/matt/projects/daily-mini-crossword/src/components/crossword/CrosswordGrid.tsx))**:\n   - Replaced per-cell inputs with a single proxy input (`width: 1px`, `height: 1px`, `opacity: 0.01`, `fontSize: 16px`, `caretColor: \"transparent\"`, `pointerEvents: \"none\"`).\n   - `fontSize: 16px` prevents iOS Safari from automatically zooming the page on focus.\n   - Tapping any cell synchronizes input focus within the user gesture, ensuring the mobile virtual keyboard opens and remains open across cell transitions.\n   - Included `activeEntryId` in focus synchronization dependencies so direction toggles also re-assert keyboard focus.\n   - Added an 80ms timestamp deduplication window (`lastHandledTimeRef`) between `beforeinput`, `input`, and `keydown` events to prevent duplicate character entry across varied mobile virtual keyboards.\n\n3. **Global Touch & Callout Suppression ([`globals.css`](file:///Users/matt/projects/daily-mini-crossword/src/app/globals.css))**:\n   - Added global rules ensuring `-webkit-touch-callout: none`, `-webkit-user-select: none`, and `touch-action: manipulation` are applied to `.select-none`, `[role=\"gridcell\"]`, and all button/input elements, eliminating 300ms tap delays and iOS double-tap zoom.\n\n4. **Clue Navigation & Shortcut Isolation ([` <script>
  const threads = JSON.parse(document.getElementById('threads-data').textContent);
  const list = document.getElementById('thread-list');
  const content = document.getElementById('thread-content');
  
  function openFinder(url) {
    // macOS file URL handler trick: use a hidden iframe to prevent browser navigation
    const iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);
    setTimeout(() => document.body.removeChild(iframe), 1000);
  }

  function renderThread(id) {
    const thread = threads[id];
    document.querySelectorAll('.thread-item').forEach(el => el.classList.remove('active'));
    document.getElementById('item-' + id).classList.add('active');
    
    // Milestone View Layout
    content.innerHTML = `
      <div style="margin-bottom:30px; padding:20px; background:var(--panel2); border-radius:12px;">
        <h2 style="margin-top:0;">${thread.title}</h2>
        <p><strong>Context & Discussion Summary:</strong><br>${thread.summary || '<i>No summary available.</i>'}</p>
        <p><strong>Agent Actions:</strong><br>${thread.actions || '<i>No specific actions logged.</i>'}</p>
        <a href="thread.md" style="display:inline-block; margin-top:10px; padding:8px 16px; background:var(--accent); color:var(--bg); border-radius:6px; font-weight:600;">Open Full Raw Thread</a>
      </div>
      ${thread.html}
    `;
  }

  Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp).forEach(id => {
    const t = threads[id];
    const div = document.createElement('div');
    div.className = 'thread-item';
    div.id = 'item-' + id;
    div.innerHTML = `<div class="title">${t.title}</div><div class="meta">${t.date} · ${t.source}</div>`;
    div.onclick = () => renderThread(id);
    list.appendChild(div);
  });

  if (Object.keys(threads).length > 0) {
      renderThread(Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp)[0]);
  }
</script>
