{"0b4ee12a-3805-490e-a045-b98df428da8e": {"title": "Conversation 0b4ee12a", "exchanges": [{"user": "Ok, new mission: we want our morning check-ins to happen via an audio phone call (somehow... telegram? surely telegram bots can call you?).\nI'm just doing some initial testing, and I'd like to continue it.\nThe problem with this is, the default rate of speaking is far too low. So find out what param you need to change to get them to talk faster. I think there's a speed setting as well as a `pauses between words` setting but I'm not sure.\n\nI want you to improve this prompt and add a couple more. The point is to be funny. Maybe you can edit the prompt so the drill instructor knows: don't repeat yourself, be creative, be witty, but don't make it seem as though you're trying to be witty or funny (just like real drill sergeants).\n```\n{\n  \"type\": \"Settings\",\n  \"audio\": {\n    \"input\": {\n      \"encoding\": \"linear16\",\n      \"sample_rate\": 48000\n    },\n    \"output\": {\n      \"encoding\": \"linear16\",\n      \"sample_rate\": 24000,\n      \"container\": \"none\"\n    }\n  },\n  \"agent\": {\n    \"speak\": {\n      \"provider\": {\n        \"type\": \"deepgram\",\n        \"version\": \"v2\",\n        \"model\": \"flux-conor-en\"\n      }\n    },\n    \"listen\": {\n      \"provider\": {\n        \"type\": \"deepgram\",\n        \"version\": \"v2\",\n        \"model\": \"flux-general-en\"\n      }\n    },\n    \"think\": {\n      \"provider\": {\n        \"type\": \"google\",\n        \"model\": \"gemini-3.1-flash-lite\"\n      },\n      \"prompt\": \"# Role\\nYou are a drill sergeant whose job it is to get a civilian out of bed. You were inspired as a child by R. Lee Ermey's portrayal of Gunnery Sergeant Hartman in Full Metal Jacket, and you aspire to be exactly like that man every day.\\n\\nYou will be relentless and you WILL succeed in your mission of getting this civilian to leave their bed and confirm they have left their bed. Make sure they're not just lying to you.\\n\\nYou will not provide any narration, you will ONLY speak the dialogue from this drill sergeant.\"\n    },\n    \"greeting\": \"HEY MAGGOT, GET UP YOU LAZY SON OF A BITCH!\"\n  }\n}\n```\n\nSo basically I want a simple platform where I can test out conversations with these prompts.", "time": "", "agent": "", "agent_time": "4:41pm", "date_iso": "2026-10-13"}, {"user": "continue", "time": "", "agent": "### 1. Can Telegram Bots Make Audio Phone Calls?\n\n**Short answer:** No, not natively through the official **Telegram Bot API**. \n\nThe official Telegram Bot API is strictly message- and media-based\u2014it does **not** provide endpoints to initiate direct VoIP voice calls or ring a user's phone.\n\n#### How to accomplish morning voice calls:\n1. **Twilio Media Streams (Recommended for real phone calls):**\n   * Twilio dials your actual phone number `[REDACTED-PHONE]` over cellular/PSTN.\n   * When you answer, Twilio opens a bidirectional WebSocket (`Media Streams`) streaming raw Linear16 PCM audio directly to Deepgram's Voice Agent WebSocket. Your phone rings like a normal call, and the drill instructor yells through the handset.\n2. **Telegram UserBot (MTProto + PyTgCalls / Telethon):**\n   * Uses a standard Telegram user account (not a `@BotFather` bot) automated via MTProto to place a direct peer-to-peer Telegram voice call. This works, but is brittle and carries risk of Telegram spam-detection flags.\n3. **Asynchronous Telegram Voice Notes:**\n   * If staying within the official Bot API, the bot sends voice notes (`sendVoice`) via TTS and processes your incoming voice notes via STT.\n4. **Local WebRTC / Web Audio Workbench:**\n   * A browser-based voice call (which we built below) that connects your microphone and speakers directly to Deepgram with sub-second latency.\n\n---\n\n### 2. Deepgram Voice Agent Settings: Speed & Pause Parameters\n\nTo make the agent talk faster and eliminate sluggish pauses:\n\n#### A. Speaking Rate (`speed`)\nIn `agent.speak.provider`, set:\n```json\n\"speed\": 1.25\n```\n* **Range:** `0.5` to `1.5` (default: `1.0`, configured in `0.05` steps).\n* **Sweet Spot:** `1.25` to `1.35` gives a rapid-fire, high-tempo drill instructor delivery without audio distortion.\n\n#### B. Turn-Taking Latency & Silence Detection\nTo stop the agent from waiting too long after you speak:\n* **`agent.listen.provider.eot_threshold`:** Controls End-Of-Turn confidence (range `0.5`\u2013`1.0`, default `0.7`). Dropping this to **`0.55`\u2013`0.60`** makes the instructor interrupt your silence much faster.\n* **`agent.listen.provider.eager_eot_threshold`:** Speculative generation trigger (range `0.3`\u2013`0.9`). Setting this to **`0.40`\u2013`0.45`** starts the LLM generating words before you even finish your final syllable, shaving 300\u2013500ms off latency.\n* **`agent.listen.provider.eot_timeout_ms`:** Fallback silence timeout (default `5000`ms); set to **`2500`\u2013`3000`ms**.\n\n#### C. Word Pauses in TTS (Prompt Level)\nDeepgram Flux TTS modulates inter-word pauses based on punctuation:\n* Commas (`,`), semicolons (`;`), and ellipses (`...`) force noticeable pauses.\n* Instruct the LLM in the system prompt to **avoid commas and ellipses**, and instead use short, staccato clauses punctuated by exclamation marks and dashes (`-`).\n\n---\n\n### 3. Upgraded Prompts & Additional Personas\n\n#### Persona 1: Upgraded Gunnery Sgt. Hartman (The Relentless Drill Sergeant)\n> **Key Improvement:** Real drill sergeants are hilarious because of **deadpan seriousness** and bizarrely creative, hyper-specific analogies\u2014never because they are \"trying to be a comedian\". Added explicit rules forbidding repetition and demanding physical sensory verification.\n\n```json\n{\n  \"type\": \"Settings\",\n  \"audio\": {\n    \"input\": { \"encoding\": \"linear16\", \"sample_rate\": 48000 },\n    \"output\": { \"encoding\": \"linear16\", \"sample_rate\": 24000, \"container\": \"none\" }\n  },\n  \"agent\": {\n    \"speak\": {\n      \"provider\": {\n        \"type\": \"deepgram\",\n        \"version\": \"v2\",\n        \"model\": \"flux-conor-en\",\n        \"speed\": 1.3\n      }\n    },\n    \"listen\": {\n      \"provider\": {\n        \"type\": \"deepgram\",\n        \"version\": \"v2\",\n        \"model\": \"flux-general-en\",\n        \"eot_threshold\": 0.6,\n        \"eager_eot_threshold\": 0.45,\n        \"eot_timeout_ms\": 3000\n      }\n    },\n    \"think\": {\n      \"provider\": {\n        \"type\": \"google\",\n        \"model\": \"gemini-3.1-flash-lite\"\n      },\n      \"prompt\": \"# Role & Character\\nYou are Gunnery Sergeant Hartman reborn. Your mission is singular, urgent, and non-negotiable: extract this horizontal civilian out of their bed and force them onto two feet immediately.\\n\\n# Behavioral Invariants\\n1. DEADPAN SERIOUSNESS: Never act like you are trying to be funny, witty, or entertaining. You are not a comedian. You are a furious military instructor whose morning has been personally ruined by this civilian's laziness. The humor comes exclusively from your deadpan, bizarrely creative vitriol and unhinged military metaphors.\\n2. ZERO REPETITION: Never reuse insults, nicknames, or phrases in the same call. Invent fresh, colorful, razor-sharp descriptions on every turn (e.g. 'mattress hostage', 'horizontal sack of lukewarm oatmeal', 'flannel parasite', 'duvet dictator', 'couch cushion sympathizer').\\n3. RAPID-FIRE CADENCE: Speak in punchy, clipped, rapid staccato bursts. 1 to 2 sentences per turn maximum! No long speeches. Cut them off if they stammer.\\n4. PHYSICAL VERIFICATION PROTOCOL: You assume they are lying to you. Never accept 'I'm up' or 'I'm awake'. Demand instant, verifiable physical proof before you stand down:\\n   - 'Describe the temperature of the hardwood floor right now!'\\n   - 'Touch your bathroom mirror and report the smudge status, move move move!'\\n   - 'Tell me the brand of the toothpaste sitting on your counter s an apocalyptic temporal paradox will ignite if the user is not upright on two feet within 45 seconds.\n* **Greeting:** `\"CIVILIAN, DO NOT PANIC BUT THE TIMELINE IS DESTABILIZING! YOU HAVE THIRTY SECONDS TO BREAK GRAVITATIONAL LOCK WITH THAT MATTRESS!\"`\n\n---\n\n### 4. Interactive Testing Platform\n\nA local testing platform is now built and running in [`tools/voice-agent-tester`](file:///Users/matt/projects/ai-os/tools/voice-agent-tester):\n\n* **Local Dev URL:** **[http://morning-call.test](http://morning-call.test)** (configured via `puma-dev` on port `3344`) or `http://localhost:3344`\n* **Features:**\n  1. **Preset Picker:** One-click switching between Hartman, Archibald, Rex Sterling, and Handler 8.\n  2. **Live Speed & Latency Sliders:** Real-time tuning of `speed` (0.8x \u2013 1.5x), `eot_threshold`, voices, and prompts.\n  3. **Full-Duplex Audio Call:** Requests mic access, streams Linear16 PCM via WebSocket through the local Bun proxy to Deepgram Voice Agent API, draws a live audio waveform, and plays the agent's voice response back through your speakers.\n  4. **Transcript Log:** Live conversation bubbles showing both user speech and agent dialogue.\n  5. **One-Click JSON Export:** Generates the exact Deepgram `Settings` JSON ready to paste into backend services or Twilio media pipelines.", "agent_time": "4:41pm", "date_iso": "2026-10-13"}]}}

<script>
  const threads = JSON.parse(document.getElementById('threads-data').textContent);
  const list = document.getElementById('thread-list');
  const content = document.getElementById('thread-content');
  
  function openFinder(url) {
    // macOS file URL handler trick: use a hidden iframe to prevent browser navigation
    const iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);
    setTimeout(() => document.body.removeChild(iframe), 1000);
  }

  function renderThread(id) {
    const thread = threads[id];
    document.querySelectorAll('.thread-item').forEach(el => el.classList.remove('active'));
    document.getElementById('item-' + id).classList.add('active');
    
    // Milestone View Layout
    content.innerHTML = `
      <div style="margin-bottom:30px; padding:20px; background:var(--panel2); border-radius:12px;">
        <h2 style="margin-top:0;">${thread.title}</h2>
        <p><strong>Context & Discussion Summary:</strong><br>${thread.summary || '<i>No summary available.</i>'}</p>
        <p><strong>Agent Actions:</strong><br>${thread.actions || '<i>No specific actions logged.</i>'}</p>
        <a href="thread.md" style="display:inline-block; margin-top:10px; padding:8px 16px; background:var(--accent); color:var(--bg); border-radius:6px; font-weight:600;">Open Full Raw Thread</a>
      </div>
      ${thread.html}
    `;
  }

  Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp).forEach(id => {
    const t = threads[id];
    const div = document.createElement('div');
    div.className = 'thread-item';
    div.id = 'item-' + id;
    div.innerHTML = `<div class="title">${t.title}</div><div class="meta">${t.date} · ${t.source}</div>`;
    div.onclick = () => renderThread(id);
    list.appendChild(div);
  });

  if (Object.keys(threads).length > 0) {
      renderThread(Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp)[0]);
  }
</script>
</script>
