ile on disk**, wiping away the appended text.\n4. When another commit check completed, the badge was re-appended, only to be wiped away on the very next re-render.\n\n---\n\n### 2. The `.commit_results` JSON Displacement Race\nTo stop [`gen_conversation_md.py`](file:///Users/matt/projects/ai-os/scripts/gen_conversation_md.py) from erasing the commit text, a `.commit_results/` JSON cache was added so the generator could read commit status dynamically.\n\nHowever, the lookup initially inspected `results[0]` (the most recent file):\n1. A commit succeeded $\\to$ wrote `{\"status\": \"committed\", \"sha\": \"...\"}` $\\to$ `results[0]` was `committed` $\\to$ Badge rendered.\n2. A second later, [`watch_transcripts.py`](file:///Users/matt/projects/ai-os/scripts/watch_transcripts.py) ran a routine status check on a clean repo $\\to$ [`auto_commit.py`](file:///Users/matt/projects/ai-os/scripts/auto_commit.py) wrote `{\"status\": \"no_changes\"}`.\n3. Now `results[0]` was `{\"status\": \"no_changes\"}` $\\to$ [`gen_conversation_md.py`](file:///Users/matt/projects/ai-os/scripts/gen_conversation_md.py) saw `status != \"committed\"` and **stripped the badge**.\n4. When a new commit completed, `results[0]` became `committed` again $\\to$ Badge reappeared $\\to$ next check made it vanish again.\n\n---\n\n### 3. The `i == 0` Floating Exchange Bug\nThe generator was attaching the commit badge exclusively to the newest exchange (`if i == 0:`):\n1. On Turn $N$, the badge appeared at the bottom of Turn $N$.\n2. The instant you submitted prompt $N+1$, Turn $N+1$ became `i == 0` and Turn $N$ became `i == 1`.\n3. Turn $N$ immediately lost its commit badge (because it was no longer `i == 0`), while Turn $N+1$ (which hadn't even executed or committed yet) inherited the old commit badge from Turn $N$.\n4. During partial streaming/tool execution, the badge would vanish or reappear depending on whether the turn had substantive text or transient status lines.\n\n---\n\n### 4. The `needs_repair` <script>
  const threads = JSON.parse(document.getElementById('threads-data').textContent);
  const list = document.getElementById('thread-list');
  const content = document.getElementById('thread-content');
  
  function openFinder(url) {
    // macOS file URL handler trick: use a hidden iframe to prevent browser navigation
    const iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);
    setTimeout(() => document.body.removeChild(iframe), 1000);
  }

  function renderThread(id) {
    const thread = threads[id];
    document.querySelectorAll('.thread-item').forEach(el => el.classList.remove('active'));
    document.getElementById('item-' + id).classList.add('active');
    
    // Milestone View Layout
    content.innerHTML = `
      <div style="margin-bottom:30px; padding:20px; background:var(--panel2); border-radius:12px;">
        <h2 style="margin-top:0;">${thread.title}</h2>
        <p><strong>Context & Discussion Summary:</strong><br>${thread.summary || '<i>No summary available.</i>'}</p>
        <p><strong>Agent Actions:</strong><br>${thread.actions || '<i>No specific actions logged.</i>'}</p>
        <a href="thread.md" style="display:inline-block; margin-top:10px; padding:8px 16px; background:var(--accent); color:var(--bg); border-radius:6px; font-weight:600;">Open Full Raw Thread</a>
      </div>
      ${thread.html}
    `;
  }

  Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp).forEach(id => {
    const t = threads[id];
    const div = document.createElement('div');
    div.className = 'thread-item';
    div.id = 'item-' + id;
    div.innerHTML = `<div class="title">${t.title}</div><div class="meta">${t.date} · ${t.source}</div>`;
    div.onclick = () => renderThread(id);
    list.appendChild(div);
  });

  if (Object.keys(threads).length > 0) {
      renderThread(Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp)[0]);
  }
</script>
</script>
