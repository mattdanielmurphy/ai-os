to your document queue and immediately confirm whether the document was approved or flag it for priority assessment.\n\n---\n\n*Conversation thread recorded in [thread.md](file:///Users/matt/.gemini/antigravity-ide/brain/65d2c1c9-9ee2-4958-a4e5-4c1239cc8a23/thread.md).*", "agent_time": "5:56am", "date_iso": "2026-08-25"}, {"user": "Because I start on sept 1, so if I don't get the disability grant on sept 1, do I lose out on that term?", "time": "", "agent": "**No, absolutely not.** You will **not** lose out on the grant for the Fall term.\n\nHere is how student aid and university disbursement rules actually work:\n\n---\n\n### 1. Grants are 100% Retroactive\nAlberta Student Aid and Canada Student Grants are calculated for your entire study period. \n* As long as your Schedule 4 is processed before the term deadline (which is **30 days before the end of the study period**, meaning mid-November for Fall), **it applies retroactively back to September 1**.\n* Once the assessor finishes reviewing your Schedule 4, the system generates an **Amended Notice of Assessment** and immediately direct-deposits the **$1,400 Fall disability grant** into your bank account as a supplemental payment.\n\n---\n\n### 2. September 1 is the *Start Date*, Not a Deadline\n* **Disbursement Window:** September 1 is just the *earliest day* funds can legally begin releasing for Fall; disbursements routinely flow throughout September and October.\n* **U of A Tuition Deadline:** University of Alberta tuition for Fall is **not due on September 1**\u2014the official fee payment deadline is **September 30**. Even if funding arrives mid-September, you are completely within the normal window.\n\n---\n\n### 3. How the Funds Will Flow If There Is a Delay\n* **Scenario A (Schedule 4 clears this week):** Your full package\u2014including the $1,400 Fall Canada Student Grant for Disabilities, low-income grants, and loans\u2014disburses together in the first week of September.\n* **Scenario B (Schedule 4 clears after Sept 1):** Your primary assessed funding (base full-time grants & loans) disburses first. When the Schedule 4 review completes shortly after, a separate **+$1,400 direct deposit** hits your bank account automatically.\n\n---\n\n### Summary\nYou do **not** forfeit a single dollar. Calling `1-855-606-2096` simply helps ensure your **40% course load (2 courses)** is recognized as full-time without automated system delays when U of A confirms your enrollment.\n\n---\n\n*Conversation thread recorded in [thread.md](file:///Users/matt/.gemini/antigravity-ide/brain/65d2c1c9-9ee2-4958-a4e5-4c1239cc8a23/thread.md).*", "agent_time": "5:57am", "date_iso": "2026-08-25"}, {"user": "I've got a 60% course load, so that's not a concern right now. I have an appt with a u of a accommodations person who said they can help me with getting the disability thing for student aid when I signed up for the intake appt.", "time": "", "agent": "That is the best possible position to be in\u2014it completely eliminates any risk of a funding delay or enrollment hold:\n\n---\n\n### 1. 60% Course Load Means 100% Guaranteed Full-Time Status\n* At **60% (3 courses / 9 credits)**, Alberta Student Aid and U of A automatically classify you as a **Full-Time Student** under standard rules, regardless of whether the disability paperwork has finished processing.\n* When U of A confirms your enrollment for September 1, the system will clear it immediately, and your **standard full-time grants (CSG-FT, Alberta Student Grant) and loan disbursements will release right on schedule**.\n\n---\n\n### 2. Why the ARDS Intake Appointment is the \"Fast Lane\"\nWorking directly with your U of A Accessibility Resources advisor during your intake is the easiest and most reliable way to finalize the disability setup:\n\n1. **Direct Institutional Portal Submission:** Accessibility advisors have direct administrative channels to Alberta Student Aid. When they verify your medical documentation and electronically sign off on **Section 3 & 4 of Schedule 4**, it bypasses the standard general public queue.\n2. **Unlocks the $2,800 Disability Grant:** As soon as ARDS submits/endorses your disability verification, Alberta Student Aid updates your master file and releases the **$1,400/term grant** (retroactively deposited into your bank account).\n3. **Services & Equipment Grant (CSG-DSE \u2014 Up to $20,000/yr):** Your ARDS advisor is also the one who writes the formal recommendations and quotes for assistive technology (e.g., FM wireless systems for hearing loss, live captioning tools, ergonomic equipment, and tutoring supports).\n4. **Academic Accommodations:** They will issue your official Accommodation Letter to professors for exam provisions (extra time, private testing rooms) and classroom audio accommodations.\n\n---\n\n### Bottom Line\nYou are in great shape:\n* Your **tuition and baseline living funding will flow normally on time** with your 60% load.\n* Your **disability grant ($2,800) and assistive tech funding** will be seamlessly finalized through your U of A advisor without you having to stress about bureaucratic delays.\n\n---\n\n*Conversation thread recorded in [thread.md](file:///Users/matt/.gemini/antigravity-ide/brain/65d2c1c9-9ee2-4958-a4e5-4c1239cc8a23/thread.md).*", "agent_time": "5:59am", "date_iso": "2026-08-25"}, {"user": "ok can you write down anything we discussed that's not already documented?", "time": "", "agent": "All the key insights, rules, and operational strategies from our discussion have been documented and committed to your vault:\n\n---\n\n### Summary of What Was Documented\n\n1. **60% Course Load Full-Time Guarantee:**\n   * Documented that your enrollment in **3 courses / 9 credits (60% load)** automatically satisfies standard Alberta Student Aid and U of A full-time status.\n   * Confirms your base full-time grants (CSG-FT, Alberta Student Grant) and student loans will disburse on schedule around **September 1** with zero enrollment confirmation ent.\n* **[log.md](file:///Users/matt/Library/Mobile%20Documents/iCloud~md~obsidian/Documents/Personal/log.md)** \u2014 Appended wiki changelog entry for August 25, 2026.\n\n*(All changes have been staged, committed, and pushed to your remote repository).*\n\n---\n\n*Conversation thread recorded in [thread.md](file:///Users/matt/.gemini/antigravity-ide/brain/65d2c1c9-9ee2-4958-a4e5-4c1239cc8a23/thread.md).*", "agent_time": "6:01am", "date_iso": "2026-08-25"}, {"user": "oh, I meant to ask this.\nI saw some banks have bonuses for signing up for a private loan for students?\nWould that ever make sense to do even if I don't need the money?\nPresumably they charge interest and their bonus would never outweigh the interest?", "time": "", "agent": "The short answer is **yes, it can be mathematically profitable, but primarily because of how lines of credit work\u2014not because the interest is cheap.**\n\nHere is the exact breakdown of how private student lines of credit work, the math behind the bonuses, and whether it\u2019s actually worth your time.\n\n---\n\n### 1. Why the Bonus Can Outweigh the Interest\nIn Canada, banks offer **Student Lines of Credit (SLOC)** rather than fixed lump-sum loans. \n\n* **Interest is Only Charged on What You Draw:** If a bank approves you for a $10,000 line of credit with a $150\u2013$300 welcome bonus, and you leave the balance at **$0**, you pay **$0.00 in interest**.\n* **Even if a Draw is Required:** If a promotion requires you to draw $1,000 for 30\u201360 days to trigger the bonus:\n  * At a Prime rate of ~6.5%\u20137.5%, the interest on $1,000 for 30 days is only **~$5.50**.\n  * A $150 or $200 welcome bonus easily nets you **+$145 to +$195 in pure profit** after repaying the $1,000.\n\n---\n\n### 2. The Hidden Catches & Drawbacks\nWhile the math works on paper, there are three practical hurdles:\n\n1. **Mandatory Co-Signer (Guarantor) for Undergrads:**\n   * Unlike professional programs (Medicine, Law, Dentistry) where banks hand out unsecured $100k+ lines with no co-signer, standard undergraduate SLOCs almost always require a **creditworthy co-signer (parent)** to guarantee the debt.\n2. **Hard Credit Bureau Pull:**\n   * Opening a line of credit places a hard inquiry on your Equifax/TransUnion report, which temporarily dings your score if you are already opening new student bank accounts or credit cards (like your BMO Student MasterCard).\n3. **No Government Protections:**\n   * Unlike federal student loans (which are **0% interest permanently**) and Alberta loans (**0% while studying + 12-month grace post-grad**), bank lines of credit charge floating prime-based interest immediately if used and require monthly interest payments.\n\n---\n\n### 3. Does It Affect Government Student Aid?\n* **No.** Alberta Student Aid and Canada Student Grants are calculated based on your prior-year taxable income (Line 15000), not your available bank credit lines. Opening a private line of credit does **not** claw back or reduce your government grants.\n\n---\n\n### Verdict: Is It Worth It?\n\n| Scenario | Recommendation |\n| :--- | :--- |\n| **Using it to fund school** | \u274c **Never** \u2014 Government grants & 0% student aid provide far superior capital. |\n| **No-co-signer promo ($100\u2013$250 bonus, $0 draw)** | \ud83d\udfe1 **Optional Churn** \u2014 Free cash if you don't mind a hard inquiry. |\n| **Requires parent co-signer / extensive branch visits** | \u274c **Skip** \u2014 Too much friction for a $100\u2013$200 bonus when your attention is better spent on university scholarships, Keyera Energy ($3k\u2013$6k), and HISA yield optimization. |\n\n---\n\n*Conversation thread recorded in [thread.md](file:///Users/matt/.gemini/antigravity-ide/brain/65d2c1c9-9ee2-4958-a4e5-4c1239cc8a23/thread.md).*", "agent_time": "6:03am", "date_iso": "2026-08-25"}]}}

<script>
  const threads = JSON.parse(document.getElementById('threads-data').textContent);
  const list = document.getElementById('thread-list');
  const content = document.getElementById('thread-content');
  
  function openFinder(url) {
    // macOS file URL handler trick: use a hidden iframe to prevent browser navigation
    const iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);
    setTimeout(() => document.body.removeChild(iframe), 1000);
  }

  function renderThread(id) {
    const thread = threads[id];
    document.querySelectorAll('.thread-item').forEach(el => el.classList.remove('active'));
    document.getElementById('item-' + id).classList.add('active');
    
    // Milestone View Layout
    content.innerHTML = `
      <div style="margin-bottom:30px; padding:20px; background:var(--panel2); border-radius:12px;">
        <h2 style="margin-top:0;">${thread.title}</h2>
        <p><strong>Context & Discussion Summary:</strong><br>${thread.summary || '<i>No summary available.</i>'}</p>
        <p><strong>Agent Actions:</strong><br>${thread.actions || '<i>No specific actions logged.</i>'}</p>
        <a href="thread.md" style="display:inline-block; margin-top:10px; padding:8px 16px; background:var(--accent); color:var(--bg); border-radius:6px; font-weight:600;">Open Full Raw Thread</a>
      </div>
      ${thread.html}
    `;
  }

  Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp).forEach(id => {
    const t = threads[id];
    const div = document.createElement('div');
    div.className = 'thread-item';
    div.id = 'item-' + id;
    div.innerHTML = `<div class="title">${t.title}</div><div class="meta">${t.date} · ${t.source}</div>`;
    div.onclick = () => renderThread(id);
    list.appendChild(div);
  });

  if (Object.keys(threads).length > 0) {
      renderThread(Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp)[0]);
  }
</script>
