nnoying (the cursor doesn't proceed along the path you expect; instead of going to the next cell in the current row or column, it just goes wherever it wants basically).\n\nAnd hitting \"space\" doesn't turn it in to a blank space, and hitting Tab doesn't toggle across/down mode.", "time": "", "agent": "", "agent_time": "4:01am", "date_iso": "2026-10-09"}, {"user": "actually regarding the arrow keys: you move by two cells for one single arrow key press", "time": "", "agent": "### Root Cause Isolated & Fixed\n\nThe arrow key jumping bug (moving two cells on a single key press) was caused by a **double-dispatch event loop**:\n1. When focused on the proxy input, pressing an arrow key executed [`handleInputKeyDown`](file:///Users/matt/projects/daily-mini-crossword/src/components/creator/PuzzleCreator.tsx#L416-L454) (`setActiveRow` / `setActiveCol`).\n2. Because the handler lacked `e.stopPropagation()`, the event bubbled to the window key listener (`handleKeyDown`).\n3. The window listener checked `target.getAttribute(\"aria-hidden\") !== \"true\"`. Because the invisible proxy input carried `aria-hidden=\"true\"`, that check evaluated to `false`, causing the window listener to **execute a second time in the exact same macrotick**.\n\nThis exact double execution was responsible for all of the keyboard and navigation bugs:\n- **Arrow keys**: Ran twice per press $\\rightarrow$ stepped 2 cells (skipping over empty cells to the next filled cell).\n- **Tab key**: Toggled Across $\\rightarrow$ Down $\\rightarrow$ Across in a split millisecond $\\rightarrow$ appeared to do nothing.\n- **Space key**: Toggled Blank Block $\\rightarrow$ Letter $\\rightarrow$ Blank Block in a split millisecond $\\rightarrow$ appeared to do nothing.\n- **Backspace**: Ran twice $\\rightarrow$ deleted current cell, stepped backward, and deleted the preceding cell.\n\n---\n\n### What Was Fixed\n\n1. **Arrow Keys (Strict 1-Cell Stepping)**:\n   - Added immediate `e.stopPropagation()` in [`handleInputKeyDown`](file:///Users/matt/projects/daily-mini-crossword/src/components/creator/PuzzleCreator.tsx#L416-L454).\n   - Guarded the window keydown listener with `if (target === inputRef.current || target.tagName === \"INPUT\" || ...) return;` and timestamp debouncing.\n   - Arrow keys now strictly move **exactly 1 cell** per press in all directions.\n\n2. **Tab Key (Single Toggle)**:\n   - Tab cleanly flips between Across and Down mode once per press.\n\n3. **Space Key (Single Blank Toggle)**:\n   - Space (as well as `.` or `#`) toggles the active cell between a letter square and a black block once per press.\n\n4. **Backspace & Delete Behavior**:\n   - **`Delete`**: Clears the active cell in place with zero cursor movement.\n   - **`Backspace`**: Clears the current cell's letter in place; if the cell is already empty, moves back one cell along the active orientation (`col - 1` Across, `row - 1` Down) and clears it.\n   - **Block Invariant**: Backspace and typing now **never overwrite or erase black squares (`\".\"`)**. Typing letters automatically steps over black blocks to the next open cell.\n\n5. **Row & Column Highlighting (Across vs. Down Mode)**:\n   - In Across mode, the active row is highlighted in a vivid emerald tint (`bg-emerald-100 dark:bg-emerald-950/60`), and the active cell is highlighted in `bg-emerald-300 dark:bg-emerald-800` with an emerald focus ring.\n   - In Down mode, the active column is highlighted identically.\n   - If the cursor rests on a black block, [`activeSegmentCellKeys`](file:///Users/matt/projects/daily-mini-crossword/src/components/creator/PuzzleCreator.tsx#L125-L142) automatically highlights all open cells in that row or column so the selected axis is always unmistakable.\n   - Added an active mode pill right above the grid (`\u2794 ACROSS (Row 1) Tab \u21e5` / `\u2b07 DOWN (Col 1) Tab \u21e5`).\n\n6. **Context-Aware Autocomplete**:\n   - Autocomplete automatically evaluates the active row or column and what is already filled in without needing to type anything in the override box.\n   - [`getActiveSegment`](file:///Users/matt/projects/daily-mini-crossword/src/lib/crossword/creator-utils.ts#L276-L350) now resolves the nearest open word segment even if the cursor touches a block.\n   - Clicking **Fill $\\rightarrow$** drops the candidate word directly into the active row/column.\n\n7. **Your \"America\" Puzzle Preserved & Auto-Saved**:\n   - Saved your complete **America** puzzle (`custom-america`) with all 10 clues and answers for Tyler to [data/custom-puzzles.json](file:///Users/matt/projects/daily-mini-crossword/data/custom-puzzles.json#L66-L130).\n   - Added `localStorage` draft auto-save and restore (`daily-mini-creator-draft`). When visiting `/creator`, your draft is immediately hydrated; if no draft exists, it defaults to loading **America**.\n   - Hardened `/api/creator/save` so database sync is non-blocking and disk saves never fail.", "agent_time": "4:13am", "date_iso": "2026-10-09"}]}}

<script>
  const threads = JSON.parse(document.getElementById('threads-data').textContent);
  const list = document.getElementById('thread-list');
  const content = document.getElementById('thread-content');
  
  function openFinder(url) {
    // macOS file URL handler trick: use a hidden iframe to prevent browser navigation
    const iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);
    setTimeout(() => document.body.removeChild(iframe), 1000);
  }

  function renderThread(id) {
    const thread = threads[id];
    document.querySelectorAll('.thread-item').forEach(el => el.classList.remove('active'));
    document.getElementById('item-' + id).classList.add('active');
    
    // Milestone View Layout
    content.innerHTML = `
      <div style="margin-bottom:30px; padding:20px; background:var(--panel2); border-radius:12px;">
        <h2 style="margin-top:0;">${thread.title}</h2>
        <p><strong>Context & Discussion Summary:</strong><br>${thread.summary || '<i>No summary available.</i>'}</p>
        <p><strong>Agent Actions:</strong><br>${thread.actions || '<i>No specific actions logged.</i>'}</p>
        <a href="thread.md" style="display:inline-block; margin-top:10px; padding:8px 16px; background:var(--accent); color:var(--bg); border-radius:6px; font-weight:600;">Open Full Raw Thread</a>
      </div>
      ${thread.html}
    `;
  }

  Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp).forEach(id => {
    const t = threads[id];
    const div = document.createElement('div');
    div.className = 'thread-item';
    div.id = 'item-' + id;
    div.innerHTML = `<div class="title">${t.title}</div><div class="meta">${t.date} · ${t.source}</div>`;
    div.onclick = () => renderThread(id);
    list.appendChild(div);
  });

  if (Object.keys(threads).length > 0) {
      renderThread(Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp)[0]);
  }
</script>
</script>
