karounds for GLIC\n\nHere are the real technical paths forward to get your custom instructions into GLIC or an equivalent workflow:\n\n#### Idea 1: Gemini \"Gems\" (The Clean Workspace Native Route)\nCheck whether your U of A account has access to **Gemini Gems** (`gemini.google.com/gems`).\n- Even when Workspace admins disable \"Saved Info\", they often leave **Gems** enabled.\n- You can create a Gem (e.g. named *\"U of A Assistant\"* or *\"Default\"*) and bake your full system prompt directly into the Gem's definition.\n- If Glic supports selecting Gems via the UI or `@` mentions, this is fully supported by Google and syncs automatically without breaking browser security sandboxes.\n\n#### Idea 2: Launch Chrome with `--glic-guest-url` Override\nChromium includes internal flags for testing Glic environments:\n```bash\n--glic-guest-url=\"https://gemini.google.com/glic\"\n--glic-webui-allowed-origins=\"https://gemini.google.com\"\n```\nIf you point `--glic-guest-url` to a local reverse proxy (e.g. a tiny Bun/Node HTTP proxy on `localhost:3456` that proxies `gemini.google.com/glic` and injects an inline `<script>` tag before serving HTML), Glic will load your modified version of the client UI with custom instructions preloaded.\n\n#### Idea 3: Chrome DevTools Protocol (CDP) Daemon\nAntigravity and Chrome both speak CDP. If Chrome is launched with `--remote-debugging-port=9222`:\n- Chrome extensions cannot touch Glic, but **CDP has root authority over all renderers**.\n- A small local daemon (or script) connects via WebSocket to `http://localhost:9222/json`, targets the `chrome-untrusted://glic` page, and calls:\n  ```json\n  {\"method\": \"Runtime.evaluate\", \"params\": {\"expression\": \"/* inject your instructions here */\"}}\n  ```\n- This completely bypasses the extension sandbox.\n\n#### Idea 4: Hammerspoon / macOS Accessibility (AX) Macro\nSince you already have Hammerspoon integrated into your workflow:\n- Hammerspoon can register a global hotkey (or trigger w <script>
  const threads = JSON.parse(document.getElementById('threads-data').textContent);
  const list = document.getElementById('thread-list');
  const content = document.getElementById('thread-content');
  
  function openFinder(url) {
    // macOS file URL handler trick: use a hidden iframe to prevent browser navigation
    const iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);
    setTimeout(() => document.body.removeChild(iframe), 1000);
  }

  function renderThread(id) {
    const thread = threads[id];
    document.querySelectorAll('.thread-item').forEach(el => el.classList.remove('active'));
    document.getElementById('item-' + id).classList.add('active');
    
    // Milestone View Layout
    content.innerHTML = `
      <div style="margin-bottom:30px; padding:20px; background:var(--panel2); border-radius:12px;">
        <h2 style="margin-top:0;">${thread.title}</h2>
        <p><strong>Context & Discussion Summary:</strong><br>${thread.summary || '<i>No summary available.</i>'}</p>
        <p><strong>Agent Actions:</strong><br>${thread.actions || '<i>No specific actions logged.</i>'}</p>
        <a href="thread.md" style="display:inline-block; margin-top:10px; padding:8px 16px; background:var(--accent); color:var(--bg); border-radius:6px; font-weight:600;">Open Full Raw Thread</a>
      </div>
      ${thread.html}
    `;
  }

  Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp).forEach(id => {
    const t = threads[id];
    const div = document.createElement('div');
    div.className = 'thread-item';
    div.id = 'item-' + id;
    div.innerHTML = `<div class="title">${t.title}</div><div class="meta">${t.date} · ${t.source}</div>`;
    div.onclick = () => renderThread(id);
    list.appendChild(div);
  });

  if (Object.keys(threads).length > 0) {
      renderThread(Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp)[0]);
  }
</script>
