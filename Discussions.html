_probe.log](file:///Users/matt/projects/qwerty-midi-hammerspoon/tmp/nanokey_probe.log).\n- **Studio Suite Orchestrator ([packages/studio-suite/init.lua](file:///Users/matt/projects/qwerty-midi-hammerspoon/packages/studio-suite/init.lua))**: Designed to run QWERTY (Ch 1) and nanoKEY (Ch 2) side-by-side with shared music clock and harmony.\n\n---\n\n### 2. Can you test it just by opening the overlay with `Cmd+Shift+M`?\n\n**Not yet.** If you press `Cmd+Shift+M` right now, only the standard QWERTY MIDI overlay will open.\n\nHere is why:\n1. **Production Bundle Target**: The build pipeline (`bin/bundle_and_reload.sh`) targets `--target qwerty-midi`, compiling [src/init.lua](file:///Users/matt/projects/qwerty-midi-hammerspoon/src/init.lua) into [qwerty_midi.lua](file:///Users/matt/projects/qwerty-midi-hammerspoon/qwerty_midi.lua) (which is symlinked into `~/.hammerspoon/modules/qwerty_midi.lua`). The nanoKEY driver is currently isolated in `packages/nanokey-studio` and `packages/studio-suite` and is not imported by [src/init.lua](file:///Users/matt/projects/qwerty-midi-hammerspoon/src/init.lua).\n2. **Current Device Status**: A live check of Hammerspoon's CoreMIDI device list (`hs.midi.devices()`) currently sees:\n   ```\n   { \"Network\", \"IAC Driver\", \"Digital Piano\", \"Bluetooth\" }\n   ```\n   The physical nanoKEY Studio is not currently plugged in via USB or connected via Bluetooth MIDI.\n\n---\n\n### 3. How to test it right now\n\n#### Step 1: Connect the Hardware\n- **USB**: Plug in the nanoKEY Studio.\n- **Bluetooth**: Open **Audio MIDI Setup** > **MIDI Studio** window (`Cmd+2`) > click the **Bluetooth** globe icon > pair and connect the nanoKEY Studio.\n\n#### Step 2: Test Raw Connectivity with the Diagnostic Probe\nYou can verify that Hammerspoon sees the controller and receives its messages without touching your QWERTY setup:\n\nRun this command in terminal (or execute it in Hammerspoon Console):\n```bash\nosascript -e 'tell application \"Hammerspoon\" to <script>
  const threads = JSON.parse(document.getElementById('threads-data').textContent);
  const list = document.getElementById('thread-list');
  const content = document.getElementById('thread-content');
  
  function openFinder(url) {
    // macOS file URL handler trick: use a hidden iframe to prevent browser navigation
    const iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);
    setTimeout(() => document.body.removeChild(iframe), 1000);
  }

  function renderThread(id) {
    const thread = threads[id];
    document.querySelectorAll('.thread-item').forEach(el => el.classList.remove('active'));
    document.getElementById('item-' + id).classList.add('active');
    
    // Milestone View Layout
    content.innerHTML = `
      <div style="margin-bottom:30px; padding:20px; background:var(--panel2); border-radius:12px;">
        <h2 style="margin-top:0;">${thread.title}</h2>
        <p><strong>Context & Discussion Summary:</strong><br>${thread.summary || '<i>No summary available.</i>'}</p>
        <p><strong>Agent Actions:</strong><br>${thread.actions || '<i>No specific actions logged.</i>'}</p>
        <a href="thread.md" style="display:inline-block; margin-top:10px; padding:8px 16px; background:var(--accent); color:var(--bg); border-radius:6px; font-weight:600;">Open Full Raw Thread</a>
      </div>
      ${thread.html}
    `;
  }

  Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp).forEach(id => {
    const t = threads[id];
    const div = document.createElement('div');
    div.className = 'thread-item';
    div.id = 'item-' + id;
    div.innerHTML = `<div class="title">${t.title}</div><div class="meta">${t.date} · ${t.source}</div>`;
    div.onclick = () => renderThread(id);
    list.appendChild(div);
  });

  if (Object.keys(threads).length > 0) {
      renderThread(Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp)[0]);
  }
</script>
</script>
