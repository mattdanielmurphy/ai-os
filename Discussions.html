ers who are due for an iMessage at the current hour and calls Photon to dispatch the message containing their personalized URL.\n\n### 3. Mobile-First UI/UX\n- **Board Grid:** Designed specifically for phone screens (4x4 to 6x6 max grid size). High contrast, clear cell focus.\n- **Input & Navigation:** Smooth auto-advancement across letter fields when typing; intelligent backspacing. Works seamlessly with mobile native soft-keyboards.\n- **Clue Display:** Fixed active clue display directly above the board/keyboard to prevent vertical page scrolling.\n- **Hint System:** Optional \"Gimme a letter\" button for stuck users (tracks usage in telemetry).\n- **Completion View:** Short celebratory animation on win, displaying streak counter and completion time.\n\n### 4. Open Puzzle Ingestion & Filtering Script\n- Ingest open-source crossword datasets (e.g., `.xd` corpus or JSON repositories).\n- Include an ingestion script that:\n  - Filters strictly for small grid sizes (4x4 or 5x5).\n  - Cross-checks answer words against a top 5,000 common English word frequency list.\n  - Automatically discards puzzles containing obscure \"crosswordese\" (e.g., *ETUI*, *ERNE*, *ALEE*).\n  - Populates the database with pre-cleared, low-friction daily puzzles.\n\n### 5. Telemetry & Tracking\n- Track session metrics per profile:\n  - `user_id` (`dad`)\n  - `puzzle_date`\n  - `completion_status` (Boolean)\n  - `time_taken_seconds`\n  - `hints_used`\n- Simple dashboard or admin endpoint (e.g., `/admin`) to monitor Dad's completion activity and streak.\n\n## Instructions for Developer\n1. Scaffold the project structure and database schema for `users`, `puzzles`, and `user_progress`.\n2. Build the data filtering script and seed 30 days of clean mini-puzzles.\n3. Implement the `/p/[username]` mobile UI and game state logic.\n4. Set up the Vercel Cron job and Photon iMessage notification dispatch handler logic.\n5. Provide local development steps and environment variable configuration guide.\n\n/ <script>
  const threads = JSON.parse(document.getElementById('threads-data').textContent);
  const list = document.getElementById('thread-list');
  const content = document.getElementById('thread-content');
  
  function openFinder(url) {
    // macOS file URL handler trick: use a hidden iframe to prevent browser navigation
    const iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);
    setTimeout(() => document.body.removeChild(iframe), 1000);
  }

  function renderThread(id) {
    const thread = threads[id];
    document.querySelectorAll('.thread-item').forEach(el => el.classList.remove('active'));
    document.getElementById('item-' + id).classList.add('active');
    
    // Milestone View Layout
    content.innerHTML = `
      <div style="margin-bottom:30px; padding:20px; background:var(--panel2); border-radius:12px;">
        <h2 style="margin-top:0;">${thread.title}</h2>
        <p><strong>Context & Discussion Summary:</strong><br>${thread.summary || '<i>No summary available.</i>'}</p>
        <p><strong>Agent Actions:</strong><br>${thread.actions || '<i>No specific actions logged.</i>'}</p>
        <a href="thread.md" style="display:inline-block; margin-top:10px; padding:8px 16px; background:var(--accent); color:var(--bg); border-radius:6px; font-weight:600;">Open Full Raw Thread</a>
      </div>
      ${thread.html}
    `;
  }

  Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp).forEach(id => {
    const t = threads[id];
    const div = document.createElement('div');
    div.className = 'thread-item';
    div.id = 'item-' + id;
    div.innerHTML = `<div class="title">${t.title}</div><div class="meta">${t.date} · ${t.source}</div>`;
    div.onclick = () => renderThread(id);
    list.appendChild(div);
  });

  if (Object.keys(threads).length > 0) {
      renderThread(Object.keys(threads).sort((a,b) => threads[b].timestamp - threads[a].timestamp)[0]);
  }
</script>
</script>
